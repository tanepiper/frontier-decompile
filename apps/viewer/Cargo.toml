[package]
name = "frontier-viewer"
version = "0.1.0"
description = "Resource browser for the Frontier: Elite II (DOS) game files (native and WASM)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "frontier-viewer"
path = "src/main.rs"

[dependencies]
frontier-formats = { path = "../../crates/formats" }
frontier-game = { path = "../../crates/game" }
frontier-opl = { path = "../../crates/opl" }
frontier-platform = { path = "../../crates/platform" }
wgpu = { version = "30", features = ["webgl"] }
winit = "0.30"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = { version = "0.37", default-features = false }
web-time = "1"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
frontier-dos = { path = "../../crates/dos" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
