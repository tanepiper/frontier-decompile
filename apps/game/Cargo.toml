[package]
name = "frontier-app"
version = "0.1.0"
description = "Frontier: Elite II reimplementation (native and WASM)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "frontier"
path = "src/main.rs"

[dependencies]
frontier-formats = { path = "../../crates/formats" }
frontier-dos = { path = "../../crates/dos" }
frontier-game = { path = "../../crates/game" }
frontier-hooks = { path = "../../crates/hooks" }
wgpu = { version = "30", features = ["webgl"] }
winit = "0.30"
web-time = "1"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "Location", "Element", "HtmlCanvasElement", "HtmlInputElement", "File", "FileList", "Blob", "Event", "EventTarget", "Response", "UrlSearchParams"] }
console_error_panic_hook = "0.1"
console_log = "1"
