<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Asteroids draws on a vector display, where each frame the beam strokes a list of lines. The 12.096 MHz master clock gives a 6502 at 1.512 MHz and a vector refresh of about 61.5 Hz.">
<title>Asteroids draws on a vector display, where each frame the beam strokes a list of lines. The 12.096 MHz master clock gives a 6502 at 1.512 MHz and a vector refresh of about 61.5 Hz.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">ASTEROIDS DRAWS WITH THE BEAM</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">A vector game draws a list of strokes each frame. Compare these lists before you compare pixels.</text>
<path d="M120 160L170 120L230 140L250 200L200 250L130 230L120 160" fill="none" stroke="#dff" stroke-width="2" stroke-dasharray="405" stroke-dashoffset="405"><animate attributeName="stroke-dashoffset" values="405;0;0" keyTimes="0;0.6;1" dur="2s" repeatCount="indefinite"/></path>
<path d="M420 220L440 170L460 220L440 208L420 220" fill="none" stroke="#dff" stroke-width="2" stroke-dasharray="154" stroke-dashoffset="154"><animate attributeName="stroke-dashoffset" values="154;0;0" keyTimes="0;0.6;1" dur="2s" repeatCount="indefinite"/></path>
<rect x="60.0" y="90.0" width="460.0" height="200.0" rx="6" fill="none" stroke="#64748b"/>
<text x="560.0" y="104.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">stroke list, one frame:</text>
<text x="560.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">MOVE 120,160</text>
<text x="560.0" y="140.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">DRAW 170,120</text>
<text x="560.0" y="158.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">DRAW 230,140</text>
<text x="560.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">...</text>
<text x="560.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">MOVE 420,220</text>
<text x="560.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">DRAW 440,170</text>
<text x="560.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">...</text>
<text x="60.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">12.096 MHz master: 6502 at 1.512 MHz. Vector refresh (12.096 MHz / 4096) / 12 / 4 = about 61.5 Hz.</text>
<text x="60.0" y="334.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Lunar Lander divides by 6 instead of 4. Asteroids Deluxe adds a POKEY.</text>
<text x="560.0" y="268.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">The coordinates are an illustration.</text>
</svg>
