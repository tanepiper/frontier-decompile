<text x="528.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">port</text>
<text x="528.0" y="155.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">new code</text>
<path d="M590.0 140.0L612.0 140.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="614.0" y="110.0" width="120.0" height="60.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.28"/>
