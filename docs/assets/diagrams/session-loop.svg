<text x="820.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">land</text>
<text x="820.0" y="155.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">docs, commit</text>
<path d="M800 172C 800 230 90 230 90 174" fill="none" stroke="#8fa9a5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="445.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">the next slice, or back to trace when a check fails</text>
</svg>
