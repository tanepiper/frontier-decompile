<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Every input the game reads from outside, gathered through one entry point into the port's core">
<title>Every input the game reads from outside, gathered through one entry point into the port's core</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">EVERYTHING THE GAME READS FROM OUTSIDE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The game reads controls, time, randomness, files, the system and the network. The port takes each through one entry point.</text>
<rect x="350.0" y="160.0" width="200.0" height="70.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="450.0" y="193.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">the core</text>
<text x="450.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">one input record per step</text>
<rect x="60.0" y="90.0" width="160.0" height="52.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
<text x="140.0" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">controls</text>
<text x="140.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">keys, mouse, pads</text>
<path d="M222.0 116.0L346.0 195.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="60.0" y="180.0" width="160.0" height="52.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
<text x="140.0" y="204.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">time</text>
<text x="140.0" y="221.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">clock, timers, frame time</text>
<path d="M222.0 206.0L346.0 195.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="60.0" y="270.0" width="160.0" height="52.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
<text x="140.0" y="294.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">randomness</text>
<text x="140.0" y="311.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">seeds from the clock</text>
<path d="M222.0 296.0L346.0 195.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="690.0" y="90.0" width="160.0" height="52.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
<text x="770.0" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">files</text>
<text x="770.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">data, saves, settings</text>
<path d="M688.0 116.0L554.0 195.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="690.0" y="180.0" width="160.0" height="52.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
<text x="770.0" y="204.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">the system</text>
<text x="770.0" y="221.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">window, focus, display</text>
<path d="M688.0 206.0L554.0 195.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="690.0" y="270.0" width="160.0" height="52.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
<text x="770.0" y="294.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">other machines</text>
<text x="770.0" y="311.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">network messages</text>
<path d="M688.0 296.0L554.0 195.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
