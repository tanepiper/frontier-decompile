<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="In Copylock's trace vector decoder, the trace exception runs after every instruction. It decrypts the next instruction and encrypts the last one again, so only one instruction is readable at a time.">
<title>In Copylock's trace vector decoder, the trace exception runs after every instruction. It decrypts the next instruction and encrypts the last one again, so only one instruction is readable at a time.</title>
