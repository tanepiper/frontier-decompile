<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="The TMS9900 keeps only PC, WP and ST on the chip. Its sixteen registers are sixteen words in RAM at the workspace pointer. BLWP switches to a new workspace and saves the old WP, PC and ST in R13 to R15.">
