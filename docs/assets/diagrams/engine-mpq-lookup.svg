<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="To find a file in a Blizzard MPQ archive, the game hashes the name to a start slot in the hash table. Two more hashes confirm the entry, which leads to the block table and the data">
<title>To find a file in a Blizzard MPQ archive, the game hashes the name to a start slot in the hash table. Two more hashes confirm the entry, which leads to the block table and the data</title>
<rect x="0.5" y="0.5" width="899" height="389" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">FINDING A FILE IN A BLIZZARD MPQ ARCHIVE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The game computes three hashes of the file name. The first picks a slot in the table. The other two confirm the entry.</text>
<rect x="24.0" y="92.0" width="210.0" height="40.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="129.0" y="115.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#e2ece9" text-anchor="middle">"units\human\marine.grp"</text>
<text x="24.0" y="156.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">hash 0 mod the table size gives the start slot</text>
<text x="24.0" y="173.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">hash A and hash B are stored to confirm it</text>
<text x="280.0" y="86.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">hash table</text>
<rect x="280.0" y="92.0" width="190.0" height="22.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<text x="288.0" y="107.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">0</text>
<text x="310.0" y="107.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">empty</text>
<rect x="280.0" y="118.0" width="190.0" height="22.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.15"/>
<text x="288.0" y="133.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">1</text>
<text x="310.0" y="133.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">A, B of another name</text>
<rect x="280.0" y="144.0" width="190.0" height="22.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.15"/>
<text x="288.0" y="159.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">2</text>
<text x="310.0" y="159.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">A, B of another name</text>
<rect x="280.0" y="170.0" width="190.0" height="22.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.35"/>
<text x="288.0" y="185.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">3</text>
<text x="310.0" y="185.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">A, B match</text>
<rect x="280.0" y="196.0" width="190.0" height="22.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<text x="288.0" y="211.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">4</text>
<text x="310.0" y="211.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">empty</text>
<rect x="280.0" y="222.0" width="190.0" height="22.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.15"/>
<text x="288.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">5</text>
<text x="310.0" y="237.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">A, B of another name</text>
<rect x="280.0" y="248.0" width="190.0" height="22.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<text x="288.0" y="263.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">6</text>
<text x="310.0" y="263.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">empty</text>
<rect x="280.0" y="274.0" width="190.0" height="22.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.15"/>
<text x="288.0" y="289.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">7</text>
<text x="310.0" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">A, B of another name</text>
<rect x="277" width="196" height="26" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5"><animate attributeName="y" values="116;142;168" keyTimes="0;0.25;0.5" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
<g opacity="0"><text x="484" y="174" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="11" fill="#2dd4bf">found</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5000;1.0000" dur="5s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="280.0" y="318.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">if the slot does not match, try the next one</text>
<text x="280.0" y="334.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">an empty slot means that the file is absent</text>
<path d="M474.0 181.0L560.0 181.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="564.0" y="150.0" width="150.0" height="60.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.22"/>
<text x="639.0" y="177.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">block table</text>
<text x="639.0" y="193.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">offset, sizes, flags</text>
<path d="M716.0 180.0L746.0 180.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="750.0" y="150.0" width="126.0" height="60.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="813.0" y="177.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">file data</text>
<text x="813.0" y="193.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">in sectors</text>
<text x="564.0" y="236.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Flags say if the file is compressed</text>
<text x="564.0" y="253.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">(several methods) or encrypted.</text>
<text x="564.0" y="270.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">The key comes from the file name.</text>
<text x="24.0" y="374.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">StormLib reads MPQ archives. storm.dll exports its functions by ordinal; community lists name many.</text>
</svg>
