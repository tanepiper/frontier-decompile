<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="A game that waits for the player. Nothing changes until a command arrives. The rules then resolve it in a fixed order into a new state. An animation loop may run without changing the state">
<title>A game that waits for the player. Nothing changes until a command arrives. The rules then resolve it in a fixed order into a new state. An animation loop may run without changing the state</title>
<rect x="0.5" y="0.5" width="899" height="319" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">A GAME THAT WAITS FOR THE PLAYER</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Nothing changes until the player gives a command. The rules then resolve the command, in a fixed order, into a new state.</text>
<rect x="24.0" y="110.0" width="170.0" height="60.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="109.0" y="137.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">state</text>
<text x="109.0" y="153.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">board, flags, inventory</text>
<g opacity="0"><rect x="24.0" y="200.0" width="170.0" height="40.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.35"/>
<text x="109.0" y="223.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">the command "open door"</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2000;0.9800" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<path d="M110 198L110 174" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2500;0.9800" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></path>
<g opacity="0"><rect x="236.0" y="118.0" width="150.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="311.0" y="143.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">check it is allowed</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3000;0.9800" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="236.0" y="118.0" width="150.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.08"/>
<g opacity="0"><rect x="398.0" y="118.0" width="150.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="473.0" y="143.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">apply effects in order</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4000;0.9800" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="398.0" y="118.0" width="150.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.08"/>
<g opacity="0"><rect x="560.0" y="118.0" width="150.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="635.0" y="143.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">draw random numbers</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5000;0.9800" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="560.0" y="118.0" width="150.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.08"/>
<g opacity="0"><rect x="722.0" y="118.0" width="150.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="797.0" y="143.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">run scripts it triggers</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6000;0.9800" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="722.0" y="118.0" width="150.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.08"/>
<g opacity="0"><rect x="236.0" y="190.0" width="636.0" height="34.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="554.0" y="211.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2ece9" text-anchor="middle">the new state, then wait again</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7200;0.9800" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="236.0" y="100.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">resolving one move</text>
<text x="24.0" y="264.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">An animation loop may run while the game waits. Find which parts only animate and which change the state.</text>
<text x="24.0" y="282.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">A recording is the list of commands.</text>
<text x="24.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Check the rules move by move. The same command on the same state must give the same new state.</text>
</svg>
