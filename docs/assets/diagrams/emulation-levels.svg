<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Levels at which the original can be replaced: low-level emulation copies the chips, high-level emulation copies the system software, a reimplementation copies the game">
<title>Levels at which the original can be replaced: low-level emulation copies the chips, high-level emulation copies the system software, a reimplementation copies the game</title>
<rect x="0.5" y="0.5" width="899" height="339" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">WHAT EACH APPROACH REPLACES</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each approach replaces a different set of the original's layers.</text>
<rect x="40.0" y="86.0" width="380.0" height="50.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="230.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">the game's rules and data</text>
<rect x="40.0" y="144.0" width="380.0" height="50.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="230.0" y="174.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">the game's engine code</text>
<rect x="40.0" y="202.0" width="380.0" height="50.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="230.0" y="232.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">system software: OS, sound driver, graphics microcode</text>
<rect x="40.0" y="260.0" width="380.0" height="50.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="230.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">the chips: CPU, video, sound</text>
<text x="530.0" y="80.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">low-level emulation</text>
<rect x="470.0" y="260.0" width="120.0" height="50.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="530.0" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">new code</text>
<text x="670.0" y="80.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">high-level emulation</text>
<rect x="610.0" y="202.0" width="120.0" height="108.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="670.0" y="260.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">new code</text>
<text x="810.0" y="80.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">reimplementation</text>
<rect x="750.0" y="86.0" width="120.0" height="224.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.3"/>
<text x="810.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">new code</text>
<text x="40.0" y="330.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The original's code still runs in the layers above each new block. A reimplementation runs none of it.</text>
</svg>
