<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="ANTIC reads an Atari display list with one instruction per mode line, such as blank lines, a text mode with a screen address, and a jump that waits for vertical blank. A display list interrupt changes a colour part way down the screen.">
<title>ANTIC reads an Atari display list with one instruction per mode line, such as blank lines, a text mode with a screen address, and a jump that waits for vertical blank. A display list interrupt changes a colour part way down the screen.</title>
<rect x="0.5" y="0.5" width="899" height="419" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE ATARI DISPLAY LIST</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">ANTIC runs a small program each frame. Each instruction sets the mode of one or more lines.</text>
<rect x="24.0" y="92.0" width="340.0" height="34.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<text x="36.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">70 70 70</text>
<text x="130.0" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">24 blank lines</text>
<rect x="24.0" y="132.0" width="340.0" height="34.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="36.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">42 00 40</text>
<text x="130.0" y="154.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">text mode 2, screen at $4000</text>
<rect x="24.0" y="172.0" width="340.0" height="34.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="36.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">02 x 10</text>
<text x="130.0" y="194.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">10 more text rows</text>
<rect x="24.0" y="212.0" width="340.0" height="34.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.2"/>
<text x="36.0" y="234.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">82</text>
<text x="130.0" y="234.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">text row with the DLI bit ($80)</text>
<rect x="24.0" y="252.0" width="340.0" height="34.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.2"/>
<text x="36.0" y="274.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">0F x 40</text>
<text x="130.0" y="274.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">40 lines of hi-res mode F</text>
<rect x="24.0" y="292.0" width="340.0" height="34.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<text x="36.0" y="314.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">41 00 06</text>
<text x="130.0" y="314.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">jump to the list, wait for VBLANK</text>
<rect x="470.0" y="92.0" width="380.0" height="31.2" rx="0" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<rect x="470.0" y="123.2" width="380.0" height="114.4" rx="0" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<rect x="470.0" y="237.6" width="380.0" height="10.4" rx="0" fill="#f59e0b" stroke="none" fill-opacity="0.5"/>
<rect x="470.0" y="248.0" width="380.0" height="52.0" rx="0" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<rect x="470" y="248.0" width="380" height="52.0" fill="#f87171" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0.35;0" keyTimes="0;0.750;0.999" calcMode="discrete" dur="3.0s" repeatCount="indefinite"/></rect>
<rect x="470" y="92" width="380" height="2" fill="#e2ece9"><animate attributeName="y" values="92;298.0" dur="3.0s" repeatCount="indefinite"/></rect>
<text x="856.0" y="252.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="start">DLI</text>
<text x="470.0" y="320.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">The DLI handler writes WSYNC, then a new colour.</text>
<text x="470.0" y="336.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Everything below it shows the new colour.</text>
<text x="24.0" y="372.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Record the display list and every DLI. Together they set the mode and colours of each line.</text>
<text x="24.0" y="390.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Display list interrupts are enabled through NMIEN.</text>
</svg>
