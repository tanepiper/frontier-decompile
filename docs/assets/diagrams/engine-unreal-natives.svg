<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="UnrealScript byte code in a .u package runs in the interpreter in Core.dll. A native call goes by its fixed number through a table to C++ code in an engine DLL">
<title>UnrealScript byte code in a .u package runs in the interpreter in Core.dll. A native call goes by its fixed number through a table to C++ code in an engine DLL</title>
