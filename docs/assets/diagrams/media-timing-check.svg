<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="In a timing check, the program reads a clock before and after a short piece of code. When the program runs normally, the gap is small. Under a debugger, the gap is long and the check fails">
<title>In a timing check, the program reads a clock before and after a short piece of code. When the program runs normally, the gap is small. Under a debugger, the gap is long and the check fails</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">A TIMING CHECK AGAINST DEBUGGERS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The program reads a clock, runs a little code and reads the clock again. Under a debugger, the gap is long.</text>
<text x="24.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">run normally</text>
<rect x="240.0" y="100.0" width="6.0" height="32.0" rx="1" fill="#f59e0b" stroke="none"/>
<text x="243.0" y="94.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#f59e0b" text-anchor="middle">read clock</text>
<rect x="250" y="104" height="24" rx="3" fill="#2dd4bf" fill-opacity="0.45" width="0"><animate attributeName="width" values="0;60;60" keyTimes="0;0.6;1" dur="6.0s" repeatCount="indefinite"/></rect>
<rect x="314.0" y="100.0" width="6.0" height="32.0" rx="1" fill="#f59e0b" stroke="none"/>
<text x="317.0" y="94.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#f59e0b" text-anchor="middle">read clock</text>
<text x="330.0" y="121.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#2dd4bf" text-anchor="start">the gap is small, so the program carries on</text>
<text x="24.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">under a debugger, stepping</text>
<rect x="240.0" y="180.0" width="6.0" height="32.0" rx="1" fill="#f59e0b" stroke="none"/>
<text x="243.0" y="174.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#f59e0b" text-anchor="middle">read clock</text>
<rect x="250" y="184" height="24" rx="3" fill="#f87171" fill-opacity="0.45" width="0"><animate attributeName="width" values="0;440;440" keyTimes="0;0.6;1" dur="6.0s" repeatCount="indefinite"/></rect>
<rect x="694.0" y="180.0" width="6.0" height="32.0" rx="1" fill="#f59e0b" stroke="none"/>
<text x="697.0" y="174.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#f59e0b" text-anchor="middle">read clock</text>
<text x="250.0" y="230.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#f87171" text-anchor="start">the gap is long, so the check fails</text>
<text x="24.0" y="262.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">re-emulate calls one function with chosen inputs, so start-up checks never run. Note any check made during play,</text>
<text x="24.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">with its address, so the port can leave it out.</text>
</svg>
