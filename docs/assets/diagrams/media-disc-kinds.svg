<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="The layouts of the kinds of CD, which are data only, mixed mode with audio after the data track, Enhanced CD with data in a second session, multi-session, hybrid ISO 9660 and HFS, and bootable discs with El Torito">
<title>The layouts of the kinds of CD, which are data only, mixed mode with audio after the data track, Enhanced CD with data in a second session, multi-session, hybrid ISO 9660 and HFS, and bootable discs with El Torito</title>
