<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Intellivision ROM words are 10 bits wide. SDBD builds a 16-bit operand from two of them">
<title>Intellivision ROM words are 10 bits wide. SDBD builds a 16-bit operand from two of them</title>
<rect x="0.5" y="0.5" width="899" height="339" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">INTELLIVISION ROM WORDS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The CP1610 addresses 16-bit words. Cartridge ROM gives 10 bits of each word.</text>
<text x="40.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">one ROM word</text>
<rect x="40.0" y="106.0" width="130.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="105.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">unused</text>
<rect x="172.0" y="106.0" width="218.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="281.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">10 bits of data</text>
<text x="40.0" y="172.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">SDBD, then an instruction with an immediate operand</text>
<rect x="40.0" y="182.0" width="42.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="61.0" y="201.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">x</text>
<rect x="84.0" y="182.0" width="174.0" height="30.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="171.0" y="201.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">low byte</text>
<text x="270.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">first word</text>
<rect x="40.0" y="220.0" width="42.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="61.0" y="239.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">x</text>
<rect x="84.0" y="220.0" width="174.0" height="30.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="171.0" y="239.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">high byte</text>
<text x="270.0" y="240.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">second word</text>
<path d="M340.0 220.0L384.0 220.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="390.0" y="205.0" width="174.0" height="30.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="477.0" y="224.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">high byte</text>
<rect x="566.0" y="205.0" width="174.0" height="30.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="653.0" y="224.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">low byte</text>
<text x="390.0" y="260.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">one 16-bit operand</text>
<text x="760.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">registers</text>
<rect x="760.0" y="106.0" width="110.0" height="20.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="768.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">R0</text>
<rect x="760.0" y="130.0" width="110.0" height="20.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="768.0" y="144.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">R1</text>
<rect x="760.0" y="154.0" width="110.0" height="20.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="768.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">R2</text>
<rect x="760.0" y="178.0" width="110.0" height="20.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="768.0" y="192.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">R3</text>
<rect x="760.0" y="202.0" width="110.0" height="20.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="768.0" y="216.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">R4</text>
<rect x="760.0" y="226.0" width="110.0" height="20.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="768.0" y="240.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">R5</text>
<rect x="760.0" y="250.0" width="110.0" height="20.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="768.0" y="264.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">R6  stack</text>
<rect x="760.0" y="274.0" width="110.0" height="20.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="768.0" y="288.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">R7  PC</text>
<text x="40.0" y="296.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Game code also calls into the Executive ROM. A port must reproduce what that ROM does, so trace those</text>
<text x="40.0" y="313.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">calls too.</text>
</svg>
