<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="A write watchpoint on a value's address: when the game writes it, the debugger stops at the instruction that wrote, which leads to the rule">
<title>A write watchpoint on a value's address: when the game writes it, the debugger stops at the instruction that wrote, which leads to the rule</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">FROM THE ADDRESS TO THE CODE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Watch the address for writes. The instruction that writes it is in the rule you want.</text>
<rect x="40.0" y="100.0" width="220.0" height="60.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="150.0" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">gold at 0x04A1F3C</text>
<text x="150.0" y="145.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">watch: break on write</text>
<rect x="340.0" y="100.0" width="220.0" height="60.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="450.0" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">the game buys a tool</text>
<text x="450.0" y="145.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">gold 250 -&gt; 230</text>
<path d="M262.0 130.0L336.0 130.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<g opacity="0"><rect x="640" y="100" width="220" height="60" rx="6" fill="#f87171" fill-opacity="0.3"/><text x="750" y="126" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">stopped at 0x4127A0</text><text x="750" y="146" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="middle">sub [esi+0x3c], eax</text><path d="M562 130H636" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.333;0.333;1" dur="6s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="40" y="210" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">0x4127A0 is in FUN_004126f0: the purchase rule. esi points to the player, and +0x3c is the gold field.</text><text x="40" y="234" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Name the function in labels/names.tsv and the field in labels/fields.tsv.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.667;0.667;1" dur="6s" repeatCount="indefinite"/></g>
</svg>
