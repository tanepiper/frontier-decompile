<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416" role="img" aria-label="An Unreal package has a header that points at a name table, an import table and an export table. Objects refer to each other by index, positive for exports and negative for imports">
<title>An Unreal package has a header that points at a name table, an import table and an export table. Objects refer to each other by index, positive for exports and negative for imports</title>
<rect x="0.5" y="0.5" width="899" height="415" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE LAYOUT OF AN UNREAL PACKAGE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Code, textures, sounds and maps are all stored in packages. Every reference is an index into one of the tables.</text>
<rect x="24.0" y="84.0" width="200.0" height="128.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
<text x="36.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">header</text>
<text x="36.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">tag  C1 83 2A 9E</text>
<text x="36.0" y="141.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">version</text>
<text x="36.0" y="158.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">name count, offset</text>
<text x="36.0" y="175.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">export count, offset</text>
<text x="36.0" y="192.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">import count, offset</text>
<rect x="260.0" y="84.0" width="196.0" height="160.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.16"/>
<text x="270.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">name table</text>
<text x="270.0" y="126.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">0  None</text>
<text x="270.0" y="144.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">1  Engine</text>
<text x="270.0" y="162.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">2  Weapon</text>
<text x="270.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">3  Class</text>
<text x="270.0" y="198.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">4  MyWeapon</text>
<text x="270.0" y="216.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">5  Fire</text>
<rect x="470.0" y="84.0" width="196.0" height="160.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.16"/>
<text x="480.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">import table</text>
<text x="480.0" y="126.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">1  Class Engine.Weapon</text>
<text x="480.0" y="144.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">2  Package Engine</text>
<text x="480.0" y="162.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">3  Class Core.Class</text>
<rect x="680.0" y="84.0" width="196.0" height="160.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.16"/>
<text x="690.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">export table</text>
<text x="690.0" y="126.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">1  MyWeapon, class -3</text>
<text x="690.0" y="144.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">   parent -1</text>
<text x="690.0" y="162.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">2  Fire, inside 1</text>
<path d="M226.0 130.0L256.0 130.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="24.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">An object index in the file</text>
<rect x="24.0" y="292.0" width="80.0" height="22.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="64.0" y="307.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">above 0</text>
<text x="116.0" y="307.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">an export, entry number index in the export table</text>
<rect x="24.0" y="320.0" width="80.0" height="22.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="64.0" y="335.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">below 0</text>
<text x="116.0" y="335.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">an import, entry number -index in the import table</text>
<rect x="24.0" y="348.0" width="80.0" height="22.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="64.0" y="363.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">0</text>
<text x="116.0" y="363.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">no object</text>
<text x="560.0" y="286.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">MyWeapon's class is -3, which is import 3,</text>
<text x="560.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Core.Class. Its parent is -1, which is</text>
<text x="560.0" y="322.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">import 1, Engine.Weapon. Names are</text>
<text x="560.0" y="340.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">indices into the name table too.</text>
<text x="24.0" y="400.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">Licensees changed the format. Read the version in each header and check which fields your version has.</text>
</svg>
