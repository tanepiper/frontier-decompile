<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Four steps for a studio engine. List the archives, read the rule tables and text, list the opcodes of the script interpreter, then trace the native code for what remains">
<title>Four steps for a studio engine. List the archives, read the rule tables and text, list the opcodes of the script interpreter, then trace the native code for what remains</title>
<rect x="0.5" y="0.5" width="899" height="289" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">FOUR STEPS FOR A STUDIO ENGINE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">In these games, many rules are stored as data. Read the data before the code.</text>
<rect x="24.0" y="92.0" width="196.0" height="60.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="122.0" y="119.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">1. Archives</text>
<text x="122.0" y="135.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">list every file</text>
<text x="122.0" y="174.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">usually documented</text>
<path d="M222.0 122.0L238.0 122.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="240.0" y="92.0" width="196.0" height="60.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="338.0" y="119.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">2. Rule tables</text>
<text x="338.0" y="135.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">INI, 2DA, records</text>
<text x="338.0" y="174.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">many rules are here</text>
<path d="M438.0 122.0L454.0 122.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="456.0" y="92.0" width="196.0" height="60.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="554.0" y="119.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">3. Scripts</text>
<text x="554.0" y="135.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">list the opcodes</text>
<text x="554.0" y="174.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">mission and quest logic</text>
<path d="M654.0 122.0L670.0 122.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="672.0" y="92.0" width="196.0" height="60.0" rx="4" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="770.0" y="119.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">4. Native code</text>
<text x="770.0" y="135.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">what remains</text>
<text x="770.0" y="174.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">simulation, combat, paths, AI</text>
<text x="24.0" y="216.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Examples</text>
<text x="24.0" y="236.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Westwood uses .MIX and RULES.INI. Blizzard uses .MPQ. The Infinity Engine uses chitin.key, .2da and .bcs.</text>
<text x="24.0" y="254.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Fallout uses .DAT archives, .PRO prototypes and scripts in SSL compiled to .INT byte code.</text>
</svg>
