<rect x="244.0" y="158.0" width="632.0" height="54.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.16"/>
<text x="258.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2ece9" text-anchor="start">Reimplement it</text>
<text x="258.0" y="199.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">translate the frame loop and clips</text>
<text x="560.0" y="199.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">check against captures; mark deviations</text>
<path d="M156 178C 200 178 200 252 240 252" fill="none" stroke="#8fa9a5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="244.0" y="226.0" width="632.0" height="54.0" rx="4" fill="#f87171" stroke="none" fill-opacity="0.16"/>
<text x="258.0" y="248.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2ece9" text-anchor="start">Rebuild the decompiled project</text>
<text x="258.0" y="267.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">FFDec exports, the AIR SDK compiles</text>
<text x="560.0" y="267.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">the original's code is in it, so take legal care</text>
