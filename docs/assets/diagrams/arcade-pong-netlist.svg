<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Pong has no CPU. Counters and gates driven by a clock make the picture. MAME emulates it as a netlist, and a port simulates the circuit.">
<title>Pong has no CPU. Counters and gates driven by a clock make the picture. MAME emulates it as a netlist, and a port simulates the circuit.</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">PONG AS A CIRCUIT OF COUNTERS AND GATES</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Counters and logic gates make the picture. There is no code to disassemble.</text>
<rect x="24.0" y="120.0" width="130.0" height="56.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="89.0" y="153.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">clock</text>
<rect x="200.0" y="90.0" width="160.0" height="50.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="280.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">horizontal counter</text>
<rect x="200.0" y="156.0" width="160.0" height="50.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="280.0" y="186.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">vertical counter</text>
<rect x="410.0" y="90.0" width="160.0" height="50.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
