<path d="M754.0 148.0L766.0 148.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect width="5" height="5" fill="#e2ece9"><animate attributeName="x" values="788;860;788" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="104;190;104" dur="1.3s" repeatCount="indefinite"/></rect>
<text x="24.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The game's behaviour comes from the gates, the counters and their timing. Use MAME's netlist as the</text>
<text x="24.0" y="264.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">description of the circuit. Breakout uses the same approach.</text>
</svg>
