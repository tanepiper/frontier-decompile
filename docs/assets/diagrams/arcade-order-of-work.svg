<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Read the MAME driver, decrypt the program, capture the DSP programs and record the DIP settings, BIOS, region and NVRAM. Then check MAME's flags before you use it as ground truth.">
<title>Read the MAME driver, decrypt the program, capture the DSP programs and record the DIP settings, BIOS, region and NVRAM. Then check MAME's flags before you use it as ground truth.</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">ORDER OF WORK ON AN ARCADE BOARD</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Do these five steps before the port starts.</text>
<rect x="24.0" y="90.0" width="154.0" height="110.0" rx="8" fill="#2dd4bf" stroke="none" fill-opacity="0.2"/>
<text x="36.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">1. MAME driver</text>
<text x="36.0" y="142.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">clocks, screen</text>
<text x="36.0" y="159.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">totals, flags</text>
<rect x="24" y="90" width="154" height="110" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.00;0.20;1" calcMode="discrete" dur="7.5s" repeatCount="indefinite"/></rect>
<rect x="198.0" y="90.0" width="154.0" height="110.0" rx="8" fill="#f87171" stroke="none" fill-opacity="0.2"/>
<text x="210.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">2. decrypt</text>
<text x="210.0" y="142.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">wherever the board</text>
<text x="210.0" y="159.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">has a custom CPU</text>
<path d="M180.0 145.0L195.0 145.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="198" y="90" width="154" height="110" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.20;0.40;1" calcMode="discrete" dur="7.5s" repeatCount="indefinite"/></rect>
<rect x="372.0" y="90.0" width="154.0" height="110.0" rx="8" fill="#c084fc" stroke="none" fill-opacity="0.2"/>
<text x="384.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">3. DSP programs</text>
<text x="384.0" y="142.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">on a 3D board</text>
<text x="384.0" y="159.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">they hold game logic</text>
<path d="M354.0 145.0L369.0 145.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="372" y="90" width="154" height="110" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.40;0.60;1" calcMode="discrete" dur="7.5s" repeatCount="indefinite"/></rect>
<rect x="546.0" y="90.0" width="154.0" height="110.0" rx="8" fill="#f59e0b" stroke="none" fill-opacity="0.2"/>
<text x="558.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">4. test inputs</text>
<text x="558.0" y="142.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">DIPs, BIOS, region,</text>
<text x="558.0" y="159.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">NVRAM image</text>
<path d="M528.0 145.0L543.0 145.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="546" y="90" width="154" height="110" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.60;0.80;1" calcMode="discrete" dur="7.5s" repeatCount="indefinite"/></rect>
<rect x="720.0" y="90.0" width="154.0" height="110.0" rx="8" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="732.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">5. check flags</text>
<text x="732.0" y="142.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MAME as ground</text>
<text x="732.0" y="159.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">truth, or not</text>
<path d="M702.0 145.0L717.0 145.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="720" y="90" width="154" height="110" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.80;1.00;1" calcMode="discrete" dur="7.5s" repeatCount="indefinite"/></rect>
<text x="24.0" y="240.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">If MAME does not run a game, take ground truth from another emulator or from owned hardware.</text>
<text x="24.0" y="262.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A port must run at the board's own refresh rate to stay in step with a recording.</text>
</svg>
