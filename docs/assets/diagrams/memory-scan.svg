<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="A memory scan: search for the value, change it in the game, search again among the matches; the candidates fall until one address is left">
<title>A memory scan: search for the value, change it in the game, search again among the matches; the candidates fall until one address is left</title>
<rect x="0.5" y="0.5" width="899" height="319" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">SCAN, CHANGE, SCAN AGAIN</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each scan keeps only the addresses whose value changed the way the game's did.</text>
<g opacity="1"><rect x="40" y="92" width="760.0" height="30" rx="4" fill="#f59e0b" fill-opacity="0.35"/><text x="50" y="112" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">gold = 250  (every 4-byte value equal to 250)</text><text x="860" y="112" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="end">1,204,311 left</text></g>
<g opacity="0"><rect x="40" y="144" width="415.7" height="30" rx="4" fill="#f59e0b" fill-opacity="0.35"/><text x="50" y="164" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">buy a tool: gold = 230  (of those, now 230)</text><text x="860" y="164" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="end">2,117 left</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.250;1" dur="8s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="40" y="196" width="125.0" height="30" rx="4" fill="#f59e0b" fill-opacity="0.35"/><text x="50" y="216" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">sell wood: gold = 245  (of those, now 245)</text><text x="860" y="216" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="end">9 left</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.500;1" dur="8s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="40" y="248" width="37.6" height="30" rx="4" fill="#4ade80" fill-opacity="0.35"/><text x="50" y="268" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">wait: gold = 245  (unchanged)</text><text x="860" y="268" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#4ade80" text-anchor="end">1 left</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.750;0.750;1" dur="8s" repeatCount="indefinite"/></g>
<text x="40.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">The bar length is on a log scale. The counts are an example. memscan.py does this over saved memory dumps.</text>
</svg>
