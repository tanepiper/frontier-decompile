<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="The NEC PC-9801 runs x86 code under MS-DOS. Its video uses two uPD7220 controllers for text and graphics, with the GRCG and EGC blitters. Its FM sound comes from the 26 and 86 cards.">
<title>The NEC PC-9801 runs x86 code under MS-DOS. Its video uses two uPD7220 controllers for text and graphics, with the GRCG and EGC blitters. Its FM sound comes from the 26 and 86 cards.</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE NEC PC-9801 VIDEO AND SOUND</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The PC-9801 runs MS-DOS on x86. Its video and sound chips differ from the IBM PC's, so VGA notes do not apply.</text>
<rect x="24.0" y="90.0" width="170.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="109.0" y="117.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">8086 to 80386</text>
<text x="109.0" y="133.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">MS-DOS, N88-BASIC(86)</text>
<rect x="260.0" y="80.0" width="190.0" height="44.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="355.0" y="107.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">uPD7220 (text)</text>
<rect x="260.0" y="132.0" width="190.0" height="44.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="355.0" y="159.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">uPD7220 (graphics)</text>
<rect x="500.0" y="80.0" width="170.0" height="44.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="585.0" y="107.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">GRCG (1985)</text>
<rect x="500.0" y="132.0" width="170.0" height="44.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="585.0" y="159.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">EGC (1986)</text>
<path d="M198.0 120.0L256.0 102.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M198.0 120.0L256.0 154.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M454.0 154.0L496.0 154.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M454.0 154.0L496.0 102.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="700.0" y="100.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">640 x 400 in 8</text>
<text x="700.0" y="118.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">colours, later 16</text>
<text x="700.0" y="136.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">from 4,096.</text>
<text x="24.0" y="214.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">FM sound cards</text>
<rect x="24.0" y="224.0" width="260.0" height="50.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.22"/>
<text x="154.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">PC-9801-26</text>
<text x="154.0" y="262.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">YM2203</text>
<rect x="300.0" y="224.0" width="260.0" height="50.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.22"/>
<text x="430.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">PC-9801-86</text>
<text x="430.0" y="262.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">YM2608</text>
<text x="24.0" y="306.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Record which FM card the reference recording used. 18.3 million PC-98s were sold, 1982 to 2003.</text>
</svg>
