<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="In engine-era PC games, Mono games ship .NET assemblies and IL2CPP games ship GameAssembly.dll with global-metadata.dat. Unreal packs assets in .pak files and keeps class names. Godot packs .pck files.">
<title>In engine-era PC games, Mono games ship .NET assemblies and IL2CPP games ship GameAssembly.dll with global-metadata.dat. Unreal packs assets in .pak files and keeps class names. Godot packs .pck files.</title>
<rect x="0.5" y="0.5" width="899" height="379" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">WHERE THE LOGIC LIVES IN ENGINE-ERA GAMES</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Much of the logic is outside the native executable. Each engine needs its own first tool.</text>
<text x="24.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8fa9a5" text-anchor="start">engine</text>
<text x="240.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8fa9a5" text-anchor="start">what ships</text>
<text x="520.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8fa9a5" text-anchor="start">first tool</text>
<text x="720.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8fa9a5" text-anchor="start">what you get</text>
<rect x="24.0" y="104.0" width="200.0" height="44.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="36.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Unity with Mono, .NET</text>
<rect x="236.0" y="104.0" width="264.0" height="44.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<text x="248.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">managed assemblies (IL)</text>
<path d="M502.0 126.0L514.0 126.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="516.0" y="104.0" width="186.0" height="44.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.15"/>
<text x="528.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">a .NET decompiler, REA</text>
<path d="M704.0 126.0L716.0 126.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="720.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">near-source C#</text>
<rect x="24.0" y="160.0" width="200.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="36.0" y="187.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Unity with IL2CPP</text>
<rect x="236.0" y="160.0" width="264.0" height="44.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<text x="248.0" y="187.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">GameAssembly.dll + global-metadata.dat</text>
<path d="M502.0 182.0L514.0 182.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="516.0" y="160.0" width="186.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.15"/>
<text x="528.0" y="187.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Il2CppDumper</text>
<path d="M704.0 182.0L716.0 182.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="720.0" y="187.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">names, then native code</text>
<rect x="24.0" y="216.0" width="200.0" height="44.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="36.0" y="243.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Unreal Engine 4 and 5</text>
<rect x="236.0" y="216.0" width="264.0" height="44.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<text x="248.0" y="243.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">native code + .pak (may be AES)</text>
<path d="M502.0 238.0L514.0 238.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="516.0" y="216.0" width="186.0" height="44.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.15"/>
<text x="528.0" y="243.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">reflection keeps class names</text>
<path d="M704.0 238.0L716.0 238.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="720.0" y="243.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">named functions</text>
<rect x="24.0" y="272.0" width="200.0" height="44.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="36.0" y="299.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Godot</text>
<rect x="236.0" y="272.0" width="264.0" height="44.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<text x="248.0" y="299.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">.pck packs</text>
<path d="M502.0 294.0L514.0 294.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="516.0" y="272.0" width="186.0" height="44.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.15"/>
<text x="528.0" y="299.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">gdsdecomp</text>
<path d="M704.0 294.0L716.0 294.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="720.0" y="299.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">the project and its scripts</text>
<text x="24.0" y="350.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Check the decompiled code's float and integer rules against the runtime the game shipped with.</text>
</svg>
