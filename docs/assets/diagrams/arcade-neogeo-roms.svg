<text x="94.0" y="283.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">NEO-PCM2</text>
<path d="M168.0 278.0L870.0 278.0" stroke="#64748b" stroke-width="1" fill="none" stroke-opacity="0.4"/>
<circle cx="665" cy="278" r="8" fill="#f87171"/>
<circle cx="245" cy="278" r="8" fill="#60a5fa"/>
<text x="24.0" y="318.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">NEO-SMA decrypts and banks the P-ROM, gives random numbers and stores 256 kb of game data.</text>
<text x="24.0" y="336.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">NEO-CMC decrypts the C-ROM and banks the S-ROM; the 7050 also decrypts the M-ROM. NEO-PCM2 decrypts the V-ROM and decodes the P-ROM.</text>
<text x="24.0" y="372.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">On a NEO-SMA game, reproduce the chip's random number generator from MAME's model.</text>
</svg>
