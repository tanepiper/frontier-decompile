<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="On late Neo Geo games, NEO-SMA decrypts the P-ROM program and has a random number generator. NEO-CMC decrypts the C-ROM graphics and banks the S-ROM, and on some boards decrypts the M-ROM. NEO-PCM2 decrypts the V-ROM samples.">
<title>On late Neo Geo games, NEO-SMA decrypts the P-ROM program and has a random number generator. NEO-CMC decrypts the C-ROM graphics and banks the S-ROM, and on some boards decrypts the M-ROM. NEO-PCM2 decrypts the V-ROM samples.</title>
<rect x="0.5" y="0.5" width="899" height="389" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">NEO GEO ROMS AND PROTECTION CHIPS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Late games, such as The King of Fighters '99, 2000 and 2003, have chips that decrypt their ROMs.</text>
