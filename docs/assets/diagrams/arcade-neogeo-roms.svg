<text x="94.0" y="169.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">NEO-SMA</text>
<path d="M168.0 164.0L870.0 164.0" stroke="#64748b" stroke-width="1" fill="none" stroke-opacity="0.4"/>
<circle cx="245" cy="164" r="8" fill="#60a5fa"/>
