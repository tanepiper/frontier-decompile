<circle cx="385" cy="202" r="8" fill="#2dd4bf"/>
<rect x="24.0" y="226.0" width="140.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.35"/>
<text x="94.0" y="245.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">NEO-CMC 7050</text>
<path d="M168.0 240.0L870.0 240.0" stroke="#64748b" stroke-width="1" fill="none" stroke-opacity="0.4"/>
<circle cx="805" cy="240" r="8" fill="#f59e0b"/>
