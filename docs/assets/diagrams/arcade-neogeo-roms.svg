<text x="245.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">68000 program</text>
<path d="M245.0 138.0L245.0 300.0" stroke="#8fa9a5" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
