<text x="525.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">M-ROM</text>
<text x="525.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">Z80 sound</text>
<path d="M525.0 138.0L525.0 300.0" stroke="#8fa9a5" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
