<text x="665.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">V-ROM</text>
<text x="665.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">ADPCM samples</text>
<path d="M665.0 138.0L665.0 300.0" stroke="#8fa9a5" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
<rect x="740.0" y="84.0" width="130.0" height="50.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="805.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">C-ROM</text>
