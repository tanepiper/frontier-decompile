<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Hard Drivin' runs a 68010 for the game, a TMS34010 GSP for graphics and sometimes a second TMS34010 MSP. Its polygon DSPs differ by board, from an ADSP-2100 to a DSP32C.">
<title>Hard Drivin' runs a 68010 for the game, a TMS34010 GSP for graphics and sometimes a second TMS34010 MSP. Its polygon DSPs differ by board, from an ADSP-2100 to a DSP32C.</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">ATARI HARD DRIVIN' (1988)</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each game uses three or more instruction sets. The DSP programs are part of the game.</text>
<rect x="24.0" y="100.0" width="170.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="109.0" y="127.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">M68010</text>
<text x="109.0" y="143.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">8 MHz, game logic</text>
<rect x="230.0" y="84.0" width="190.0" height="46.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="325.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">TMS34010 GSP</text>
<text x="325.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">graphics, 48 MHz crystal</text>
<rect x="230.0" y="140.0" width="190.0" height="46.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.15"/>
<text x="325.0" y="160.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">TMS34010 MSP</text>
<text x="325.0" y="176.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">some boards, 50 MHz</text>
<text x="470.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">polygon DSP, by board</text>
<rect x="470.0" y="102.0" width="190.0" height="46.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="565.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">ADSP-2100</text>
<text x="565.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">32 MHz / 4</text>
<rect x="670.0" y="102.0" width="190.0" height="46.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="765.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">ADSP-2101</text>
<text x="765.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">12 MHz</text>
<rect x="470.0" y="158.0" width="190.0" height="46.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="565.0" y="178.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">2 x ADSP-2105</text>
<text x="565.0" y="194.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">10 MHz, DS III</text>
<rect x="670.0" y="158.0" width="190.0" height="46.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="765.0" y="178.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">DSP32C</text>
<text x="765.0" y="194.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">40 MHz</text>
<path d="M198.0 125.0L226.0 108.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M198.0 135.0L226.0 162.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="24.0" y="250.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Record which board variant and which DSP the set uses.</text>
<text x="24.0" y="268.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Ghidra has the 68000 built in and the TMS34010 by extension.</text>
<text x="24.0" y="286.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">It has nothing for these DSPs.</text>
</svg>
