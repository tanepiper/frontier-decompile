<text x="24.0" y="330.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">Dialogs and menus here are the game's own windows. Their layouts and ids are evidence too.</text>
