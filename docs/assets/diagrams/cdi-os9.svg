<rect x="282.0" y="152.0" width="76.0" height="24.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="320.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e2ece9" text-anchor="middle">header</text>
<rect x="360.0" y="152.0" width="180.0" height="24.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="450.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e2ece9" text-anchor="middle">a shared library</text>
<rect x="282.0" y="182.0" width="76.0" height="24.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="320.0" y="198.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e2ece9" text-anchor="middle">header</text>
