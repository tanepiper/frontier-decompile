<text x="130.0" y="168.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">files on the disc</text>
<path d="M222.0 155.0L262.0 155.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="266.0" y="90.0" width="300.0" height="130.0" rx="5" fill="#60a5fa" stroke="#60a5fa" fill-opacity="0.08" stroke-opacity="0.65"/>
<text x="282.0" y="110.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">OS-9 modules</text>
