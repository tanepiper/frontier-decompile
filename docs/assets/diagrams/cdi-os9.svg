<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="CD-i programs are OS-9 modules, each loaded with the 68000 language">
<title>CD-i programs are OS-9 modules, each loaded with the 68000 language</title>
