<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="One game with several renderers: the game code calls a renderer interface implemented for Glide, Direct3D, OpenGL and software; each looks slightly different, and the port chooses one reference">
<title>One game with several renderers: the game code calls a renderer interface implemented for Glide, Direct3D, OpenGL and software; each looks slightly different, and the port chooses one reference</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">A GAME WITH SEVERAL RENDERERS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each renderer draws slightly different pictures. Choose one of them as the reference for the port.</text>
<rect x="330.0" y="82.0" width="240.0" height="44.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.22"/>
<text x="450.0" y="109.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="middle">game code</text>
<rect x="330.0" y="150.0" width="240.0" height="40.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="450.0" y="175.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="middle">renderer interface (a vtable)</text>
<path d="M450.0 126.0L450.0 148.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="30.0" y="230.0" width="200.0" height="40.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="130.0" y="255.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Glide (3dfx)</text>
<path d="M450.0 190.0L130.0 228.0" stroke="#8fa9a5" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<text x="130.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">16-bit colour with dithering, the</text>
<text x="130.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">card's own fog table</text>
<rect x="244.0" y="230.0" width="200.0" height="40.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="344.0" y="255.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Direct3D</text>
<path d="M450.0 190.0L344.0 228.0" stroke="#8fa9a5" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<text x="344.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">fog and filtering vary by card and</text>
<text x="344.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">driver</text>
<rect x="458.0" y="230.0" width="200.0" height="40.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="558.0" y="255.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">OpenGL</text>
<path d="M450.0 190.0L558.0 228.0" stroke="#8fa9a5" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<text x="558.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">often the MiniGL subset Quake used</text>
<rect x="672.0" y="230.0" width="200.0" height="40.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.22"/>
<text x="772.0" y="255.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">software</text>
<path d="M450.0 190.0L772.0 228.0" stroke="#8fa9a5" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<text x="772.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">exact and slow; often 8-bit with</text>
<text x="772.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">lookup tables</text>
</svg>
