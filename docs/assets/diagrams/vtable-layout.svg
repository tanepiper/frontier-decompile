<text x="40.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A call through slot +0x18 reads (**(code **)(*obj + 0x18))(obj). Base classes share their early slots.</text>
