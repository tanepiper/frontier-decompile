<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="An MSVC object with virtual methods: its first field points to the vtable, and the slot before the vtable points to RTTI that names the class">
<title>An MSVC object with virtual methods: its first field points to the vtable, and the slot before the vtable points to RTTI that names the class</title>
