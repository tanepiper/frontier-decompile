<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="The VGA beam draws the visible lines, then the vertical retrace returns it to the top; port 3DAh bit 3 is set during the retrace, and games wait for it">
<title>The VGA beam draws the visible lines, then the vertical retrace returns it to the top; port 3DAh bit 3 is set during the retrace, and games wait for it</title>
<rect x="0.5" y="0.5" width="899" height="339" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE VERTICAL RETRACE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The beam draws 400 visible lines, then returns to the top. Mode 13h does this 70 times a second.</text>
<rect x="40.0" y="84.0" width="300.0" height="200.0" rx="3" fill="#60a5fa" stroke="#60a5fa" fill-opacity="0.12" stroke-opacity="0.5"/>
<rect x="40.0" y="284.0" width="300.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="190.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">blanking and retrace</text>
<rect x="40" y="84" width="300" height="3" fill="#f59e0b"><animate attributeName="y" values="84;284;311;84" keyTimes="0;0.85;0.99;1" dur="2.0s" repeatCount="indefinite"/></rect>
<text x="400.0" y="94.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">port 3DAh bit 3 (vertical retrace)</text>
<path d="M400 150H797.0V110H855.4V150H860" fill="none" stroke="#2dd4bf" stroke-width="2"/>
<text x="804.8" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#2dd4bf" text-anchor="start">set</text>
<rect x="400" y="104" width="2" height="54" fill="#f59e0b"><animate attributeName="x" values="400;860" dur="2.0s" repeatCount="indefinite"/></rect>
<text x="400.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A game reads the port until bit 3 is set. Then it can</text>
<text x="400.0" y="198.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">flip pages or write the palette without tearing.</text>
<text x="400.0" y="232.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">A game that waits every frame runs at the refresh rate,</text>
<text x="400.0" y="250.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">which is 70 Hz in Mode 13h and 60 Hz in Mode X 320 x 240.</text>
<text x="400.0" y="276.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Bit 0 is set during either blanking, for raster effects.</text>
</svg>
