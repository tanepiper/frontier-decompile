<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="On the Oric, an attribute byte in screen memory takes a character cell and shows as a blank. It changes the ink or paper colour for the rest of the line.">
<title>On the Oric, an attribute byte in screen memory takes a character cell and shows as a blank. It changes the ink or paper colour for the rest of the line.</title>
