<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">An attribute is a byte in the screen itself. It takes one cell and changes the colours from there to the line's end.</text>
