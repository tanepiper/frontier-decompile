<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="On the 65C816 the same bytes decode differently by the m flag. A9 34 12 EA is LDA #$34 then ORA ($EA) with an 8-bit accumulator, or LDA #$1234 then NOP with a 16-bit accumulator.">
<title>On the 65C816 the same bytes decode differently by the m flag. A9 34 12 EA is LDA #$34 then ORA ($EA) with an 8-bit accumulator, or LDA #$1234 then NOP with a 16-bit accumulator.</title>
<rect x="0.5" y="0.5" width="899" height="319" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">65C816 OPERAND WIDTHS CHANGE THE DECODING</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The m and x flags set the operand widths. A disassembler must track REP and SEP.</text>
<rect x="280.0" y="84.0" width="62.0" height="36.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="311.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e2ece9" text-anchor="middle">A9</text>
<rect x="350.0" y="84.0" width="62.0" height="36.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="381.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e2ece9" text-anchor="middle">34</text>
<rect x="420.0" y="84.0" width="62.0" height="36.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="451.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e2ece9" text-anchor="middle">12</text>
<rect x="490.0" y="84.0" width="62.0" height="36.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="521.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e2ece9" text-anchor="middle">EA</text>
<text x="24.0" y="174.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">m = 1 (8-bit A, after SEP #$20)</text>
<rect x="280.0" y="150.0" width="132.0" height="36.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.35"/>
<text x="346.0" y="173.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#e2ece9" text-anchor="middle">LDA #$34</text>
<rect x="420.0" y="150.0" width="132.0" height="36.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.35"/>
<text x="486.0" y="173.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#e2ece9" text-anchor="middle">ORA ($EA)</text>
<text x="24.0" y="238.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">m = 0 (16-bit A, after REP #$20)</text>
<rect x="280.0" y="214.0" width="202.0" height="36.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.35"/>
<text x="381.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#e2ece9" text-anchor="middle">LDA #$1234</text>
<rect x="490.0" y="214.0" width="62.0" height="36.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.35"/>
<text x="521.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#e2ece9" text-anchor="middle">NOP</text>
<text x="24.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">If the disassembler guesses a width wrong, every instruction after the first immediate operand decodes wrongly.</text>
<text x="24.0" y="308.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The SNES 5A22 and the Apple IIgs use the 65C816. Record m and x at the entry of each function.</text>
</svg>
