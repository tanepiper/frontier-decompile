<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="The Fujitsu FM Towns has an 80386DX at 16 MHz running Towns OS, which is MS-DOS with the Phar Lap DOS extender. It has a CD-ROM drive as standard, 1024 sprites and RF5c68 PCM and YM2612 FM sound.">
<title>The Fujitsu FM Towns has an 80386DX at 16 MHz running Towns OS, which is MS-DOS with the Phar Lap DOS extender. It has a CD-ROM drive as standard, 1024 sprites and RF5c68 PCM and YM2612 FM sound.</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">FUJITSU FM TOWNS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The FM Towns is a 386 machine with a CD-ROM drive as standard, sold from 1989 to 1997. The FM Towns Marty console (1993) runs its games.</text>
