<svg xmlns="http://www.w3.org/2000/svg" width="900" height="344" viewBox="0 0 900 344" role="img" aria-label="The Vectrex CPU steers the beam through a DAC, beside the 6809 registers">
<title>The Vectrex CPU steers the beam through a DAC, beside the 6809 registers</title>
<rect x="0.5" y="0.5" width="899" height="343" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">VECTREX DRAWING</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The Vectrex has no video memory, so the 68A09 steers the beam through a DAC, line by line.</text>
<rect x="40.0" y="96.0" width="110.0" height="56.0" rx="5" fill="#60a5fa" stroke="#60a5fa" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="95.0" y="119.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">68A09</text>
<text x="95.0" y="137.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">1.5 MHz</text>
<path d="M152.0 124.0L196.0 124.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="200.0" y="96.0" width="110.0" height="56.0" rx="5" fill="#f59e0b" stroke="#f59e0b" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="255.0" y="119.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">DAC</text>
<text x="255.0" y="137.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">X, Y, brightness</text>
<path d="M312.0 124.0L356.0 124.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="360.0" y="76.0" width="200.0" height="230.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.12"/>
<path d="M460 120L500 220L460 196L420 220Z" fill="none" stroke="#e2ece9" stroke-width="2.5" stroke-dasharray="360" stroke-dashoffset="360"><animate attributeName="stroke-dashoffset" values="360;0;0" keyTimes="0;0.7;1" dur="2.5s" repeatCount="indefinite"/></path>
<text x="460.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">the beam draws each line</text>
<text x="610.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">6809 registers</text>
<rect x="610.0" y="108.0" width="94.0" height="30.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="657.0" y="127.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">A</text>
<rect x="706.0" y="108.0" width="94.0" height="30.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="753.0" y="127.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">B</text>
<text x="812.0" y="128.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">= D</text>
<rect x="610.0" y="150.0" width="240.0" height="20.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="618.0" y="164.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">X  16-bit</text>
<rect x="610.0" y="174.0" width="240.0" height="20.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="618.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Y  16-bit</text>
<rect x="610.0" y="198.0" width="240.0" height="20.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="618.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">U  16-bit</text>
<rect x="610.0" y="222.0" width="240.0" height="20.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="618.0" y="236.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">S  16-bit</text>
<text x="610.0" y="260.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">MUL: A x B gives D, in hardware</text>
<text x="610.0" y="284.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The game code draws the picture, so</text>
<text x="610.0" y="301.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">trace the drawing code like the game</text>
<text x="610.0" y="318.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">logic.</text>
</svg>
