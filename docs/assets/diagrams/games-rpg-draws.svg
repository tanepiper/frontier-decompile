<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="In a role-playing game, one generator serves every draw. A draw spent on a cosmetic idle animation moves every later draw, so the to-hit and damage rolls change">
<title>In a role-playing game, one generator serves every draw. A draw spent on a cosmetic idle animation moves every later draw, so the to-hit and damage rolls change</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
