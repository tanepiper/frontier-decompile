<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="The HuC6280 MMU maps eight 8 KB pages of the CPU onto 256 banks of a 2 MB space">
<title>The HuC6280 MMU maps eight 8 KB pages of the CPU onto 256 banks of a 2 MB space</title>
<rect x="0.5" y="0.5" width="899" height="419" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">HUC6280 MEMORY MAPPING</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Eight registers, MPR0 to MPR7, each choose one of 256 banks of 8 KB.</text>
<text x="40.0" y="84.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">the CPU's 64 KB</text>
<text x="40.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">$0000</text>
<rect x="92.0" y="94.0" width="90.0" height="29.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="100.0" y="113.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MPR0</text>
<rect x="190.0" y="94.0" width="100.0" height="29.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="198.0" y="113.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">$FF  I/O</text>
<text x="40.0" y="146.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">$2000</text>
<rect x="92.0" y="126.0" width="90.0" height="29.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="100.0" y="145.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MPR1</text>
<rect x="190.0" y="126.0" width="100.0" height="29.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="198.0" y="145.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">$F8  RAM</text>
<text x="40.0" y="178.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">$4000</text>
<rect x="92.0" y="158.0" width="90.0" height="29.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="100.0" y="177.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MPR2</text>
<rect x="190.0" y="158.0" width="100.0" height="29.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="198.0" y="177.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">...</text>
<text x="40.0" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">$6000</text>
<rect x="92.0" y="190.0" width="90.0" height="29.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="100.0" y="209.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MPR3</text>
<rect x="190.0" y="190.0" width="100.0" height="29.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="198.0" y="209.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">...</text>
<text x="40.0" y="242.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">$8000</text>
<rect x="92.0" y="222.0" width="90.0" height="29.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="100.0" y="241.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MPR4</text>
<rect x="190.0" y="222.0" width="100.0" height="29.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="40.0" y="274.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">$A000</text>
<rect x="92.0" y="254.0" width="90.0" height="29.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="100.0" y="273.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MPR5</text>
<rect x="190.0" y="254.0" width="100.0" height="29.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="198.0" y="273.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">...</text>
<text x="40.0" y="306.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">$C000</text>
<rect x="92.0" y="286.0" width="90.0" height="29.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="100.0" y="305.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MPR6</text>
<rect x="190.0" y="286.0" width="100.0" height="29.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="198.0" y="305.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">...</text>
<text x="40.0" y="338.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">$E000</text>
<rect x="92.0" y="318.0" width="90.0" height="29.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="100.0" y="337.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MPR7</text>
<rect x="190.0" y="318.0" width="100.0" height="29.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="198.0" y="337.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">$00  ROM</text>
<text x="198" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f59e0b" font-weight="600" opacity="1">$10  ROM<animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.3333;0.6667" dur="5s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="198" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f59e0b" font-weight="600" opacity="0">$11  ROM<animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3333;0.6667" dur="5s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="198" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f59e0b" font-weight="600" opacity="0">$12  ROM<animate attributeName="opacity" values="0;0;1" keyTimes="0.0000;0.3333;0.6667" dur="5s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="520.0" y="84.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">the 2 MB physical space: 256 banks of 8 KB</text>
<rect x="520.0" y="94.0" width="340.0" height="256.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.12"/>
<rect x="520.0" y="94.0" width="340.0" height="2.0" rx="4" fill="#2dd4bf" stroke="none"/>
<text x="854.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#2dd4bf" text-anchor="end">$00 ROM start</text>
<rect x="520.0" y="342.0" width="340.0" height="2.0" rx="4" fill="#4ade80" stroke="none"/>
<text x="526.0" y="338.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4ade80" text-anchor="start">$F8 RAM</text>
<rect x="520.0" y="349.0" width="340.0" height="2.0" rx="4" fill="#c084fc" stroke="none"/>
<text x="854.0" y="363.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#c084fc" text-anchor="end">$FF hardware I/O</text>
<g opacity="1"><rect x="520" y="130.0" width="340" height="8" fill="#f59e0b" fill-opacity="0.8"/><path d="M292 236C 400 236 440 134.0 517 134.0" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.3333;0.6667" dur="5s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="520" y="131.0" width="340" height="8" fill="#f59e0b" fill-opacity="0.8"/><path d="M292 236C 400 236 440 135.0 517 135.0" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3333;0.6667" dur="5s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="520" y="132.0" width="340" height="8" fill="#f59e0b" fill-opacity="0.8"/><path d="M292 236C 400 236 440 136.0 517 136.0" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><animate attributeName="opacity" values="0;0;1" keyTimes="0.0000;0.3333;0.6667" dur="5s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="520.0" y="382.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">In this example, TAM sets MPR4 to $10, then $11, then $12.</text>
<text x="40.0" y="404.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Physical address = bank x 8 KB + offset. Ghidra's 65C02 mis-reads TAM and TMA. The HuC6280 extension fixes them.</text>
</svg>
