<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="A DS cartridge holds ARM9 and ARM7 binaries, overlays and NitroFS">
<title>A DS cartridge holds ARM9 and ARM7 binaries, overlays and NitroFS</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">NINTENDO DS CARTRIDGE CONTENTS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The ARM946E-S at 67 MHz and the ARM7TDMI at 33 MHz each run their own binary.</text>
<rect x="40.0" y="96.0" width="67.0" height="44.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="75.0" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">header</text>
<rect x="110.0" y="96.0" width="167.0" height="44.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="195.0" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">ARM9 binary</text>
<rect x="280.0" y="96.0" width="117.0" height="44.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="340.0" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">ARM7 binary</text>
<rect x="400.0" y="96.0" width="137.0" height="44.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="470.0" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">overlays</text>
<rect x="540.0" y="96.0" width="257.0" height="44.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="670.0" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">NitroFS files</text>
<rect x="110.0" y="196.0" width="200.0" height="60.0" rx="5" fill="#60a5fa" stroke="#60a5fa" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="210.0" y="221.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Ghidra program 1</text>
<text x="210.0" y="239.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">ARM9 at its address</text>
<rect x="330.0" y="196.0" width="200.0" height="60.0" rx="5" fill="#c084fc" stroke="#c084fc" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="430.0" y="221.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Ghidra program 2</text>
<text x="430.0" y="239.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">ARM7 at its address</text>
<path d="M195.0 142.0L200.0 192.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M340.0 142.0L400.0 192.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="570.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Overlays load into ARM9 memory while the game</text>
<text x="570.0" y="217.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">runs. Each one shares addresses with others.</text>
</svg>
