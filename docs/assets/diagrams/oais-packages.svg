<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Three packages: the copy as received, the copy kept with checksums and findings, and what is given to players">
<title>Three packages: the copy as received, the copy kept with checksums and findings, and what is given to players</title>
<rect x="0.5" y="0.5" width="899" height="259" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE THREE PACKAGES OF AN ARCHIVE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The words come from the OAIS reference model that archives use.</text>
<rect x="40.0" y="90.0" width="240.0" height="100.0" rx="10" fill="#64748b" stroke="none" fill-opacity="0.16"/>
<rect x="40.0" y="90.0" width="240.0" height="5.0" rx="2" fill="#64748b" stroke="none"/>
<text x="58.0" y="124.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2ece9" text-anchor="start">Received</text>
<text x="58.0" y="150.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">the installer or disc image,</text>
<text x="58.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">as bought, and where from</text>
<path d="M284 140H330" stroke="#8fa9a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340.0" y="90.0" width="240.0" height="100.0" rx="10" fill="#2dd4bf" stroke="none" fill-opacity="0.16"/>
<rect x="340.0" y="90.0" width="240.0" height="5.0" rx="2" fill="#2dd4bf" stroke="none"/>
<text x="358.0" y="124.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2ece9" text-anchor="start">Kept</text>
<text x="358.0" y="150.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">a bag with checksums, provenance,</text>
<text x="358.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">hashes and the findings</text>
<path d="M584 140H630" stroke="#8fa9a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="640.0" y="90.0" width="240.0" height="100.0" rx="10" fill="#f59e0b" stroke="none" fill-opacity="0.16"/>
<rect x="640.0" y="90.0" width="240.0" height="5.0" rx="2" fill="#f59e0b" stroke="none"/>
<text x="658.0" y="124.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2ece9" text-anchor="start">Given to players</text>
<text x="658.0" y="150.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">the port and its documents,</text>
<text x="658.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">run with the player's own copy</text>
<path d="M370 196V222H160V196" fill="none" stroke="#2dd4bf" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="265.0" y="240.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#2dd4bf" text-anchor="middle">fixity.py verify: checked again over the years</text>
</svg>
