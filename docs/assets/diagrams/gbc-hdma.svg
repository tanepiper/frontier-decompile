<rect x="230" y="190" width="8" height="28" rx="1" fill="#f59e0b" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.308;0.308;1" dur="4s" repeatCount="indefinite"/></rect>
<rect x="240.0" y="190.0" width="30.0" height="28.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<rect x="270.0" y="190.0" width="8.0" height="28.0" rx="1" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<rect x="270" y="190" width="8" height="28" rx="1" fill="#f59e0b" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.385;0.385;1" dur="4s" repeatCount="indefinite"/></rect>
