<rect x="110" y="190" width="8" height="28" rx="1" fill="#f59e0b" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.077;0.077;1" dur="4s" repeatCount="indefinite"/></rect>
