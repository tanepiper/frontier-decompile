<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="General-purpose DMA and HBlank DMA on the Game Boy Color, and what double speed changes">
<title>General-purpose DMA and HBlank DMA on the Game Boy Color, and what double speed changes</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">GAME BOY COLOR VRAM DMA</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Bit 7 of HDMA5 picks the mode. Each mode moves $10 to $800 bytes into VRAM.</text>
<text x="40.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">bit 7 clear: general-purpose DMA</text>
<rect x="40.0" y="110.0" width="520.0" height="28.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<rect x="40" y="110" width="0" height="28" rx="3" fill="#f59e0b" fill-opacity="0.7"><animate attributeName="width" values="0;520;520" keyTimes="0;0.25;1" dur="4s" repeatCount="indefinite"/></rect>
<text x="580.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">all at once, with the CPU halted</text>
<text x="40.0" y="178.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">bit 7 set: HBlank DMA, $10 bytes per line</text>
<rect x="40.0" y="190.0" width="30.0" height="28.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<rect x="70.0" y="190.0" width="8.0" height="28.0" rx="1" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<rect x="70" y="190" width="8" height="28" rx="1" fill="#f59e0b" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.000;0.000;1" dur="4s" repeatCount="indefinite"/></rect>
