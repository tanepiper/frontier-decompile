<rect x="550" y="190" width="8" height="28" rx="1" fill="#f59e0b" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.923;0.923;1" dur="4s" repeatCount="indefinite"/></rect>
<text x="40.0" y="236.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Blue is a line being drawn while the game runs. Amber is one block copied in its HBlank.</text>
<text x="40.0" y="274.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Double speed</text>
<text x="40.0" y="296.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#f59e0b" text-anchor="start">The CPU, timers, serial port and OAM DMA run twice as fast.</text>
<text x="40.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2dd4bf" text-anchor="start">The LCD, VRAM DMA and sound keep normal timing.</text>
<text x="420.0" y="296.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">To switch, the game sets bit 0 of KEY1 ($FF4D) and executes stop.</text>
<text x="420.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The switch pauses the CPU for 2050 M-cycles.</text>
</svg>
