<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Three kinds of console video and how a port draws each">
<title>Three kinds of console video and how a port draws each</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THREE KINDS OF CONSOLE VIDEO</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The kind of video decides how the port draws the picture.</text>
<rect x="40.0" y="84.0" width="260.0" height="56.0" rx="5" fill="#60a5fa" stroke="#60a5fa" fill-opacity="0.3" stroke-opacity="0.65"/>
<text x="170.0" y="107.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Tiles, sprites, layers</text>
<text x="170.0" y="125.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">NES to GBA, Mega Drive, Saturn VDP2</text>
<text x="50.0" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Reimplement the video chip.</text>
<text x="50.0" y="184.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Each frame, read the tile,</text>
<text x="50.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">map, sprite and palette</text>
<text x="50.0" y="220.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">memory and draw it.</text>
<text x="50.0" y="238.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Exact output is possible.</text>
<rect x="320.0" y="84.0" width="260.0" height="56.0" rx="5" fill="#f59e0b" stroke="#f59e0b" fill-opacity="0.3" stroke-opacity="0.65"/>
<text x="450.0" y="107.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Frame buffer, triangles</text>
<text x="450.0" y="125.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">PlayStation, Saturn VDP1</text>
<text x="330.0" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Draw the game's commands</text>
<text x="330.0" y="184.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">with a modern API.</text>
<text x="330.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Decide whether to keep</text>
<text x="330.0" y="220.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">the wobble and the missing</text>
<text x="330.0" y="238.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">perspective correction.</text>
<rect x="600.0" y="84.0" width="260.0" height="56.0" rx="5" fill="#c084fc" stroke="#c084fc" fill-opacity="0.3" stroke-opacity="0.65"/>
<text x="730.0" y="107.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Display lists</text>
<text x="730.0" y="125.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">N64 and later consoles</text>
<text x="610.0" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Interpret the lists the</text>
<text x="610.0" y="184.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">game builds and translate</text>
<text x="610.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">them to a modern API.</text>
<rect x="40.0" y="270.0" width="16.0" height="16.0" rx="1" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<rect x="58.0" y="270.0" width="16.0" height="16.0" rx="1" fill="#60a5fa" stroke="none" fill-opacity="0.30000000000000004"/>
<rect x="76.0" y="270.0" width="16.0" height="16.0" rx="1" fill="#60a5fa" stroke="none" fill-opacity="0.4"/>
<rect x="94.0" y="270.0" width="16.0" height="16.0" rx="1" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<rect x="112.0" y="270.0" width="16.0" height="16.0" rx="1" fill="#60a5fa" stroke="none" fill-opacity="0.30000000000000004"/>
<rect x="130.0" y="270.0" width="16.0" height="16.0" rx="1" fill="#60a5fa" stroke="none" fill-opacity="0.4"/>
<rect x="160.0" y="262.0" width="24.0" height="24.0" rx="2" fill="#f472b6" stroke="none" fill-opacity="0.7"/>
<path d="M330 290L380 258L420 288Z" fill="#f59e0b" fill-opacity="0.4" stroke="#f59e0b"/>
<path d="M400 290L450 266L480 292Z" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b"/>
<rect x="600.0" y="266.0" width="60.0" height="20.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="630.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#e2ece9" text-anchor="middle">matrix</text>
<rect x="664.0" y="266.0" width="60.0" height="20.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="694.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#e2ece9" text-anchor="middle">vertices</text>
<rect x="728.0" y="266.0" width="60.0" height="20.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="758.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#e2ece9" text-anchor="middle">triangles</text>
<rect x="792.0" y="266.0" width="60.0" height="20.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="822.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#e2ece9" text-anchor="middle">end</text>
<text x="40.0" y="318.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Keep the original resolution and aspect ratio as the reference. Widescreen is a deviation to record.</text>
</svg>
