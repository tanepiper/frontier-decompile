<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Capcom CPS-1 has a 68000 at 10 or 12 MHz and a Z80 at 3.58 MHz with a YM2151 and an MSM6295. QSound games use a Kabuki Z80 at 8 MHz. An 8 MHz pixel clock with 512 by 262 totals gives about 59.64 Hz.">
<title>Capcom CPS-1 has a 68000 at 10 or 12 MHz and a Z80 at 3.58 MHz with a YM2151 and an MSM6295. QSound games use a Kabuki Z80 at 8 MHz. An 8 MHz pixel clock with 512 by 262 totals gives about 59.64 Hz.</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">CAPCOM CPS-1 (1988)</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">CPS-1 ran Forgotten Worlds, Final Fight and Street Fighter II. It has one 68000 and a Z80 for sound.</text>
<rect x="24.0" y="90.0" width="200.0" height="56.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="124.0" y="115.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">68000</text>
<text x="124.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">10 MHz (verified); later 12</text>
<rect x="234.0" y="90.0" width="130.0" height="56.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="299.0" y="115.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Z80</text>
<text x="299.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">3.58 MHz</text>
<rect x="374.0" y="90.0" width="120.0" height="56.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="434.0" y="115.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">YM2151</text>
<text x="434.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">FM</text>
<rect x="504.0" y="90.0" width="140.0" height="56.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="574.0" y="115.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">MSM6295</text>
<text x="574.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">1 MHz, samples</text>
<rect x="654.0" y="90.0" width="150.0" height="56.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="729.0" y="115.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">B-board PALs</text>
<text x="729.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">protected</text>
<text x="24.0" y="182.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">QSound games (Warriors of Fate, 1992)</text>
<rect x="24.0" y="194.0" width="200.0" height="56.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="124.0" y="219.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Kabuki Z80</text>
<text x="124.0" y="235.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">8 MHz, encrypted</text>
<rect x="234.0" y="194.0" width="200.0" height="56.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="334.0" y="219.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">QSound</text>
<text x="334.0" y="235.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">250 Hz audio interrupt</text>
<rect x="500.0" y="194.0" width="370.0" height="56.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.25"/>
<text x="685.0" y="219.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">8 MHz / (512 x 262)</text>
<text x="685.0" y="235.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">about 59.64 Hz; 384 x 224 visible</text>
<text x="24.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Record the 68000 clock of the board revision. At 60 Hz a port shows about 22 more frames a minute.</text>
</svg>
