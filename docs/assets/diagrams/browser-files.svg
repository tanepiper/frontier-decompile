<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="In a browser build, the player picks the game folder, the page keeps the files in the browser's own storage, and the WebAssembly core reads them there; nothing is uploaded">
<title>In a browser build, the player picks the game folder, the page keeps the files in the browser's own storage, and the WebAssembly core reads them there; nothing is uploaded</title>
<rect x="0.5" y="0.5" width="899" height="279" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE PLAYER'S FILES IN A BROWSER</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The files go from the player's disk to the browser's storage, on the same machine.</text>
<rect x="30.0" y="110.0" width="180.0" height="60.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.28"/>
<text x="120.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">the game folder</text>
<text x="120.0" y="155.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">on the player's disk</text>
<path d="M212.0 140.0L248.0 140.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="250.0" y="110.0" width="180.0" height="60.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.28"/>
<text x="340.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">a file picker</text>
<text x="340.0" y="155.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">or a dropped folder</text>
<path d="M432.0 140.0L468.0 140.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="470.0" y="110.0" width="180.0" height="60.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.28"/>
<text x="560.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">browser storage</text>
<text x="560.0" y="155.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">IndexedDB or OPFS</text>
<path d="M652.0 140.0L688.0 140.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="690.0" y="110.0" width="180.0" height="60.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.28"/>
<text x="780.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">the core</text>
<text x="780.0" y="155.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">WebAssembly</text>
<rect x="30.0" y="200.0" width="840.0" height="34.0" rx="4" fill="#f87171" stroke="none" fill-opacity="0.12"/>
<text x="450.0" y="222.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">no server receives the game files</text>
</svg>
