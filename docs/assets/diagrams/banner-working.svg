;0;1;1" keyTimes="0;0.222;0.222;1" dur="9s" repeatCount="indefinite"/></g><g opacity="0"><text x="88" y="198" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#94a3b8">> <tspan fill="#5eead4">re-measurer: 1000 draws captured</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.333;0.333;1" dur="9s" repeatCount="indefinite"/></g><g opacity="0"><text x="88" y="232" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#94a3b8">> <tspan fill="#5eead4">re-porter: crates/game/src/rng.rs</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.444;0.444;1" dur="9s" repeatCount="indefinite"/></g><g opacity="0"><text x="88" y="266" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#94a3b8">$ <tspan fill="#e2e8f0">cargo test rng</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.556;0.556;1" dur="9s" repeatCount="indefinite"/></g><g opacity="0"><text x="88" y="300" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#94a3b8">  <tspan fill="#4ade80">test rng_matches_original ... ok</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.667;0.667;1" dur="9s" repeatCount="indefinite"/></g><g opacity="0"><text x="88" y="334" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#94a3b8">> <tspan fill="#fde68a">re-lander: committed 3 files</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.778;0.778;1" dur="9s" repeatCount="indefinite"/></g><rect x="830" y="50" width="300" height="40" rx="8" fill="#64748b" fill-opacity="0.2" stroke="#64748b"/><text x="980" y="76" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle">inventory</text><rect x="830" y="104" width="300" height="40" rx="8"