<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="The CPS-2 cipher uses two 4-round Feistel networks with a 64-bit key. The first runs on the low 16 address bits. Its output, expanded and mixed with the key, keys the second network, which decrypts the 16-bit opcode.">
<title>The CPS-2 cipher uses two 4-round Feistel networks with a 64-bit key. The first runs on the low 16 address bits. Its output, expanded and mixed with the key, keys the second network, which decrypts the 16-bit opcode.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE CPS-2 OPCODE CIPHER</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">D = FN2(E, K xor EX(FN1(A, K))). The cipher encrypts opcodes only.</text>
<rect x="24.0" y="96.0" width="170.0" height="56.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="109.0" y="121.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">A</text>
<text x="109.0" y="137.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">low 16 address bits</text>
<rect x="250.0" y="96.0" width="170.0" height="56.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="335.0" y="121.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">FN1</text>
<text x="335.0" y="137.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">4-round Feistel</text>
<rect x="476.0" y="96.0" width="150.0" height="56.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="551.0" y="121.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">EX</text>
<text x="551.0" y="137.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">expand</text>
<rect x="682.0" y="96.0" width="190.0" height="56.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="777.0" y="121.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">K xor ...</text>
<text x="777.0" y="137.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">64-bit key</text>
<rect x="24.0" y="220.0" width="170.0" height="56.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="109.0" y="245.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">E</text>
<text x="109.0" y="261.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">encrypted 16-bit opcode</text>
<rect x="476.0" y="220.0" width="170.0" height="56.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="561.0" y="245.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">FN2</text>
<text x="561.0" y="261.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">4-round Feistel</text>
<rect x="702.0" y="220.0" width="170.0" height="56.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.3"/>
<text x="787.0" y="245.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">D</text>
<text x="787.0" y="261.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">plain opcode</text>
<path d="M198.0 124.0L246.0 124.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M424.0 124.0L472.0 124.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M630.0 124.0L678.0 124.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M776 156C 776 190 600 190 570 216" fill="none" stroke="#8fa9a5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="700.0" y="192.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">round keys</text>
<path d="M198.0 248.0L472.0 248.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M650.0 248.0L698.0 248.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="335.0" y="82.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">K</text>
<text x="24.0" y="312.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The key, the watchdog opcodes and the address range are in battery-backed RAM.</text>
<text x="24.0" y="330.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Andreas Naive broke the algorithm. Nicola Salmoria wrote the code. Charles MacDonald and Razoola extracted the data.</text>
</svg>
