<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="On the ARM2 and ARM3, R15 holds the flags, the interrupt masks, a 24-bit word address and the processor mode. An instruction that reads or writes R15 therefore touches the flags as well as the PC.">
<title>On the ARM2 and ARM3, R15 holds the flags, the interrupt masks, a 24-bit word address and the processor mode. An instruction that reads or writes R15 therefore touches the flags as well as the PC.</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">26-BIT ARM KEEPS THE FLAGS IN R15</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">ARM2 and ARM3 pack the status into the program counter. Ghidra's ARM starts at v4, which has none of this.</text>
<rect x="24.0" y="100.0" width="24.5" height="36.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.32"/>
<text x="36.2" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">N</text>
<rect x="50.5" y="100.0" width="24.5" height="36.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.32"/>
<text x="62.8" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">Z</text>
<rect x="77.0" y="100.0" width="24.5" height="36.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.32"/>
<text x="89.2" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">C</text>
<rect x="103.5" y="100.0" width="24.5" height="36.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.32"/>
<text x="115.8" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">V</text>
<rect x="130.0" y="100.0" width="24.5" height="36.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.32"/>
<text x="142.2" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">I</text>
<rect x="156.5" y="100.0" width="24.5" height="36.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.32"/>
<text x="168.8" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">F</text>
<rect x="183.0" y="100.0" width="634.0" height="36.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.32"/>
<text x="500.0" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">PC: word address, 24 bits (64 MB)</text>
<rect x="819.0" y="100.0" width="24.5" height="36.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.32"/>
<text x="831.2" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">M1</text>
<rect x="845.5" y="100.0" width="24.5" height="36.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.32"/>
<text x="857.8" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">M0</text>
<text x="24.0" y="152.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">bit 31</text>
<text x="872.0" y="152.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="end">bit 0</text>
<text x="24.0" y="186.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">NZCV: the condition flags. I and F: the IRQ and FIQ masks.</text>
<text x="24.0" y="204.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">M1 M0: the mode (user, FIQ, IRQ, supervisor).</text>
<text x="24.0" y="222.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">MOVS PC, R14 returns and restores the flags in one instruction.</text>
<text x="520.0" y="186.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The Risc PC's CPUs add a 32-bit mode,</text>
<text x="520.0" y="204.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">with the flags in a separate CPSR.</text>
<text x="520.0" y="222.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Record which mode the code runs in.</text>
<text x="24.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Take ground truth from a 26-bit-aware emulator. Unicorn's ARM models may give wrong results for this code.</text>
</svg>
