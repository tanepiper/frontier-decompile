<text x="24.0" y="276.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="start">width 60</text>
<image x="316" y="88" width="256" height="160" href="data:image/png;base64," style="image-rendering:pixelated" preserveAspectRatio="none"/>
<text x="316.0" y="268.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start">width 64, the right one</text>
<image x="608" y="88" width="272" height="148" href="data:image/png;base64," style="image-rendering:pixelated" preserveAspectRatio="none"/>
<text x="608.0" y="256.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="start">width 68</text>
<text x="24.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">rawimage.py tries 8-bit, Mode X planes, EGA planes, CGA and 16-bit colour, with a palette from a file.</text>
