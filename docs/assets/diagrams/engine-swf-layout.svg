<rect x="329.0" y="356.0" width="12.0" height="12.0" rx="2" fill="#f59e0b" stroke="none" fill-opacity="0.6"/>
<text x="347.0" y="366.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">ShowFrame ends a frame</text>
<rect x="491.4" y="356.0" width="12.0" height="12.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.6"/>
