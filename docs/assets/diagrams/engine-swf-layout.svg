<text x="319.0" y="287.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">21</text>
<text x="341.0" y="287.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">DefineBitsJPEG2</text>
<rect x="458.0" y="268.0" width="120.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
