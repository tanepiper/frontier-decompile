<text x="488.0" y="287.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">DefineSprite</text>
<rect x="584.0" y="268.0" width="71.0" height="30.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.22"/>
<text x="592.0" y="287.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">82</text>
<text x="614.0" y="287.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">DoABC</text>
