<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The 1541 drive has its own 6502. A fast loader uploads code into the drive's RAM and runs it. A D64 image holds 683 sectors in four speed zones, and a G64 image keeps the GCR tracks.">
<title>The 1541 drive has its own 6502. A fast loader uploads code into the drive's RAM and runs it. A D64 image holds 683 sectors in four speed zones, and a G64 image keeps the GCR tracks.</title>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">C64 AND THE 1541 DRIVE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The 1541 drive has its own 6502 and ROM. Fast loaders and protections run their own code on it.</text>
<rect x="24.0" y="90.0" width="200.0" height="70.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="124.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">C64</text>
<text x="124.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">6510 CPU</text>
<rect x="400.0" y="90.0" width="220.0" height="70.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.22"/>
<text x="510.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">1541 drive</text>
<text x="510.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">6502, 2 KB RAM, DOS ROM</text>
<path d="M228.0 125.0L396.0 125.0" stroke="#8fa9a5" stroke-width="2" fill="none"/>
<text x="312.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">serial bus</text>
<rect x="230" y="134" width="40" height="16" rx="3" fill="#f59e0b"><animate attributeName="x" values="230;354;354" keyTimes="0;0.5;1" dur="4.0s" repeatCount="indefinite"/></rect>
<text x="312.0" y="172.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="middle">loader code goes to the drive</text>
<g opacity="0"><text x="510" y="180" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="600">the drive runs it</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5000;1.0000;1.0000" dur="4.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="650.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Fast loaders: Novaload,</text>
<text x="650.0" y="124.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Freeload, Cyberload, Vorpal.</text>
<text x="650.0" y="142.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Protections: bad sectors,</text>
<text x="650.0" y="160.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">half tracks, density changes.</text>
<text x="24.0" y="222.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">D64: 35 tracks, fewer sectors toward the centre</text>
