<text x="228.0" y="334.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2dd4bf" text-anchor="middle">1-17: 21</text>
<text x="516.0" y="334.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#60a5fa" text-anchor="middle">18-24: 19</text>
<text x="672.0" y="334.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#c084fc" text-anchor="middle">25-30: 18</text>
<text x="804.0" y="334.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="middle">31-35: 17</text>
<text x="24.0" y="362.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">17 x 21 + 7 x 19 + 6 x 18 + 5 x 17 = 683 sectors x 256 bytes = 174,848 bytes. Track 18 (outlined) holds the directory.</text>
<text x="24.0" y="384.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">D64 keeps only the sector data. G64 keeps the GCR track bits, so protected disks still load.</text>
</svg>
