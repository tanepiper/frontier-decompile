<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="On Sega Lindbergh the Compact Flash derives a 176-byte key by having the PIC keychip decrypt sixteen blocks of 00 to 0b. It then decrypts the DVD and hard disk files with a custom cipher and unlocks the disk.">
<title>On Sega Lindbergh the Compact Flash derives a 176-byte key by having the PIC keychip decrypt sixteen blocks of 00 to 0b. It then decrypts the DVD and hard disk files with a custom cipher and unlocks the disk.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE SEGA LINDBERGH START-UP CHAIN</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The CF and the hard disk are locked. The PIC keychip's AES-CBC engine starts the chain.</text>
<rect x="24.0" y="96.0" width="158.0" height="110.0" rx="8" fill="#f87171" stroke="none" fill-opacity="0.18"/>
<text x="36.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">PIC keychip</text>
<text x="36.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">AES-CBC engine.</text>
<text x="36.0" y="163.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Its key cannot</text>
<text x="36.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">be dumped.</text>
<rect x="24" y="96" width="158" height="110" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.00;0.20;1" calcMode="discrete" dur="7.5s" repeatCount="indefinite"/></rect>
<rect x="198.0" y="96.0" width="158.0" height="110.0" rx="8" fill="#f59e0b" stroke="none" fill-opacity="0.18"/>
<text x="210.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">CF card</text>
<text x="210.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">has the PIC decrypt</text>
<text x="210.0" y="163.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">16 x 0x00 to 16 x 0x0b,</text>
<text x="210.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">giving a 176-byte key</text>
<path d="M184.0 151.0L196.0 151.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="198" y="96" width="158" height="110" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.20;0.40;1" calcMode="discrete" dur="7.5s" repeatCount="indefinite"/></rect>
<rect x="372.0" y="96.0" width="158.0" height="110.0" rx="8" fill="#c084fc" stroke="none" fill-opacity="0.18"/>
<text x="384.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">segaboot</text>
<text x="384.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">decrypts DVD and</text>
<text x="384.0" y="163.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">HDD files with a</text>
<text x="384.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">custom cipher</text>
<path d="M358.0 151.0L370.0 151.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="372" y="96" width="158" height="110" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.40;0.60;1" calcMode="discrete" dur="7.5s" repeatCount="indefinite"/></rect>
<rect x="546.0" y="96.0" width="158.0" height="110.0" rx="8" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="558.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">lxunlock.hdb</text>
<text x="558.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">unlocks the disk</text>
<path d="M532.0 151.0L544.0 151.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="546" y="96" width="158" height="110" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.60;0.80;1" calcMode="discrete" dur="7.5s" repeatCount="indefinite"/></rect>
<rect x="720.0" y="96.0" width="158.0" height="110.0" rx="8" fill="#4ade80" stroke="none" fill-opacity="0.18"/>
<text x="732.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">game</text>
<text x="732.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">runs on MontaVista</text>
<text x="732.0" y="163.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Linux</text>
<path d="M706.0 151.0L718.0 151.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="720" y="96" width="158" height="110" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.80;1.00;1" calcMode="discrete" dur="7.5s" repeatCount="indefinite"/></rect>
<text x="24.0" y="248.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Red box: Celeron D 335 at 2.8 GHz, 512 MB. Yellow box: Pentium 4 at 3.00 GHz, 1 GB.</text>
<text x="24.0" y="266.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Both: Intel 875 northbridge, 6300ESB southbridge, a custom GeForce, VIA VT1616 audio.</text>
<text x="24.0" y="284.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Everything on the keychip except its key can be dumped. 18 of 19 Lindbergh entries do not work in MAME.</text>
</svg>
