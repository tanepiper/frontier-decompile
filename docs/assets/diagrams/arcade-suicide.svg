<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Many arcade CPUs keep their decryption key in battery-backed RAM. When the battery dies the key is lost, and each scheme fails in its own way. Preservation groups wrote keys back to revive boards.">
<title>Many arcade CPUs keep their decryption key in battery-backed RAM. When the battery dies the key is lost, and each scheme fails in its own way. Preservation groups wrote keys back to revive boards.</title>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">WHEN THE BATTERY DIES</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The key lives in battery-backed RAM. Each scheme fails in its own way when the battery runs out.</text>
<rect x="24.0" y="92.0" width="70.0" height="34.0" rx="4" fill="none" stroke="#e2ece9" stroke-width="2"/>
<rect x="94.0" y="102.0" width="6.0" height="14.0" rx="1" fill="#e2ece9" stroke="none"/>
<rect x="28" y="96" width="62" height="26" rx="2" fill="#4ade80"><animate attributeName="width" values="62;0;0;62" keyTimes="0;0.5;0.95;1" dur="6.0s" repeatCount="indefinite"/><animate attributeName="fill" values="#4ade80;#f87171" keyTimes="0;0.5" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<g opacity="0"><text x="120" y="114" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#f87171" font-weight="600">key lost</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5000;0.9500;1.0000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="24.0" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">FD1094</text>
<text x="130.0" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Sega, custom 68000</text>
<rect x="330.0" y="148.0" width="540.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<g opacity="0"><rect x="330" y="148" width="540" height="28" rx="3" fill="#f87171" fill-opacity="0.25"/><text x="342" y="166" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#e2ece9">runs with a wrong key</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5000;0.9500;1.0000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="24.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">FD1089A, B</text>
<text x="130.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Sega, custom 68000</text>
<rect x="330.0" y="182.0" width="540.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<g opacity="0"><rect x="330" y="182" width="540" height="28" rx="3" fill="#f87171" fill-opacity="0.25"/><text x="342" y="200" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#e2ece9">stops</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5000;0.9500;1.0000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="24.0" y="234.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Kabuki</text>
<text x="130.0" y="234.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Capcom, custom Z80</text>
<rect x="330.0" y="216.0" width="540.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<g opacity="0"><rect x="330" y="216" width="540" height="28" rx="3" fill="#f87171" fill-opacity="0.25"/><text x="342" y="234" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#e2ece9">pin 28 low gives a plain Z80</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5000;0.9500;1.0000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="24.0" y="268.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">CPS-2</text>
<text x="130.0" y="268.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Capcom, 68000 board</text>
<rect x="330.0" y="250.0" width="540.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<g opacity="0"><rect x="330" y="250" width="540" height="28" rx="3" fill="#f87171" fill-opacity="0.25"/><text x="342" y="268" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#e2ece9">blue or green screen</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5000;0.9500;1.0000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="24.0" y="302.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">CPS-3</text>
<text x="130.0" y="302.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Capcom, SH-2 derivative</text>
<rect x="330.0" y="284.0" width="540.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<g opacity="0"><rect x="330" y="284" width="540" height="28" rx="3" fill="#f87171" fill-opacity="0.25"/><text x="342" y="302" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#e2ece9">thought to fall back to SFIII 2nd Impact keys</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5000;0.9500;1.0000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="24.0" y="336.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Konami-1</text>
<text x="130.0" y="336.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Konami, custom 6809</text>
<rect x="330.0" y="318.0" width="540.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<g opacity="0"><rect x="330" y="318" width="540" height="28" rx="3" fill="#f87171" fill-opacity="0.25"/><text x="342" y="336" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#e2ece9">no battery; the key is fixed by address</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5000;0.9500;1.0000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="24.0" y="380.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Preservation groups extracted keys from working boards, then wrote keys back into dead boards so they run again.</text>
</svg>
