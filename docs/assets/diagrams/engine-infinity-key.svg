<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="The Infinity Engine's chitin.key lists every BIF archive and every resource, with the archive and the place in it where the resource is">
<title>The Infinity Engine's chitin.key lists every BIF archive and every resource, with the archive and the place in it where the resource is</title>
<rect x="0.5" y="0.5" width="899" height="319" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
