<text x="48.0" y="240.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">GUARD01  .cre   bif 1, entry 41</text>
