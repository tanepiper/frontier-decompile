<text x="565.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">numbered entries</text>
<path d="M356 220C 410 220 420 118 466 118" fill="none" stroke="#8fa9a5" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="470.0" y="158.0" width="190.0" height="52.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
