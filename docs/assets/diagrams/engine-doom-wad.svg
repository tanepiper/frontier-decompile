<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="A WAD file holds a 12-byte header, the lumps and a directory of 16-byte entries with the offset, size and name of each lump. A level is a marker lump followed by ten lumps">
<title>A WAD file holds a 12-byte header, the lumps and a directory of 16-byte entries with the offset, size and name of each lump. A level is a marker lump followed by ten lumps</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE LAYOUT OF A DOOM WAD FILE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Every piece of data is a named lump. The header gives the offset of the directory, which lists every lump.</text>
<rect x="24.0" y="84.0" width="150.0" height="56.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="99.0" y="116.2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">header, 12 bytes</text>
<rect x="180.0" y="84.0" width="470.0" height="56.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="415.0" y="116.2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">lump data, one lump after another</text>
<rect x="656.0" y="84.0" width="220.0" height="56.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="766.0" y="116.2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">directory</text>
<text x="24.0" y="164.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">"IWAD" or "PWAD"</text>
<text x="24.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">number of lumps</text>
<text x="24.0" y="196.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">offset of the directory</text>
<text x="24.0" y="216.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">4 bytes each, little-endian</text>
<path d="M100 84C 100 62 766 62 766 82" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="656.0" y="164.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">each entry, 16 bytes:</text>
<text x="656.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">offset of the lump (4)</text>
<text x="656.0" y="198.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">size of the lump (4)</text>
<text x="656.0" y="214.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">name, 8 characters</text>
<text x="24.0" y="262.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">A level is a marker lump of size 0, followed by these lumps in this order</text>
<rect x="24.0" y="276.0" width="55.6" height="30.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="51.8" y="294.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">E1M1</text>
<rect x="83.6" y="276.0" width="70.4" height="30.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="118.8" y="294.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">THINGS</text>
<rect x="158.0" y="276.0" width="85.2" height="30.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="200.6" y="294.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">LINEDEFS</text>
<rect x="247.2" y="276.0" width="85.2" height="30.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="289.8" y="294.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">SIDEDEFS</text>
<rect x="336.4" y="276.0" width="85.2" height="30.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="379.0" y="294.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">VERTEXES</text>
<rect x="425.6" y="276.0" width="55.6" height="30.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="453.4" y="294.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">SEGS</text>
<rect x="485.2" y="276.0" width="85.2" height="30.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="527.8" y="294.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">SSECTORS</text>
<rect x="574.4" y="276.0" width="63.0" height="30.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="605.9" y="294.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">NODES</text>
<rect x="641.4" y="276.0" width="77.8" height="30.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="680.3" y="294.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">SECTORS</text>
<rect x="723.2" y="276.0" width="70.4" height="30.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="758.4" y="294.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">REJECT</text>
<rect x="797.6" y="276.0" width="85.2" height="30.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="840.2" y="294.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">BLOCKMAP</text>
<text x="24.0" y="330.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">NODES holds the BSP tree, SSECTORS and SEGS its leaves. REJECT and BLOCKMAP speed up sight and collision tests. A PWAD replaces lumps by name.</text>
</svg>
