<text x="176.0" y="98.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="end">1976</text>
<text x="198.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Spectrum, CPC, MSX, PC-8801, X1, Game Boy, Master System</text>
<rect x="24.0" y="111.0" width="160.0" height="26.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="34.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">6502 line</text>
<text x="176.0" y="129.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="end">1975</text>
<text x="198.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">BBC, C64, VIC-20, Atari 8-bit, Apple II, Oric, NES, SNES (65C816)</text>
