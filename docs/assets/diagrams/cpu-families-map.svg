<text x="198.0" y="315.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Archimedes, 3DO, GBA, DS, 3DS, Vita, Switch, Apple silicon</text>
