<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="On the MSX the Z80's 64 KB is four 16 KB pages. Port A8h picks which of four primary slots each page comes from. A cartridge game is switched in this way.">
<title>On the MSX the Z80's 64 KB is four 16 KB pages. Port A8h picks which of four primary slots each page comes from. A cartridge game is switched in this way.</title>
