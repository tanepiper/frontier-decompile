<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="On Namco System 22 the main CPU uploads code to the master DSP, which uploads code to the slave DSP. Sound and I/O run on a Mitsubishi MCU with a C352 PCM chip.">
<title>On Namco System 22 the main CPU uploads code to the master DSP, which uploads code to the slave DSP. Sound and I/O run on a Mitsubishi MCU with a C352 PCM chip.</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">NAMCO SYSTEM 22 AND SUPER SYSTEM 22</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The DSP programs are uploaded at start. The Prop Cycle test menu shows the uploads.</text>
<rect x="24.0" y="96.0" width="200.0" height="64.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="124.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">M68020</text>
<text x="124.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">49.152 MHz / 2</text>
<rect x="330.0" y="96.0" width="200.0" height="64.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="430.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">master DSP</text>
<text x="430.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">TI320C25 (C71)</text>
<rect x="636.0" y="96.0" width="200.0" height="64.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="736.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">slave DSP</text>
<text x="736.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">TI320C25 (C71)</text>
<path d="M228 128L326 128" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
<rect y="134" width="30" height="14" rx="2" fill="#f59e0b"><animate attributeName="x" values="228;296" dur="1.5s" begin="0s" repeatCount="indefinite"/></rect>
<text x="277.0" y="118.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#f59e0b" text-anchor="middle">uploads code</text>
<path d="M534 128L632 128" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
<rect y="134" width="30" height="14" rx="2" fill="#f59e0b"><animate attributeName="x" values="534;602" dur="1.5s" begin="1.5s" repeatCount="indefinite"/></rect>
<text x="583.0" y="118.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#f59e0b" text-anchor="middle">uploads code</text>
<rect x="24.0" y="196.0" width="260.0" height="56.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="154.0" y="221.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">C74 / M37710</text>
<text x="154.0" y="237.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">sound and I/O MCU</text>
<rect x="294.0" y="196.0" width="260.0" height="56.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="424.0" y="221.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Namco C352</text>
<text x="424.0" y="237.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">32-channel PCM, 24.576 MHz</text>
<text x="24.0" y="284.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Capture the uploaded DSP code from a running machine. It is part of the game.</text>
</svg>
