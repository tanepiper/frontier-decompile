<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="The Game Boy memory map, with the switchable ROM bank at 4000">
<title>The Game Boy memory map, with the switchable ROM bank at 4000</title>
<rect x="0.5" y="0.5" width="899" height="419" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE GAME BOY MEMORY MAP</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The mapper changes which ROM bank sits at $4000-$7FFF, so functions are named bank:address.</text>
<rect x="98.0" y="84.0" width="280.0" height="52.0" rx="3" fill="#2dd4bf" stroke="#2dd4bf" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="96.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$0000</text>
<text x="108.0" y="100.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">ROM bank 0 (fixed)</text>
<rect x="98.0" y="138.0" width="280.0" height="52.0" rx="3" fill="#f59e0b" stroke="#f59e0b" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$4000</text>
<text x="108.0" y="154.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">ROM bank n (switchable)</text>
<rect x="98.0" y="192.0" width="280.0" height="28.0" rx="3" fill="#c084fc" stroke="#c084fc" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="204.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$8000</text>
<text x="108.0" y="208.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">VRAM: tiles and maps</text>
<rect x="98.0" y="222.0" width="280.0" height="28.0" rx="3" fill="#4ade80" stroke="#4ade80" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="234.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$A000</text>
<text x="108.0" y="238.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">cartridge RAM (battery)</text>
<rect x="98.0" y="252.0" width="280.0" height="28.0" rx="3" fill="#64748b" stroke="#64748b" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="264.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$C000</text>
<text x="108.0" y="268.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">work RAM</text>
<rect x="98.0" y="282.0" width="280.0" height="20.0" rx="3" fill="#64748b" stroke="#64748b" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="294.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$E000</text>
<text x="108.0" y="297.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">echo of work RAM</text>
<rect x="98.0" y="304.0" width="280.0" height="20.0" rx="3" fill="#c084fc" stroke="#c084fc" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="316.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$FE00</text>
<text x="108.0" y="319.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">OAM: 40 sprites</text>
<rect x="98.0" y="326.0" width="280.0" height="20.0" rx="3" fill="#60a5fa" stroke="#60a5fa" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="338.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$FF00</text>
<text x="108.0" y="341.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">I/O registers</text>
<rect x="98.0" y="348.0" width="280.0" height="20.0" rx="3" fill="#64748b" stroke="#64748b" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="360.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$FF80</text>
<text x="108.0" y="363.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">high RAM</text>
<text x="92.0" y="384.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$FFFF</text>
<text x="420.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">the cartridge ROM, 16 KB banks</text>
<rect x="420.0" y="108.0" width="48.0" height="80.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.18"/>
<rect x="474.0" y="108.0" width="48.0" height="80.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<rect x="528.0" y="108.0" width="48.0" height="80.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<rect x="582.0" y="108.0" width="48.0" height="80.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<rect x="636.0" y="108.0" width="48.0" height="80.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<rect x="690.0" y="108.0" width="48.0" height="80.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<rect x="744.0" y="108.0" width="48.0" height="80.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<rect x="798.0" y="108.0" width="48.0" height="80.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<g opacity="1"><rect x="474" y="108" width="48" height="80" rx="3" fill="#f59e0b" fill-opacity="0.75"/><path d="M380 165C 400 228 498 228 498 192" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f59e0b">write 1 to $2000: bank 1 at $4000</text><animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.3333;0.6667" dur="6s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="636" y="108" width="48" height="80" rx="3" fill="#f59e0b" fill-opacity="0.75"/><path d="M380 165C 400 228 660 228 660 192" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f59e0b">write 4 to $2000: bank 4 at $4000</text><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3333;0.6667" dur="6s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="744" y="108" width="48" height="80" rx="3" fill="#f59e0b" fill-opacity="0.75"/><path d="M380 165C 400 228 768 228 768 192" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f59e0b">write 6 to $2000: bank 6 at $4000</text><animate attributeName="opacity" values="0;0;1" keyTimes="0.0000;0.3333;0.6667" dur="6s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="444.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">0</text>
<text x="498.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">1</text>
<text x="552.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">2</text>
<text x="606.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">3</text>
<text x="660.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">4</text>
<text x="714.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">5</text>
<text x="768.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">6</text>
<text x="822.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">7</text>
<text x="420.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The write goes to ROM space, where the mapper catches it. The CPU</text>
<text x="420.0" y="307.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">is a Sharp SM83, close to the Z80 and the 8080. Unicorn has none,</text>
<text x="420.0" y="324.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">so take ground truth from SameBoy.</text>
</svg>
