<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414" role="img" aria-label="The PlayStation led to ZN-1, ZN-2, Namco System 11 and 12 and Konami System 573. The Saturn led to ST-V, the Dreamcast to NAOMI, the GameCube to Triforce and the Xbox to Chihiro. The PS2 led to Namco System 246 and Konami Python 2.">
<title>The PlayStation led to ZN-1, ZN-2, Namco System 11 and 12 and Konami System 573. The Saturn led to ST-V, the Dreamcast to NAOMI, the GameCube to Triforce and the Xbox to Chihiro. The PS2 led to Namco System 246 and Konami Python 2.</title>
