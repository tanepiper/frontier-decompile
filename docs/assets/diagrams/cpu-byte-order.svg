<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="A little-endian CPU stores the value 0x12345678 as 78 56 34 12, and a big-endian CPU stores it as 12 34 56 78. The 8-bit families are little-endian except the 6809. The 16-bit console CPUs are big-endian except x86.">
<title>A little-endian CPU stores the value 0x12345678 as 78 56 34 12, and a big-endian CPU stores it as 12 34 56 78. The 8-bit families are little-endian except the 6809. The 16-bit console CPUs are big-endian except x86.</title>
