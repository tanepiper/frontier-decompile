<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Object files and library members placed by the linker in order, with the relocation table marking the pointers in the data">
<title>Object files and library members placed by the linker in order, with the relocation table marking the pointers in the data</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">WHAT THE LINKER LEAVES</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each file's code and data stay together, in link order. Library members come last.</text>
<text x="30.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">code</text>
<text x="30.0" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">data</text>
<rect x="80.0" y="76.0" width="144.0" height="34.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="152.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="middle">main.obj</text>
<rect x="80.0" y="146.0" width="84.0" height="34.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.18"/>
<rect x="230.0" y="76.0" width="174.0" height="34.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="317.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="middle">world.obj</text>
<rect x="230.0" y="146.0" width="102.0" height="34.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<rect x="410.0" y="76.0" width="134.0" height="34.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="477.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="middle">ai.obj</text>
<rect x="410.0" y="146.0" width="78.0" height="34.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.18"/>
<rect x="550.0" y="76.0" width="114.0" height="34.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="607.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="middle">libc: printf</text>
<rect x="550.0" y="146.0" width="66.0" height="34.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.18"/>
<rect x="670.0" y="76.0" width="84.0" height="34.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="712.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="middle">libc: rand</text>
<rect x="670.0" y="146.0" width="48.0" height="34.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.18"/>
<text x="80.0" y="214.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">.reloc</text>
<path d="M100.0 180.0L100.0 200.0" stroke="#f59e0b" stroke-width="2" fill="none"/>
<path d="M112.0 180.0L112.0 200.0" stroke="#f59e0b" stroke-width="2" fill="none"/>
<path d="M250.0 180.0L250.0 200.0" stroke="#f59e0b" stroke-width="2" fill="none"/>
<path d="M262.0 180.0L262.0 200.0" stroke="#f59e0b" stroke-width="2" fill="none"/>
<path d="M274.0 180.0L274.0 200.0" stroke="#f59e0b" stroke-width="2" fill="none"/>
<path d="M440.0 180.0L440.0 200.0" stroke="#f59e0b" stroke-width="2" fill="none"/>
<text x="140.0" y="214.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Each mark is an address the loader may change. In data, each one is a pointer.</text>
<text x="30.0" y="262.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Three marks side by side are a table of three pointers: a vtable, a table of functions or a table of strings.</text>
<text x="30.0" y="286.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">tools/pe/relocs.py lists every run of pointers.</text>
</svg>
