<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="A raster effect, where an interrupt on one line rewrites the scroll register">
<title>A raster effect, where an interrupt on one line rewrites the scroll register</title>
<rect x="0.5" y="0.5" width="899" height="339" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">RASTER EFFECTS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">An interrupt fires on a chosen line. The game writes a video register in the interrupt handler.</text>
<clipPath id="pf"><rect x="40" y="84" width="360" height="170"/></clipPath>
<g clip-path="url(#pf)"><rect x="40" y="84" width="360" height="170" fill="#60a5fa" fill-opacity="0.18"/><g><rect x="-40" y="138" width="30" height="116" fill="#4ade80" fill-opacity="0.45"/><rect x="0" y="171" width="30" height="83" fill="#4ade80" fill-opacity="0.45"/><rect x="40" y="204" width="30" height="50" fill="#4ade80" fill-opacity="0.45"/><rect x="80" y="167" width="30" height="87" fill="#4ade80" fill-opacity="0.45"/><rect x="120" y="200" width="30" height="54" fill="#4ade80" fill-opacity="0.45"/><rect x="160" y="163" width="30" height="91" fill="#4ade80" fill-opacity="0.45"/><rect x="200" y="196" width="30" height="58" fill="#4ade80" fill-opacity="0.45"/><rect x="240" y="159" width="30" height="95" fill="#4ade80" fill-opacity="0.45"/><rect x="280" y="192" width="30" height="62" fill="#4ade80" fill-opacity="0.45"/><rect x="320" y="155" width="30" height="99" fill="#4ade80" fill-opacity="0.45"/><rect x="360" y="188" width="30" height="66" fill="#4ade80" fill-opacity="0.45"/><rect x="400" y="151" width="30" height="103" fill="#4ade80" fill-opacity="0.45"/><rect x="440" y="184" width="30" height="70" fill="#4ade80" fill-opacity="0.45"/><rect x="480" y="147" width="30" height="107" fill="#4ade80" fill-opacity="0.45"/><rect x="520" y="180" width="30" height="74" fill="#4ade80" fill-opacity="0.45"/><rect x="560" y="143" width="30" height="111" fill="#4ade80" fill-opacity="0.45"/><rect x="600" y="176" width="30" height="78" fill="#4ade80" fill-opacity="0.45"/><rect x="640" y="139" width="30" height="115" fill="#4ade80" fill-opacity="0.45"/><rect x="680" y="172" width="30" height="82" fill="#4ade80" fill-opacity="0.45"/><rect x="720" y="135" width="30" height="119" fill="#4ade80" fill-opacity="0.45"/><rect x="760" y="168" width="30" height="86" fill="#4ade80" fill-opacity="0.45"/><rect x="800" y="201" width="30" height="53" fill="#4ade80" fill-opacity="0.45"/><animateTransform attributeName="transform" type="translate" values="0 0;-80 0" dur="2s" repeatCount="indefinite"/></g></g>
<rect x="40.0" y="254.0" width="360.0" height="60.0" rx="0" fill="#64748b" stroke="none" fill-opacity="0.35"/>
<text x="54.0" y="280.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">SCORE 001200    LIVES 3</text>
<path d="M34.0 254.0L406.0 254.0" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
<rect x="40" y="84" width="360" height="2" fill="#e2ece9"><animate attributeName="y" values="84;312" dur="1.6s" repeatCount="indefinite"/></rect>
<text x="440.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="start">line 170: the interrupt fires</text>
<text x="440.0" y="142.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The handler sets the scroll back to 0, so the lines below are</text>
<text x="440.0" y="159.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">drawn without scrolling.</text>
<text x="440.0" y="198.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Line interrupts</text>
<text x="440.0" y="220.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Examples are H-IRQ on the SNES and LYC on the Game Boy.</text>
<text x="440.0" y="258.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Apply the register change at the same line in the port. Drawing</text>
<text x="440.0" y="275.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">the whole frame from the final register values loses the effect.</text>
</svg>
