<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each output bit is a logic function (the minterm) of the A, B and C bits. Blocks up to 1,024 x 1,024 pixels.</text>
