<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="The Amiga Blitter reads up to three sources, A, B and C, combines them bit by bit with a logic function and writes the destination D. A cookie-cut draws an object through its mask onto the background.">
<title>The Amiga Blitter reads up to three sources, A, B and C, combines them bit by bit with a logic function and writes the destination D. A cookie-cut draws an object through its mask onto the background.</title>
<rect x="0.5" y="0.5" width="899" height="379" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
