<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="A captured frame as its list of draw calls; each call adds to the picture in order, and the capture records the state and inputs of each">
<title>A captured frame as its list of draw calls; each call adds to the picture in order, and the capture records the state and inputs of each</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">A FRAME IS A LIST OF DRAW CALLS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">A capture tool records each call in order, with its shaders, textures and constants.</text>
<g opacity="1"><rect x="40" y="86" width="300" height="32" rx="4" fill="#64748b" fill-opacity="0.3"/><text x="52" y="107" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">draw 1: clear</text></g>
<g opacity="0"><rect x="40" y="126" width="300" height="32" rx="4" fill="#4ade80" fill-opacity="0.3"/><text x="52" y="147" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">draw 2: terrain</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.167;0.167;1" dur="7.2s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="440" y="206" width="400" height="110" rx="3" fill="#4ade80" fill-opacity="0.75"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.167;0.167;1" dur="7.2s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="40" y="166" width="300" height="32" rx="4" fill="#f59e0b" fill-opacity="0.3"/><text x="52" y="187" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">draw 3: buildings</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.333;0.333;1" dur="7.2s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="500" y="146" width="200" height="100" rx="3" fill="#f59e0b" fill-opacity="0.75"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.333;0.333;1" dur="7.2s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="40" y="206" width="300" height="32" rx="4" fill="#2dd4bf" fill-opacity="0.3"/><text x="52" y="227" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">draw 4: people</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.500;1" dur="7.2s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="680" y="236" width="40" height="40" rx="3" fill="#2dd4bf" fill-opacity="0.75"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.500;1" dur="7.2s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="40" y="246" width="300" height="32" rx="4" fill="#2f855a" fill-opacity="0.3"/><text x="52" y="267" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">draw 5: trees</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.667;0.667;1" dur="7.2s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="740" y="126" width="70" height="120" rx="3" fill="#2f855a" fill-opacity="0.75"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.667;0.667;1" dur="7.2s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="40" y="286" width="300" height="32" rx="4" fill="#60a5fa" fill-opacity="0.3"/><text x="52" y="307" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">draw 6: interface</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.833;0.833;1" dur="7.2s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="440" y="86" width="400" height="24" rx="3" fill="#60a5fa" fill-opacity="0.75"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.833;0.833;1" dur="7.2s" repeatCount="indefinite"/></g>
<rect x="440.0" y="86.0" width="400.0" height="230.0" rx="3" fill="#64748b" stroke="#64748b" fill-opacity="0.1" stroke-opacity="0.6"/>
<text x="440.0" y="334.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">The picture builds up in the order of the calls. The port must keep the order where it shows.</text>
</svg>
