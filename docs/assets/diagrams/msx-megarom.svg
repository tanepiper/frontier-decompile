<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-label="The Konami, Konami SCC, ASCII 8K and ASCII 16K mappers each split 4000h to BFFFh into banks. Each switches its banks by writes to different addresses, so an emulator needs the right mapper type.">
<title>The Konami, Konami SCC, ASCII 8K and ASCII 16K mappers each split 4000h to BFFFh into banks. Each switches its banks by writes to different addresses, so an emulator needs the right mapper type.</title>
