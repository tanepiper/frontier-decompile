<text x="236.0" y="145.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Z80</text>
<text x="236.0" y="163.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">sound</text>
<rect x="46.0" y="196.0" width="250.0" height="80.0" rx="5" fill="#64748b" stroke="#64748b" fill-opacity="0.12" stroke-opacity="0.65"/>
<text x="171.0" y="231.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Cartridge port</text>
<text x="171.0" y="249.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">the add-on connects here</text>
<rect x="560.0" y="84.0" width="310.0" height="210.0" rx="5" fill="#c084fc" stroke="#c084fc" fill-opacity="0.07" stroke-opacity="0.65"/>
<text x="576.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Mega-CD add-on</text>
<rect x="576.0" y="120.0" width="130.0" height="60.0" rx="5" fill="#c084fc" stroke="#c084fc" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="641.0" y="145.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Sub 68000</text>
<text x="641.0" y="163.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">12.5 MHz</text>
