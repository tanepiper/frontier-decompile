<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="A message stored as a type and arguments, formatted through the string table of the player's language when it is shown">
<title>A message stored as a type and arguments, formatted through the string table of the player's language when it is shown</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">MESSAGES FROM A STRING TABLE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The text is made when the message is shown, from the language's string table.</text>
<rect x="40.0" y="100.0" width="220.0" height="70.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="150.0" y="133.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">message 0x12</text>
<text x="150.0" y="150.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">person 41, building 7</text>
<rect x="330.0" y="100.0" width="240.0" height="70.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="450.0" y="133.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">string 0x12 (English)</text>
<text x="450.0" y="150.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">"%1 has moved into %2."</text>
<rect x="630.0" y="100.0" width="240.0" height="70.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="750.0" y="133.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">"Ana has moved into</text>
<text x="750.0" y="150.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">the Stone House."</text>
<path d="M262.0 135.0L326.0 135.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M572.0 135.0L636.0 135.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="40.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A save may keep the arguments (formatted again on load) or only the text (shown as it is).</text>
<text x="40.0" y="232.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Never hard-code English where the original reads a table.</text>
</svg>
