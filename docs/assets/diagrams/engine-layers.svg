<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-label="The layers of a game built on an engine, from data and scripts down to the system, with the work that each layer needs">
<title>The layers of a game built on an engine, from data and scripts down to the system, with the work that each layer needs</title>
<rect x="0.5" y="0.5" width="899" height="369" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE LAYERS OF A GAME BUILT ON AN ENGINE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each layer needs different work. Most of the work is in the layers that hold the game itself.</text>
<rect x="24.0" y="80.0" width="470.0" height="50.0" rx="5" fill="#f59e0b" stroke="none" fill-opacity="0.2"/>
<text x="40.0" y="102.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Game data and scripts</text>
<text x="40.0" y="119.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">QuakeC, UnrealScript, CON files, Infinity Engine scripts, rule tables</text>
<path d="M500.0 105.0L530.0 105.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="540.0" y="109.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">Read them first. Port the interpreter, then run the game's own data</text>
<rect x="24.0" y="136.0" width="470.0" height="50.0" rx="5" fill="#f87171" stroke="none" fill-opacity="0.2"/>
<text x="40.0" y="158.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">The game's native code</text>
<text x="40.0" y="175.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">what the studio wrote in C or C++ on top of the engine</text>
<path d="M500.0 161.0L530.0 161.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="540.0" y="165.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">Reverse engineer it, because it holds the game</text>
<rect x="24.0" y="192.0" width="470.0" height="50.0" rx="5" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="40.0" y="214.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">The engine</text>
<text x="40.0" y="231.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">renderer, file formats, script interpreter, object system</text>
<path d="M500.0 217.0L530.0 217.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="540.0" y="221.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">Look up its formats, its released source, its reimplementations</text>
<rect x="24.0" y="248.0" width="470.0" height="50.0" rx="5" fill="#c084fc" stroke="none" fill-opacity="0.2"/>
<text x="40.0" y="270.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Middleware</text>
<text x="40.0" y="287.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">video (Smacker, Bink), sound (Miles, FMOD), physics (Havok)</text>
<path d="M500.0 273.0L530.0 273.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="540.0" y="277.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">Identify it, label it, replace it with a library that does the same job</text>
<rect x="24.0" y="304.0" width="470.0" height="50.0" rx="5" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<text x="40.0" y="326.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">System and hardware</text>
<text x="40.0" y="343.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">DOS, Windows, DirectX, OpenGL, the sound card</text>
<path d="M500.0 329.0L530.0 329.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="540.0" y="333.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">See the hardware guides</text>
</svg>
