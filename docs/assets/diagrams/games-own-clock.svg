<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="A game that runs on its own clock. Each frame reads the input state once, updates in a fixed order and draws. Everything from outside comes in as one record per frame. The picture and sounds go out the same way">
<title>A game that runs on its own clock. Each frame reads the input state once, updates in a fixed order and draws. Everything from outside comes in as one record per frame. The picture and sounds go out the same way</title>
<rect x="0.5" y="0.5" width="899" height="379" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">A GAME THAT RUNS ON ITS OWN CLOCK</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The game runs one loop in a fixed order every frame. Everything from outside the game comes in through one record per frame.</text>
<rect x="378.0" y="94.0" width="144.0" height="32.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="450.0" y="113.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">read input state</text>
<rect x="378.0" y="94.0" width="144" height="32" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.1667" dur="4.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="461.1" y="142.0" width="144.0" height="32.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="533.1" y="161.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">move the player</text>
<rect x="461.1" y="142.0" width="144" height="32" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1667;0.3333" dur="4.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="461.1" y="238.0" width="144.0" height="32.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="533.1" y="257.9" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">move enemies, shots</text>
<rect x="461.1" y="238.0" width="144" height="32" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.5000" dur="4.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="378.0" y="286.0" width="144.0" height="32.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="450.0" y="305.9" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">collisions</text>
<rect x="378.0" y="286.0" width="144" height="32" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5000;0.6667" dur="4.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="294.9" y="238.0" width="144.0" height="32.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="366.9" y="257.9" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">scroll, spawn waves</text>
<rect x="294.9" y="238.0" width="144" height="32" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6667;0.8333" dur="4.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="294.9" y="142.0" width="144.0" height="32.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="366.9" y="161.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">draw the frame and HUD</text>
<rect x="294.9" y="142.0" width="144" height="32" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8333;1.0000" dur="4.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="450.0" y="204.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="middle">one frame</text>
<text x="450" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e2ece9" text-anchor="middle">frame n</text>
<rect x="24.0" y="100.0" width="190.0" height="220.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<text x="36.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">the record for frame n</text>
<text x="36.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">keys and buttons (state)</text>
<text x="36.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">the clock</text>
<text x="36.0" y="190.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">the random seed</text>
<text x="36.0" y="212.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">files and saves</text>
<text x="36.0" y="234.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">settings</text>
<text x="36.0" y="256.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">the hardware detected</text>
<text x="36.0" y="278.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">window messages</text>
<path d="M216.0 210.0L300.0 210.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="690.0" y="120.0" width="186.0" height="180.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<text x="702.0" y="142.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">out of frame n</text>
<text x="702.0" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">the finished picture</text>
<text x="702.0" y="186.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">the songs and sounds</text>
<text x="702.0" y="206.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">asked for</text>
<text x="702.0" y="226.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start"></text>
<text x="702.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">compared exactly with</text>
<text x="702.0" y="266.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">the original's</text>
<path d="M600.0 210.0L686.0 210.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="24.0" y="358.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Two runs with the same records give the same frames. A demo, a test or a player can drive the core.</text>
</svg>
