<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="On Namco System 21 in Cyber Sled and Star Blade, two 68000s send a display list to a master C67 DSP. The master applies high-level geometry and hands primitives to four slave C67s that transform, project and clip them.">
<title>On Namco System 21 in Cyber Sled and Star Blade, two 68000s send a display list to a master C67 DSP. The master applies high-level geometry and hands primitives to four slave C67s that transform, project and clip them.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">NAMCO SYSTEM 21 "POLYGONIZER"</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">On Cyber Sled and Star Blade, five DSPs share the geometry. Each runs its own program.</text>
<rect x="24.0" y="140.0" width="150.0" height="64.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="99.0" y="169.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">2 x M68000</text>
<text x="99.0" y="185.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">12.288 MHz, game</text>
<rect x="250.0" y="140.0" width="160.0" height="64.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="330.0" y="169.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">master C67</text>
<text x="330.0" y="185.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">parses the display list</text>
<rect x="500.0" y="84.0" width="170.0" height="44.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.2"/>
<text x="585.0" y="103.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">slave C67 1</text>
<text x="585.0" y="119.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#8fa9a5" text-anchor="middle">transform, project, clip</text>
<path d="M414.0 172.0L496.0 106.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M674.0 106.0L736.0 172.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="500.0" y="140.0" width="170.0" height="44.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.2"/>
<text x="585.0" y="159.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">slave C67 2</text>
<text x="585.0" y="175.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#8fa9a5" text-anchor="middle">transform, project, clip</text>
<path d="M414.0 172.0L496.0 162.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M674.0 162.0L736.0 172.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="500.0" y="196.0" width="170.0" height="44.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.2"/>
<text x="585.0" y="215.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">slave C67 3</text>
<text x="585.0" y="231.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#8fa9a5" text-anchor="middle">transform, project, clip</text>
<path d="M414.0 172.0L496.0 218.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M674.0 218.0L736.0 172.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="500.0" y="252.0" width="170.0" height="44.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.2"/>
<text x="585.0" y="271.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">slave C67 4</text>
<text x="585.0" y="287.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#8fa9a5" text-anchor="middle">transform, project, clip</text>
<path d="M414.0 172.0L496.0 274.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M674.0 274.0L736.0 172.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="740.0" y="140.0" width="130.0" height="64.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.25"/>
<text x="805.0" y="169.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">polygons</text>
<text x="805.0" y="185.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">to the screen</text>
<path d="M178.0 172.0L246.0 172.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="212.0" y="164.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">display list</text>
<circle r="4" fill="#f59e0b"><animateMotion path="M414 172L496 106L674 106L736 172" dur="2s" begin="0.0s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f59e0b"><animateMotion path="M414 172L496 162L674 162L736 172" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f59e0b"><animateMotion path="M414 172L496 218L674 218L736 172" dur="2s" begin="1.0s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f59e0b"><animateMotion path="M414 172L496 274L674 274L736 172" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
<text x="24.0" y="318.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A C67 is a TMS320C25 with custom ROM. MAME clocks them from a 40 MHz crystal. Winning Run and Driver's Eyes</text>
<text x="24.0" y="336.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">use one TMS320C25 each. Ghidra has no TMS320C25 module.</text>
</svg>
