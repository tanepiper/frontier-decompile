<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="The Sega FD1094 decrypts only words fetched from program space. A chain of conditional XORs and bit swaps is controlled by 32 variables. Eight of them vary with the address and repeat every 0x2000 words. The program can switch between 256 states.">
<title>The Sega FD1094 decrypts only words fetched from program space. A chain of conditional XORs and bit swaps is controlled by 32 variables. Eight of them vary with the address and repeat every 0x2000 words. The program can switch between 256 states.</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">SEGA FD1094 AND FD1089</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The FD1094 decrypts opcode fetches only. Its result depends on the address and on the current state.</text>
<rect x="24.0" y="96.0" width="170.0" height="56.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="109.0" y="121.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">encrypted word</text>
<text x="109.0" y="137.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">fetched as an opcode</text>
<rect x="260.0" y="86.0" width="240.0" height="76.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="380.0" y="121.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">conditional XORs, bit swaps</text>
<text x="380.0" y="137.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">32 variables</text>
<rect x="566.0" y="96.0" width="170.0" height="56.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.3"/>
<text x="651.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">plain opcode</text>
<path d="M198.0 124.0L256.0 124.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M504.0 124.0L562.0 124.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="160.0" y="200.0" width="200.0" height="52.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="260.0" y="223.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">8 vary by address</text>
<text x="260.0" y="239.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">repeat every 0x2000 words</text>
<rect x="400.0" y="200.0" width="200.0" height="52.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="500.0" y="223.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">256 states</text>
<text x="500.0" y="239.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">switched by the program</text>
<path d="M260.0 196.0L320.0 166.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M500.0 196.0L440.0 166.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="24.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Data reads are not decrypted. A final step turns about 300 or 5000 values into FFFF. The FD1089 encrypts opcodes</text>
<text x="24.0" y="318.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">and data. It changes 8 of 16 bits, with 12 address bits selecting the key. Take FD1094 ground truth from a running emulator.</text>
</svg>
