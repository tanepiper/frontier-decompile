<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Two cases where the 6502 ADC p-code in Ghidra gives the wrong flags">
<title>Two cases where the 6502 ADC p-code in Ghidra gives the wrong flags</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">GHIDRA'S 6502 ADC FLAGS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The ADC p-code has no decimal mode and computes two flags wrongly, as these two cases show.</text>
<text x="190.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">A + operand + C</text>
<text x="390.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">result</text>
<text x="500.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">real 6502</text>
<text x="680.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Ghidra p-code</text>
<rect x="30.0" y="112.0" width="840.0" height="44.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.1"/>
<text x="40.0" y="139.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">signed overflow</text>
<text x="190.0" y="139.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#e2ece9" text-anchor="start">$50 + $50 + 0</text>
<text x="390.0" y="139.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#e2ece9" text-anchor="start">$A0</text>
<text x="500.0" y="139.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#4ade80" text-anchor="start">V = 1, C = 0</text>
<text x="680.0" y="139.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#f87171" text-anchor="start">V = 0 (copied from C)</text>
<rect x="30.0" y="168.0" width="840.0" height="44.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.1"/>
<text x="40.0" y="195.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">incoming carry</text>
<text x="190.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#e2ece9" text-anchor="start">$FF + $00 + 1</text>
<text x="390.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#e2ece9" text-anchor="start">$00</text>
<text x="500.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#4ade80" text-anchor="start">C = 1</text>
<text x="680.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#f87171" text-anchor="start">C = 0 (carry-in ignored)</text>
<text x="40.0" y="254.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">80 + 80 = 160 does not fit a signed byte (-128 to 127), so the real V flag is set. Take 6502 ground truth from a tested core</text>
<text x="40.0" y="271.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">such as py65, mre/mos6502, floooh/chips or MAME.</text>
</svg>
