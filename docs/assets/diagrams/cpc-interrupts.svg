<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="The CPC gate array raises an interrupt every 52 lines, six times in a 312-line frame at 50 Hz. Games time split screens from these interrupts. The CRTC type changes the edges of the picture.">
<title>The CPC gate array raises an interrupt every 52 lines, six times in a 312-line frame at 50 Hz. Games time split screens from these interrupts. The CRTC type changes the edges of the picture.</title>
<rect x="0.5" y="0.5" width="899" height="379" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">SIX CPC INTERRUPTS A FRAME</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The gate array interrupts every 52 lines. 6 x 52 = 312 lines, one 50 Hz frame.</text>
<rect x="40.0" y="86.0" width="300.0" height="250.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<rect x="42.0" y="87.0" width="296.0" height="39.7" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<path d="M30.0 86.0L350.0 86.0" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
<text x="356.0" y="90.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="start">interrupt 1</text>
<rect x="42.0" y="128.7" width="296.0" height="39.7" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<path d="M30.0 127.7L350.0 127.7" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
<text x="356.0" y="131.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="start">interrupt 2: 52 lines later</text>
<rect x="42.0" y="170.3" width="296.0" height="39.7" rx="2" fill="#c084fc" stroke="none" fill-opacity="0.18"/>
<path d="M30.0 169.3L350.0 169.3" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
<text x="356.0" y="173.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="start">interrupt 3: 104 lines later</text>
<rect x="42.0" y="212.0" width="296.0" height="39.7" rx="2" fill="#c084fc" stroke="none" fill-opacity="0.18"/>
<path d="M30.0 211.0L350.0 211.0" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
<text x="356.0" y="215.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="start">interrupt 4: 156 lines later</text>
<rect x="42.0" y="253.7" width="296.0" height="39.7" rx="2" fill="#2dd4bf" stroke="none" fill-opacity="0.18"/>
<path d="M30.0 252.7L350.0 252.7" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
<text x="356.0" y="256.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="start">interrupt 5: 208 lines later</text>
<rect x="42.0" y="295.3" width="296.0" height="39.7" rx="2" fill="#2dd4bf" stroke="none" fill-opacity="0.18"/>
<path d="M30.0 294.3L350.0 294.3" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
<text x="356.0" y="298.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="start">interrupt 6: 260 lines later</text>
<rect x="40" y="86" width="300" height="2" fill="#e2ece9"><animate attributeName="y" values="86;334" dur="3s" repeatCount="indefinite"/></rect>
<text x="40.0" y="362.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">A game can change the mode or palette at each interrupt.</text>
<text x="560.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Modes, chosen by the gate array:</text>
<text x="560.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">160 x 200 in 16 colours</text>
<text x="560.0" y="140.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">320 x 200 in 4 colours</text>
<text x="560.0" y="158.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">640 x 200 in 2 colours</text>
<text x="560.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The 6845 CRTC comes in types 0 to 4.</text>
<text x="560.0" y="218.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">They differ at the edges of the picture.</text>
<text x="560.0" y="236.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Split screens and overscan depend on</text>
<text x="560.0" y="254.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">those differences, so record the CRTC</text>
<text x="560.0" y="272.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">type of the reference machine.</text>
</svg>
