<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="The Atari 7800 clock slows for TIA and RIOT access. NTSC consoles check the cartridge signature">
<title>The Atari 7800 clock slows for TIA and RIOT access. NTSC consoles check the cartridge signature</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">ATARI 7800 CPU CLOCK</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">SALLY runs at 1.79 MHz and slows to 1.19 MHz for each access to the TIA or the RIOT.</text>
<rect x="40.0" y="104.0" width="57.0" height="34.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="69.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">RAM</text>
<rect x="100.0" y="104.0" width="57.0" height="34.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="129.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">ROM</text>
<rect x="160.0" y="104.0" width="87.3" height="34.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="204.1" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">TIA</text>
<rect x="250.3" y="104.0" width="57.0" height="34.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="279.3" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">RAM</text>
<rect x="310.3" y="104.0" width="87.3" height="34.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="354.4" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">RIOT</text>
<rect x="400.5" y="104.0" width="57.0" height="34.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="429.5" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">ROM</text>
<rect x="460.5" y="104.0" width="57.0" height="34.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="489.5" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">ROM</text>
<rect x="520.5" y="104.0" width="87.3" height="34.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="564.6" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">TIA</text>
<text x="40.0" y="158.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Each box is one CPU cycle. Cycles on the TIA and the RIOT take 1.5 times as long.</text>
<text x="40.0" y="176.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A port that counts cycles must count these.</text>
<rect x="40.0" y="218.0" width="160.0" height="56.0" rx="5" fill="#64748b" stroke="#64748b" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="120.0" y="241.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Cartridge</text>
<text x="120.0" y="259.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">inserted</text>
<path d="M202.0 246.0L246.0 246.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="250.0" y="218.0" width="200.0" height="56.0" rx="5" fill="#60a5fa" stroke="#60a5fa" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="350.0" y="241.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">NTSC console</text>
<text x="350.0" y="259.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">checks the signature</text>
<path d="M452.0 246.0L496.0 246.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="500.0" y="218.0" width="130.0" height="56.0" rx="5" fill="#2dd4bf" stroke="#2dd4bf" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="565.0" y="241.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Game runs</text>
<text x="565.0" y="259.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">if it is valid</text>
<text x="655.0" y="251.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="middle">or</text>
<rect x="680.0" y="218.0" width="190.0" height="56.0" rx="5" fill="#c084fc" stroke="#c084fc" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="775.0" y="241.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">PAL console</text>
<text x="775.0" y="259.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">skips the check</text>
</svg>
