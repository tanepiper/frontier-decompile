<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Taito F3 has a 68EC020 main CPU that MAME sets to 16 MHz, although it should be 30.47618 MHz / 2. The Taito EN sound board has a 68000, an Ensoniq ES5505, an ES5510 effects DSP and an MC68681 DUART.">
<title>Taito F3 has a 68EC020 main CPU that MAME sets to 16 MHz, although it should be 30.47618 MHz / 2. The Taito EN sound board has a 68000, an Ensoniq ES5505, an ES5510 effects DSP and an MC68681 DUART.</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">TAITO F3 (1992)</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">MAME marks its own F3 CPU clock as wrong. The sound board has its own 68000 and DSP.</text>
<rect x="24.0" y="96.0" width="240.0" height="64.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="144.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">68EC020</text>
<text x="144.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">MAME: 16 MHz; "should be 30.47618 / 2"</text>
<rect x="300.0" y="80.0" width="576.0" height="100.0" rx="8" fill="#c084fc" stroke="none" fill-opacity="0.12"/>
<text x="316.0" y="102.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Taito EN sound board</text>
<rect x="316.0" y="112.0" width="120.0" height="54.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="376.0" y="136.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">68000</text>
<text x="376.0" y="152.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">15.238 MHz</text>
<rect x="442.0" y="112.0" width="120.0" height="54.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="502.0" y="136.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">ES5505</text>
<text x="502.0" y="152.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">Ensoniq</text>
<rect x="568.0" y="112.0" width="150.0" height="54.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="643.0" y="136.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">ES5510</text>
<text x="643.0" y="152.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">effects DSP, 10 MHz</text>
<rect x="724.0" y="112.0" width="120.0" height="54.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="784.0" y="136.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">MC68681</text>
<text x="784.0" y="152.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">DUART</text>
<text x="24.0" y="218.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Screen: 26.686 MHz / 4, 432 x 262 totals, 58.94 Hz, from the crystal and community measurements.</text>
<text x="24.0" y="236.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Another F3 configuration uses 58.97 Hz.</text>
</svg>
