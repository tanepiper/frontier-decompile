<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The NOT_WORKING, UNEMULATED_PROTECTION and IMPERFECT flags say whether MAME can be ground truth for a game. SUPPORTS_SAVE, MECHANICAL and IS_BIOS_ROOT describe the set.">
<title>The NOT_WORKING, UNEMULATED_PROTECTION and IMPERFECT flags say whether MAME can be ground truth for a game. SUPPORTS_SAVE, MECHANICAL and IS_BIOS_ROOT describe the set.</title>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">MAME MACHINE FLAGS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Check the flags before you use MAME as ground truth for a game.</text>
<rect x="24.0" y="80.0" width="320.0" height="26.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.3"/>
<text x="34.0" y="98.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MACHINE_NOT_WORKING</text>
<text x="360.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">imperfect emulation prevents using the system as intended</text>
<rect x="24.0" y="112.0" width="320.0" height="26.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.3"/>
<text x="34.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MACHINE_UNEMULATED_PROTECTION</text>
<text x="360.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">protection is not emulated</text>
<rect x="24.0" y="144.0" width="320.0" height="26.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="34.0" y="162.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MACHINE_IMPERFECT_GRAPHICS</text>
<text x="360.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">graphics are imperfect</text>
<rect x="24.0" y="176.0" width="320.0" height="26.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="34.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MACHINE_IMPERFECT_SOUND</text>
<text x="360.0" y="194.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">sound is imperfect</text>
<rect x="24.0" y="208.0" width="320.0" height="26.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="34.0" y="226.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MACHINE_IMPERFECT_TIMING</text>
<text x="360.0" y="226.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">timing is imperfect</text>
<rect x="24.0" y="240.0" width="320.0" height="26.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="34.0" y="258.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MACHINE_NODEVICE_LAN</text>
<text x="360.0" y="258.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">unemulated local area networking</text>
<rect x="24.0" y="272.0" width="320.0" height="26.0" rx="3" fill="#4ade80" stroke="none" fill-opacity="0.3"/>
<text x="34.0" y="290.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MACHINE_SUPPORTS_SAVE</text>
<text x="360.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">save states work</text>
<rect x="24.0" y="304.0" width="320.0" height="26.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="34.0" y="322.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MACHINE_MECHANICAL</text>
<text x="360.0" y="322.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">a mechanical game</text>
<rect x="24.0" y="336.0" width="320.0" height="26.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="34.0" y="354.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">MACHINE_IS_BIOS_ROOT</text>
<text x="360.0" y="354.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">a BIOS set</text>
<rect x="24.0" y="376.0" width="12.0" height="12.0" rx="2" fill="#f87171" stroke="none" fill-opacity="0.6"/>
<text x="42.0" y="386.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">not ground truth</text>
<rect x="170.0" y="376.0" width="12.0" height="12.0" rx="2" fill="#f59e0b" stroke="none" fill-opacity="0.6"/>
<text x="188.0" y="386.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">check the part you need</text>
<text x="860.0" y="386.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">A ROM marked BAD_DUMP is known to be faulty.</text>
</svg>
