<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="The CPS-2 A-board holds the 68000, RAM, graphics, sound and a 93C46 EEPROM. The B-board holds the game ROMs and the custom chips, including the battery-backed key. QSound runs on a DSP-16A.">
<title>The CPS-2 A-board holds the 68000, RAM, graphics, sound and a 93C46 EEPROM. The B-board holds the game ROMs and the custom chips, including the battery-backed key. QSound runs on a DSP-16A.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">CAPCOM CPS-2 (1993 TO 2004)</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">CPS-2 has two boards in a box coloured by region. About 50 games ran on it, in over 170 variants.</text>
<rect x="24.0" y="84.0" width="410.0" height="200.0" rx="8" fill="#60a5fa" stroke="none" fill-opacity="0.1"/>
<text x="40.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="start">A-board</text>
<rect x="40.0" y="120.0" width="120.0" height="56.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="100.0" y="145.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">68000</text>
<text x="100.0" y="161.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">16 MHz</text>
<rect x="170.0" y="120.0" width="110.0" height="56.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="225.0" y="145.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Z80</text>
<text x="225.0" y="161.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">8 MHz</text>
<rect x="290.0" y="120.0" width="130.0" height="56.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="355.0" y="145.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">93C46</text>
<text x="355.0" y="161.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">EEPROM</text>
<rect x="40.0" y="190.0" width="190.0" height="56.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="135.0" y="215.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">QSound</text>
<text x="135.0" y="231.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">DSP-16A at 60 MHz</text>
<rect x="240.0" y="190.0" width="180.0" height="56.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="330.0" y="223.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">graphics, I/O</text>
<rect x="466.0" y="84.0" width="410.0" height="200.0" rx="8" fill="#f87171" stroke="none" fill-opacity="0.1"/>
<text x="482.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="start">B-board</text>
<rect x="482.0" y="120.0" width="180.0" height="56.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="572.0" y="145.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">game ROMs</text>
<text x="572.0" y="161.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">program encrypted</text>
<rect x="672.0" y="120.0" width="180.0" height="56.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="762.0" y="153.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">custom chips</text>
<rect x="482.0" y="190.0" width="370.0" height="56.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="667.0" y="215.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">battery-backed key</text>
<text x="667.0" y="231.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">a dead battery gives a blue or green screen</text>
<rect x="482" y="190" width="370" height="56" rx="6" fill="none" stroke="#f59e0b" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></rect>
<text x="24.0" y="312.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Measured on a board: VSync 59.6388 Hz, HSync 15.4445 kHz. Its raw timing gives 59.637 Hz.</text>
<text x="24.0" y="330.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Load the 93C46 image as an input to each test. No CPS-2 game encrypted its sound program.</text>
</svg>
