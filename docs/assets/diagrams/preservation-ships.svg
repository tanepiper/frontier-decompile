<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="What a GameFrame project publishes and what stays on the owner's computer. New code and documents are published. The game's files, extracted assets and decompiled code are never published. Players bring their own copy">
<title>What a GameFrame project publishes and what stays on the owner's computer. New code and documents are published. The game's files, extracted assets and decompiled code are never published. Players bring their own copy</title>
<rect x="0.5" y="0.5" width="899" height="289" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">WHAT A PROJECT SHIPS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">A project publishes only its own code and documents.</text>
<rect x="24.0" y="86.0" width="410.0" height="150.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.14"/>
<text x="40.0" y="112.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="start">published</text>
<text x="40.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">the project's own new code</text>
<text x="40.0" y="160.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">its documents of how the game works</text>
<text x="40.0" y="182.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">its tests and tools</text>
<rect x="466.0" y="86.0" width="410.0" height="150.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.12"/>
<text x="482.0" y="112.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f87171" text-anchor="start">stays on the owner's computer</text>
<text x="482.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">the game's files</text>
<text x="482.0" y="160.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">extracted assets</text>
<text x="482.0" y="182.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">decompiled code and disassembly</text>
<text x="24.0" y="268.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Players bring their own copy of the game. The new code reads it when it runs.</text>
</svg>
