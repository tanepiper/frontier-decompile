<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="An ADF image holds 80 cylinders of 2 sides of 11 sectors of 512 bytes, 880 KB in all, and cannot hold most copy protection. An IPF image keeps the low-level track data, often from KryoFlux captures.">
<title>An ADF image holds 80 cylinders of 2 sides of 11 sectors of 512 bytes, 880 KB in all, and cannot hold most copy protection. An IPF image keeps the low-level track data, often from KryoFlux captures.</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">AMIGA ADF AND IPF DISK IMAGES</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The Amiga writes a whole track at once, so a track can hold any format a publisher chose.</text>
<text x="24.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">ADF: the sectors only</text>
