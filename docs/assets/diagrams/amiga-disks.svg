<text x="293.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">7</text>
<rect x="312.0" y="108.0" width="34.0" height="34.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.35"/>
<text x="329.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">8</text>
<rect x="348.0" y="108.0" width="34.0" height="34.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.35"/>
<text x="365.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">9</text>
<rect x="384.0" y="108.0" width="34.0" height="34.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.35"/>
<text x="401.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">10</text>
<text x="24.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">80 cylinders x 2 sides x 11 sectors x 512 bytes = 901,120 bytes (880 KB)</text>
<text x="470.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">IPF: the whole track as written</text>
<rect x="470.0" y="108.0" width="28.0" height="34.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.4"/>
<text x="484.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#e2ece9" text-anchor="middle">gap</text>
<rect x="500.0" y="108.0" width="20.0" height="34.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.4"/>
<text x="510.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#e2ece9" text-anchor="middle">sync</text>
<rect x="522.0" y="108.0" width="34.0" height="34.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.4"/>
<text x="539.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#e2ece9" text-anchor="middle">header</text>
<rect x="558.0" y="108.0" width="68.0" height="34.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.4"/>
<text x="592.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#e2ece9" text-anchor="middle">data</text>
<rect x="628.0" y="108.0" width="20.0" height="34.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.4"/>
<text x="638.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#e2ece9" text-anchor="middle">sync</text>
<rect x="650.0" y="108.0" width="34.0" height="34.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.4"/>
<text x="667.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#e2ece9" text-anchor="middle">header</text>
<rect x="686.0" y="108.0" width="68.0" height="34.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.4"/>
<text x="720.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#e2ece9" text-anchor="middle">data</text>
<rect x="756.0" y="108.0" width="88.0" height="34.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.4"/>
<text x="800.0" y="129.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#e2ece9" text-anchor="middle">long track</text>
<text x="470.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">IPF keeps sync marks, gaps, timing and odd track lengths.</text>
<text x="24.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">ADF cannot hold most copy protection. A protected game written to ADF has usually been cracked or will not load.</text>
<text x="24.0" y="228.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">IPF comes from the Software Preservation Society. A file begins with "CAPS". An open-source library reads it.</text>
<text x="24.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Keep the IPF image as the record of what shipped.</text>
<text x="24.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">The "long track" here stands for any non-standard track. Each protection has its own layout.</text>
</svg>
