<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Working through an engine's structures. Class names lead to type records. The factory table leads to each class's creation function and vtable. The stream loader gives the file format, and the main loop gives the update order">
<title>Working through an engine's structures. Class names lead to type records. The factory table leads to each class's creation function and vtable. The stream loader gives the file format, and the main loop gives the update order</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">ENGINE STRUCTURES, IN ORDER</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each step names a set of functions and leads to the next step.</text>
<rect x="24.0" y="86.0" width="200.0" height="74.0" rx="5" fill="#2dd4bf" stroke="none" fill-opacity="0.2"/>
<text x="36.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2ece9" text-anchor="start">1. Type records</text>
<text x="36.0" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">class names in the strings,</text>
<text x="36.0" y="145.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">parent pointers make the tree</text>
<path d="M226.0 123.0L238.0 123.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="240.0" y="86.0" width="200.0" height="74.0" rx="5" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="252.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2ece9" text-anchor="start">2. Factory table</text>
<text x="252.0" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">name or hash + create function,</text>
<text x="252.0" y="145.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">each leads to a vtable</text>
<path d="M442.0 123.0L454.0 123.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="456.0" y="86.0" width="200.0" height="74.0" rx="5" fill="#c084fc" stroke="none" fill-opacity="0.2"/>
<text x="468.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2ece9" text-anchor="start">3. Stream loader</text>
<text x="468.0" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">calls the factory per object;</text>
<text x="468.0" y="145.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">its reads are the file format</text>
<path d="M658.0 123.0L670.0 123.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="672.0" y="86.0" width="200.0" height="74.0" rx="5" fill="#f59e0b" stroke="none" fill-opacity="0.2"/>
<text x="684.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2ece9" text-anchor="start">4. Update order</text>
<text x="684.0" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">scene graph, then controllers,</text>
<text x="684.0" y="145.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">or the other way round</text>
<rect x="102.0" y="190.0" width="76.0" height="20.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="140.0" y="203.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e2ece9" text-anchor="middle">Object</text>
<path d="M90.0 240.0L140.0 210.0" stroke="#2dd4bf" stroke-width="1.2" fill="none"/>
<rect x="52.0" y="240.0" width="76.0" height="20.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="90.0" y="253.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e2ece9" text-anchor="middle">Spatial</text>
<path d="M190.0 240.0L140.0 210.0" stroke="#2dd4bf" stroke-width="1.2" fill="none"/>
<rect x="152.0" y="240.0" width="76.0" height="20.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="190.0" y="253.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e2ece9" text-anchor="middle">Controller</text>
<path d="M64.0 290.0L90.0 260.0" stroke="#2dd4bf" stroke-width="1.2" fill="none"/>
<rect x="26.0" y="290.0" width="76.0" height="20.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="64.0" y="303.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e2ece9" text-anchor="middle">Node</text>
<path d="M146.0 290.0L90.0 260.0" stroke="#2dd4bf" stroke-width="1.2" fill="none"/>
<rect x="108.0" y="290.0" width="76.0" height="20.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="146.0" y="303.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e2ece9" text-anchor="middle">Geometry</text>
<text x="24.0" y="336.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">IsA walks the parent pointers</text>
<text x="240.0" y="214.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">"Node"</text>
<text x="330.0" y="214.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Node::Create</text>
<text x="240.0" y="236.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">"Geometry"</text>
<text x="330.0" y="236.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Geometry::Create</text>
<text x="240.0" y="258.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">"Light"</text>
<text x="330.0" y="258.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Light::Create</text>
<text x="456.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">pass 1 creates every object</text>
<text x="456.0" y="232.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">pass 2 turns ids into pointers</text>
<text x="456.0" y="262.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">the order of pass 1 sets the</text>
<text x="456.0" y="278.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">order of lists after loading</text>
<text x="672.0" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">frame:</text>
<text x="672.0" y="227.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">  update scene graph</text>
<text x="672.0" y="244.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">  update controllers</text>
<text x="672.0" y="261.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">  draw</text>
</svg>
