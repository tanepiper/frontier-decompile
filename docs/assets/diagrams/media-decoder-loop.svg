<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="A data decoder in the code. The file is read into a buffer. A tight loop then changes each byte with constants as keys. Stopping just after the loop gives the plain data">
<title>A data decoder in the code. The file is read into a buffer. A tight loop then changes each byte with constants as keys. Stopping just after the loop gives the plain data</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
