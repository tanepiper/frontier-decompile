<path d="M176.0 121.0L206.0 121.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="210.0" y="90.0" width="250.0" height="62.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.2"/>
