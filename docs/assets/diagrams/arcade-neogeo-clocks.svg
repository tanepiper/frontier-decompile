<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="On the Neo Geo MVS a 24 MHz master clock gives a 68000 at 12 MHz, a Z80 at 4 MHz, a YM2610 at 8 MHz and a 6 MHz pixel clock. The 384 by 264 totals give about 59.19 Hz. Most games use 304 of the 320 visible pixels.">
<title>On the Neo Geo MVS a 24 MHz master clock gives a 68000 at 12 MHz, a Z80 at 4 MHz, a YM2610 at 8 MHz and a 6 MHz pixel clock. The 384 by 264 totals give about 59.19 Hz. Most games use 304 of the 320 visible pixels.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">NEO GEO MVS CLOCKS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">One 24 MHz master clock drives the board. Motherboards had 1, 2, 4 or 6 slots and were made from 1990 to 2004.</text>
<rect x="24.0" y="168.0" width="150.0" height="46.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="99.0" y="188.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">24 MHz</text>
<text x="99.0" y="204.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">master clock</text>
<path d="M178 191.0C 234 191.0 234 107 290 107" fill="none" stroke="#8fa9a5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="294.0" y="84.0" width="210.0" height="46.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="399.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">68000</text>
<text x="399.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">/ 2 = 12 MHz</text>
<path d="M178 191.0C 234 191.0 234 163 290 163" fill="none" stroke="#8fa9a5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="294.0" y="140.0" width="210.0" height="46.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="399.0" y="160.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Z80</text>
<text x="399.0" y="176.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">/ 6 = 4 MHz</text>
<path d="M178 191.0C 234 191.0 234 219 290 219" fill="none" stroke="#8fa9a5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="294.0" y="196.0" width="210.0" height="46.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="399.0" y="216.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">YM2610</text>
<text x="399.0" y="232.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">/ 3 = 8 MHz</text>
<path d="M178 191.0C 234 191.0 234 275 290 275" fill="none" stroke="#8fa9a5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="294.0" y="252.0" width="210.0" height="46.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="399.0" y="272.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">pixel clock</text>
<text x="399.0" y="288.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">/ 4 = 6 MHz</text>
<rect x="540.0" y="190.0" width="330.0" height="54.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.25"/>
<text x="705.0" y="214.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">6 MHz / (384 x 264)</text>
<text x="705.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">about 59.19 Hz (computed)</text>
<path d="M504.0 275.0L560.0 248.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="540.0" y="92.0" width="320.0" height="70.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<rect x="548.0" y="98.0" width="304.0" height="58.0" rx="2" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="700.0" y="132.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">304 of 320 pixels, used by most games</text>
<text x="540.0" y="84.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">320 x 224 visible</text>
<text x="24.0" y="340.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">MVS motherboards differ by generation (MV-1 to MV-1C). The AES home system's timing differs from the MVS.</text>
</svg>
