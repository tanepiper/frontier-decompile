<text x="24.0" y="172.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Each hunk is compressed on its own with the best codec. Hunks are 16 bytes to 1 MiB.</text>
