<text x="69.0" y="216.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">create</text>
<text x="126.0" y="216.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">createhd, createcd, createdvd, createld, createraw</text>
<rect x="24.0" y="230.0" width="90.0" height="24.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.35"/>
