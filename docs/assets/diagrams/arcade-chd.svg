<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="CHD stores disks and optical media as compressed hunks of 16 bytes to 1 MiB. The chdman tool creates, extracts, checks and verifies them with the zlib, zstd, lzma, huff and flac codecs.">
<title>CHD stores disks and optical media as compressed hunks of 16 bytes to 1 MiB. The chdman tool creates, extracts, checks and verifies them with the zlib, zstd, lzma, huff and flac codecs.</title>
