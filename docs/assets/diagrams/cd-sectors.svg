<text x="162.9" y="153.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d1b1e" text-anchor="start">user data: 2048</text>
<rect x="781.8" y="130.0" width="1.0" height="36.0" rx="2" fill="#f59e0b" stroke="none" fill-opacity="0.85"/>
