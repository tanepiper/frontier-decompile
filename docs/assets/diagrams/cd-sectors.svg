<text x="138.0" y="204.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="end">Mode 2 Form 1</text>
<rect x="150.0" y="180.0" width="2.7" height="36.0" rx="2" fill="#64748b" stroke="none" fill-opacity="0.85"/>
<rect x="153.7" y="180.0" width="1.0" height="36.0" rx="2" fill="#c084fc" stroke="none" fill-opacity="0.85"/>
<rect x="154.9" y="180.0" width="1.4" height="36.0" rx="2" fill="#4ade80" stroke="none" fill-opacity="0.85"/>
<rect x="157.3" y="180.0" width="625.9" height="36.0" rx="2" fill="#2dd4bf" stroke="none" fill-opacity="0.85"/>
<text x="165.3" y="203.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d1b1e" text-anchor="start">user data: 2048</text>
<rect x="784.3" y="180.0" width="1.0" height="36.0" rx="2" fill="#f59e0b" stroke="none" fill-opacity="0.85"/>
<rect x="785.5" y="180.0" width="83.5" height="36.0" rx="2" fill="#f87171" stroke="none" fill-opacity="0.85"/>
<text x="793.5" y="203.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d1b1e" text-anchor="start">ECC 276</text>
<text x="138.0" y="254.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="end">Mode 2 Form 2</text>
<rect x="150.0" y="230.0" width="2.7" height="36.0" rx="2" fill="#64748b" stroke="none" fill-opacity="0.85"/>
<rect x="153.7" y="230.0" width="1.0" height="36.0" rx="2" fill="#c084fc" stroke="none" fill-opacity="0.85"/>
<rect x="154.9" y="230.0" width="1.4" height="36.0" rx="2" fill="#4ade80" stroke="none" fill-opacity="0.85"/>
