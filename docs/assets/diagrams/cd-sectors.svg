<text x="165.3" y="253.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d1b1e" text-anchor="start">user data: 2324 (video, streamed sound)</text>
<rect x="868.8" y="230.0" width="1.0" height="36.0" rx="2" fill="#f59e0b" stroke="none" fill-opacity="0.85"/>
<text x="138.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="end">first 24 bytes</text>
<rect x="150.0" y="280.0" width="358.0" height="30.0" rx="2" fill="#64748b" stroke="none" fill-opacity="0.85"/>
<text x="158.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d1b1e" text-anchor="start">sync: 00 FF x10 00</text>
<rect x="510.0" y="280.0" width="118.0" height="30.0" rx="2" fill="#c084fc" stroke="none" fill-opacity="0.85"/>
<text x="518.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d1b1e" text-anchor="start">header</text>
<rect x="630.0" y="280.0" width="238.0" height="30.0" rx="2" fill="#4ade80" stroke="none" fill-opacity="0.85"/>
<text x="638.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d1b1e" text-anchor="start">XA subheader (Mode 2)</text>
<text x="150.0" y="334.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">EDC and ECC are the error detection and correction codes. Audio sectors have neither. Bit 5 of the subheader marks Form 2.</text>
<text x="150.0" y="352.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">A cooked .iso keeps only the 2048 user bytes of Mode 1 and Form 1 sectors. A raw .bin keeps all 2352.</text>
</svg>
