<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="The Virtual Boy draws one 384 by 224 picture for each eye">
<title>The Virtual Boy draws one 384 by 224 picture for each eye</title>
<rect x="0.5" y="0.5" width="899" height="259" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">VIRTUAL BOY DISPLAYS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Two red displays show 384 x 224 pixels each. A test compares both pictures.</text>
<rect x="40.0" y="90.0" width="211.2" height="123.2" rx="3" fill="#f87171" stroke="#f87171" fill-opacity="0.15"/>
<text x="48.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="start">left eye</text>
<rect x="110.0" y="140" width="50" height="30" fill="#f87171" fill-opacity="0.7"/>
<rect x="281.2" y="90.0" width="211.2" height="123.2" rx="3" fill="#f87171" stroke="#f87171" fill-opacity="0.15"/>
<text x="289.2" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="start">right eye</text>
<rect x="359.20000000000005" y="140" width="50" height="30" fill="#f87171" fill-opacity="0.7"/>
<text x="40.0" y="238.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The object is drawn a little apart in each eye to give depth.</text>
<rect x="520.0" y="106.0" width="340.0" height="80.0" rx="5" fill="#60a5fa" stroke="#60a5fa" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="690.0" y="134.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">NEC V810, 20 MHz</text>
<text x="690.0" y="152.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">Ghidra's V850 differs:</text>
<text x="690.0" y="167.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">use Ghidra_v810_v830</text>
</svg>
