<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="An executable starts in the C runtime: the entry point initialises the runtime and the static constructors, then calls WinMain or main, where the game begins">
<title>An executable starts in the C runtime: the entry point initialises the runtime and the static constructors, then calls WinMain or main, where the game begins</title>
<rect x="0.5" y="0.5" width="899" height="259" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">FROM THE ENTRY POINT TO THE GAME</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The C runtime runs first. The game's own code starts where main or WinMain is called.</text>
<rect x="30.0" y="100.0" width="150.0" height="64.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="105.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">entry point</text>
<text x="105.0" y="147.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">from the PE header</text>
<rect x="202.0" y="100.0" width="150.0" height="64.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="277.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">security cookie</text>
<text x="277.0" y="147.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">VC++ 2005 and later</text>
<path d="M182.0 132.0L200.0 132.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="374.0" y="100.0" width="150.0" height="64.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="449.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">runtime set-up</text>
<text x="449.0" y="147.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">heap, I/O, locale</text>
<path d="M354.0 132.0L372.0 132.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="546.0" y="100.0" width="150.0" height="64.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="621.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">static constructors</text>
<text x="621.0" y="147.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">_initterm table</text>
<path d="M526.0 132.0L544.0 132.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="718.0" y="100.0" width="150.0" height="64.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="793.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">WinMain / main</text>
<text x="793.0" y="147.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">the game</text>
<path d="M698.0 132.0L716.0 132.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="30.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">GetCommandLine and GetStartupInfo are called just before WinMain. Runtime error strings ("R6002") sit in the runtime.</text>
</svg>
