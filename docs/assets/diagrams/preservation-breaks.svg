<text x="24.0" y="314.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">Most DOS and early Windows games are 16-bit. Games written for 3dfx Glide need a wrapper to run at all.</text>
