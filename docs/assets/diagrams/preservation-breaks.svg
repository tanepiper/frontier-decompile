<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Changes that stopped bought games from running. 64-bit Windows runs no 16-bit programs. Windows 10 has no SafeDisc drivers. macOS Catalina runs no 32-bit apps. Windows 11 has no 32-bit edition. The Crew's servers closed. Rosetta 2 is being retired">
