<text x="40.0" y="330.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">SPU single precision rounds toward zero, has no INF or NaN, treats denormals as zero (not confirmed).</text>
<text x="40.0" y="348.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A port of SPU float code needs a software float model.</text>
