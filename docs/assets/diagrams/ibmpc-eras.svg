<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Each PC era has its own executable format. DOS used COM and MZ from 1981, DOS extenders LE and COFF from about 1990, Windows 3.x NE, Windows 95 to ME PE32, and x64 PE32+ from 2003.">
<title>Each PC era has its own executable format. DOS used COM and MZ from 1981, DOS extenders LE and COFF from about 1990, Windows 3.x NE, Windows 95 to ME PE32, and x64 PE32+ from 2003.</title>
<rect x="0.5" y="0.5" width="899" height="339" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">PC ERAS AND EXECUTABLE FORMATS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each era has its own format and tool chain, and its own way to run it today.</text>
<rect x="40.0" y="84.0" width="244.9" height="28.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.35"/>
<text x="48.0" y="102.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">IBM PC, XT, AT: COM, MZ</text>
<text x="640.0" y="102.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">DOSBox, DOSBox-X</text>
<rect x="78.7" y="120.0" width="116.0" height="28.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.35"/>
<text x="86.7" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">PCjr, Tandy 1000: COM, MZ</text>
<text x="640.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">DOSBox machine=tandy</text>
<rect x="156.0" y="156.0" width="116.0" height="28.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.35"/>
<text x="164.0" y="174.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">DOS extenders: LE, COFF</text>
<text x="640.0" y="174.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">DOSBox</text>
<rect x="156.0" y="192.0" width="64.4" height="28.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.35"/>
<text x="164.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Windows 3.x: NE</text>
<text x="640.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Wine with otvdm, a VM</text>
<rect x="220.4" y="228.0" width="77.3" height="28.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.35"/>
<text x="228.4" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Windows 95 to ME: PE32</text>
<text x="640.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Windows, Wine</text>
<rect x="297.8" y="264.0" width="322.2" height="28.0" rx="4" fill="#4ade80" stroke="none" fill-opacity="0.35"/>
<text x="305.8" y="282.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">XP to 11, x64: PE32+</text>
<text x="640.0" y="282.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Windows, Wine, Proton</text>
<text x="40.0" y="314.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">1981</text>
<text x="156.0" y="314.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">1990</text>
<text x="284.9" y="314.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">2000</text>
<text x="413.8" y="314.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">2010</text>
<text x="542.7" y="314.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">2020</text>
<text x="640.0" y="70.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="start">running it today</text>
<text x="860.0" y="330.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="end">Bar ends are approximate where the page gives no end year.</text>
</svg>
