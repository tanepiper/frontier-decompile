<text x="540.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="middle">0</text>
<rect x="40.0" y="180.0" width="380.0" height="60.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="230.0" y="208.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">jl: signed, SF != OF</text>
<text x="230.0" y="225.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">-1 &lt; 1: the jump is taken</text>
<rect x="470.0" y="180.0" width="380.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="660.0" y="208.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">jb: unsigned, CF = 1</text>
<text x="660.0" y="225.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">4294967295 &lt; 1 is false: not taken</text>
<text x="40.0" y="276.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Use the signedness of the jump, whatever type Ghidra declares.</text>
</svg>
