<text x="330.0" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">ZF</text>
<text x="330.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="middle">0</text>
<rect x="370.0" y="96.0" width="60.0" height="40.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.4"/>
<text x="400.0" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">SF</text>
<text x="400.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="middle">1</text>
<rect x="440.0" y="96.0" width="60.0" height="40.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="470.0" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">CF</text>
<text x="470.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="middle">0</text>
<rect x="510.0" y="96.0" width="60.0" height="40.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.2"/>
