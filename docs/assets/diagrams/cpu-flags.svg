<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="cmp eax, 1 with eax = -1 sets the flags once; jl reads them as signed and jumps, jb reads them as unsigned and does not">
<title>cmp eax, 1 with eax = -1 sets the flags once; jl reads them as signed and jumps, jb reads them as unsigned and does not</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">SIGNED AND UNSIGNED JUMPS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">jl and jb read the same flags after one cmp. jl compares signed numbers. jb compares unsigned numbers.</text>
<text x="40.0" y="104.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e2ece9" text-anchor="start">eax = 0xFFFFFFFF</text>
<text x="40.0" y="128.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e2ece9" text-anchor="start">cmp eax, 1</text>
