<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-label="On Namco's early boards an 18.432 MHz crystal gives Z80s at 3.072 MHz and a 6.144 MHz pixel clock. The 384 by 264 totals give about 60.61 Hz. Galaga runs three Z80s with custom chips on a 06xx bus.">
<title>On Namco's early boards an 18.432 MHz crystal gives Z80s at 3.072 MHz and a 6.144 MHz pixel clock. The 384 by 264 totals give about 60.61 Hz. Galaga runs three Z80s with custom chips on a 06xx bus.</title>
<rect x="0.5" y="0.5" width="899" height="409" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">NAMCO GALAXIAN, PAC-MAN AND GALAGA</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">One 18.432 MHz crystal drives each board. Galaga adds two more Z80s and custom chips.</text>
<rect x="24.0" y="142.0" width="150.0" height="46.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="99.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">18.432 MHz</text>
<text x="99.0" y="178.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">master crystal</text>
<path d="M178 165.0C 234 165.0 234 107 290 107" fill="none" stroke="#8fa9a5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="294.0" y="84.0" width="210.0" height="46.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="399.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Z80</text>
<text x="399.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">/ 6 = 3.072 MHz</text>
<path d="M178 165.0C 234 165.0 234 165 290 165" fill="none" stroke="#8fa9a5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="294.0" y="142.0" width="210.0" height="46.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="399.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">pixel clock</text>
<text x="399.0" y="178.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">/ 3 = 6.144 MHz</text>
<path d="M178 165.0C 234 165.0 234 223 290 223" fill="none" stroke="#8fa9a5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="294.0" y="200.0" width="210.0" height="46.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="399.0" y="220.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">51xx, 54xx</text>
<text x="399.0" y="236.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">1.536 MHz (Galaga)</text>
<rect x="540.0" y="142.0" width="330.0" height="54.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.25"/>
<text x="705.0" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">6.144 MHz / (384 x 264)</text>
<text x="705.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">about 60.61 Hz (computed)</text>
<path d="M504.0 165.0L536.0 168.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="24.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Galaga: three Z80s</text>
<rect x="24.0" y="300.0" width="120.0" height="44.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="84.0" y="327.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">main Z80</text>
<rect x="154.0" y="300.0" width="120.0" height="44.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="214.0" y="327.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">sub Z80</text>
<rect x="284.0" y="300.0" width="120.0" height="44.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="344.0" y="327.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">sound Z80</text>
<path d="M24.0 352.0L850.0 352.0" stroke="#8fa9a5" stroke-width="2" fill="none"/>
<path d="M84.0 344.0L84.0 352.0" stroke="#8fa9a5" stroke-width="2" fill="none"/>
<path d="M214.0 344.0L214.0 352.0" stroke="#8fa9a5" stroke-width="2" fill="none"/>
<path d="M344.0 344.0L344.0 352.0" stroke="#8fa9a5" stroke-width="2" fill="none"/>
<path d="M615.0 344.0L615.0 352.0" stroke="#8fa9a5" stroke-width="2" fill="none"/>
<path d="M775.0 344.0L775.0 352.0" stroke="#8fa9a5" stroke-width="2" fill="none"/>
<text x="437.0" y="366.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">06xx bus interface</text>
<rect x="540.0" y="300.0" width="150.0" height="44.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="615.0" y="319.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">51xx</text>
<text x="615.0" y="335.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">I/O</text>
<rect x="700.0" y="300.0" width="150.0" height="44.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="775.0" y="319.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">54xx</text>
<text x="775.0" y="335.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">noise sound</text>
<text x="24.0" y="392.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Run the three CPUs interleaved in the right order. Pac-Man shows 288 x 224 of the 384 x 264 total.</text>
</svg>
