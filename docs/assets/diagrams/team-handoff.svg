<text x="24.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Hand-off: Done, Evidence, Open, Next. The Next line names the agent the main session sends next.</text>
