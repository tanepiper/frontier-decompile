<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="The main session sends one agent at a time; each writes files and returns a hand-off that names the next agent">
<title>The main session sends one agent at a time; each writes files and returns a hand-off that names the next agent</title>
