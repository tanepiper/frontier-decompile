<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="A PC booter game. The BIOS reads the boot sector to 0000:7C00 and jumps there. The boot code reads more sectors with interrupt 13h to addresses it chooses, which make up the load map">
<title>A PC booter game. The BIOS reads the boot sector to 0000:7C00 and jumps there. The boot code reads more sectors with interrupt 13h to addresses it chooses, which make up the load map</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">HOW A BOOTER GAME LOADS ITSELF</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The BIOS loads one sector. The code in that sector loads the rest of the game, sector by sector, to addresses it chooses.</text>
<text x="24.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2ece9" text-anchor="start">the disk</text>
<rect x="24.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#f59e0b" stroke="none" fill-opacity="0.45"/>
<rect x="54.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.45"/>
<rect x="84.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.45"/>
<rect x="114.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.45"/>
<rect x="144.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.45"/>
<rect x="174.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.45"/>
<rect x="204.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.45"/>
<rect x="234.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.45"/>
<rect x="264.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.45"/>
<rect x="294.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<rect x="324.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<rect x="354.0" y="100.0" width="28.0" height="30.0" rx="2" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<text x="60.0" y="148.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">sector 1 of track 0 is the boot sector</text>
<text x="520.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2ece9" text-anchor="start">memory</text>
<rect x="520.0" y="100.0" width="356.0" height="34.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.12"/>
<g opacity="0"><rect x="520.0" y="100.0" width="356.0" height="34.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.35"/>
<text x="698.0" y="120.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">0000:7C00  boot code, 512 bytes</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0500;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="520.0" y="140.0" width="356.0" height="34.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.12"/>
<g opacity="0"><rect x="520.0" y="140.0" width="356.0" height="34.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.35"/>
<text x="698.0" y="160.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">1000:0000  loader</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3500;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="520.0" y="180.0" width="356.0" height="34.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.12"/>
<g opacity="0"><rect x="520.0" y="180.0" width="356.0" height="34.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.35"/>
<text x="698.0" y="200.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">2000:0000  game code</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5500;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="520.0" y="220.0" width="356.0" height="34.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.12"/>
<g opacity="0"><rect x="520.0" y="220.0" width="356.0" height="34.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.35"/>
<text x="698.0" y="240.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">3000:0000  graphics</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7500;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<path d="M38 132C 38 220 430 230 516 118" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="245.0" y="224.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#f59e0b" text-anchor="middle">the BIOS reads it and jumps there</text>
<text x="24.0" y="258.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2ece9" text-anchor="start">the load map, built from each INT 13h read</text>
<g opacity="0"><text x="24.0" y="284.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">track 0, side 0, sectors 2 to 5</text>
<text x="330.0" y="284.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2dd4bf" text-anchor="start">-&gt;  1000:0000</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3500;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="24.0" y="308.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">track 1, side 0, sectors 1 to 9</text>
<text x="330.0" y="308.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2dd4bf" text-anchor="start">-&gt;  2000:0000</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5500;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><text x="24.0" y="332.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">track 2, side 1, sectors 1 to 9</text>
<text x="330.0" y="332.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2dd4bf" text-anchor="start">-&gt;  3000:0000</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7500;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></g>
<text x="520.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">The addresses here are illustrative.</text>
<text x="520.0" y="318.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Log each INT 13h call in an emulator</text>
<text x="520.0" y="336.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">for measured evidence.</text>
</svg>
