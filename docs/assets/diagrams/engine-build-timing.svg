<text x="40.0" y="298.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">Files are in .GRP archives. Art is in .ART files with a shared palette and shade tables.</text>
