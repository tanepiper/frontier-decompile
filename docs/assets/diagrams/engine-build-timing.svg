<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="In Duke Nukem 3D, heights use a scale 16 times finer than horizontal positions. The timer runs at 120 ticks a second. The game logic runs on every fourth tick, 30 times a second">
<title>In Duke Nukem 3D, heights use a scale 16 times finer than horizontal positions. The timer runs at 120 ticks a second. The game logic runs on every fourth tick, 30 times a second</title>
<rect x="0.5" y="0.5" width="899" height="319" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">SCALES AND RATES IN DUKE NUKEM 3D</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">These values come from Duke Nukem 3D. Find the exact values in the code of your own game.</text>
<text x="40.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Positions are integers</text>
<rect x="40.0" y="110.0" width="160.0" height="14.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.45"/>
<text x="40.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">x and y, 1024 units</text>
<rect x="330.0" y="110.0" width="14.0" height="160.0" rx="2" fill="#f59e0b" stroke="none" fill-opacity="0.45"/>
<text x="352.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">the same</text>
<text x="352.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">distance in z</text>
<text x="352.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">16384 units</text>
<text x="40.0" y="176.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Code that mixes them shifts by 4.</text>
<text x="40.0" y="193.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">z &gt;&gt; 4 compares with x and y,</text>
<text x="40.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">x &lt;&lt; 4 compares with z.</text>
<text x="40.0" y="227.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Watch the shifts in maths code.</text>
<text x="480.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">The timer runs at 120 ticks a second</text>
