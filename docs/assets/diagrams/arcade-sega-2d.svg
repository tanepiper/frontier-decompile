<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384" role="img" aria-label="System 16B has one 68000 and an option for an encrypted CPU. System 18 runs at a measured 57.23 Hz. The X Board has two 68000s and the Y Board has three, which run interleaved.">
<title>System 16B has one 68000 and an option for an encrypted CPU. System 18 runs at a measured 57.23 Hz. The X Board has two 68000s and the Y Board has three, which run interleaved.</title>
