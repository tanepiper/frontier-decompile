<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="A Jedi engine elevator from an INF file. The floor of a sector moves between two stops when a switch is used. The INF file describes this as a small state machine">
<title>A Jedi engine elevator from an INF file. The floor of a sector moves between two stops when a switch is used. The INF file describes this as a small state machine</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">LEVEL LOGIC IN THE JEDI ENGINE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">INF files describe elevators, doors, switches and triggers as small state machines. This example is a lift with two stops.</text>
<rect x="40.0" y="90.0" width="300.0" height="210.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.1"/>
<path d="M40.0 280.0L340.0 280.0" stroke="#8fa9a5" stroke-width="1" fill="none"/>
<text x="48.0" y="274.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">stop 0</text>
<path d="M140.0 160.0L240.0 160.0" stroke="#8fa9a5" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
<text x="244.0" y="164.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">stop 1</text>
<rect x="140" width="100" height="10" fill="#f59e0b"><animate attributeName="y" values="270;270;150;150;270" keyTimes="0;0.2;0.45;0.75;1" dur="6.0s" repeatCount="indefinite"/></rect>
<rect x="60" y="230" width="20" height="30" rx="3" fill="#f87171"><animate attributeName="fill-opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.12;0.25;1" dur="6.0s" repeatCount="indefinite"/></rect>
<text x="70.0" y="252.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#e2ece9" text-anchor="start"></text>
<text x="60.0" y="222.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">switch</text>
<text x="190.0" y="310.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">the lift's sector, from the side</text>
<rect x="420.0" y="120.0" width="160.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="500.0" y="146.2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">at stop 0</text>
<rect x="420" y="120" width="160" height="44" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.2000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="640.0" y="120.0" width="160.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="720.0" y="146.2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">moving up</text>
<rect x="640" y="120" width="160" height="44" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2000;0.4500" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="640.0" y="230.0" width="160.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="720.0" y="256.2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">at stop 1</text>
<rect x="640" y="230" width="160" height="44" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4500;0.7500" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="420.0" y="230.0" width="160.0" height="44.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="500.0" y="256.2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">moving down</text>
<rect x="420" y="230" width="160" height="44" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7500;1.0000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<path d="M582.0 142.0L636.0 142.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="609.0" y="134.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#f59e0b" text-anchor="middle">switch</text>
<path d="M720.0 166.0L720.0 226.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="728.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">reached</text>
<path d="M636.0 252.0L584.0 252.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="609.0" y="276.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">delay</text>
<path d="M500.0 226.0L500.0 168.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="508.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">reached</text>
<text x="420.0" y="310.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">Dark Forces keeps INF files in .GOB archives. The Force Engine documents the language.</text>
</svg>
