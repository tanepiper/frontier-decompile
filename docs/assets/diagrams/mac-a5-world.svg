<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="In a 68k Mac application, register A5 points between the application globals below it and the application parameters and jump table above it. A call through the jump table makes the Segment Loader load a CODE segment. Toolbox calls are A-line traps.">
<title>In a 68k Mac application, register A5 points between the application globals below it and the application parameters and jump table above it. A call through the jump table makes the Segment Loader load a CODE segment. Toolbox calls are A-line traps.</title>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE A5 WORLD OF A 68K MAC APPLICATION</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Code lives in CODE resources. Register A5 is the base for the globals and the jump table.</text>
<rect x="200.0" y="90.0" width="240.0" height="78.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="210.0" y="133.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">jump table (from CODE 0)</text>
<rect x="200.0" y="170.0" width="240.0" height="30.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="210.0" y="189.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">application parameters</text>
<rect x="200.0" y="202.0" width="240.0" height="88.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="210.0" y="250.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">application globals</text>
<rect x="200.0" y="292.0" width="240.0" height="38.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="210.0" y="315.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">QuickDraw globals</text>
<path d="M140.0 202.0L450.0 202.0" stroke="#f87171" stroke-width="2" fill="none"/>
<text x="134.0" y="206.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f87171" text-anchor="end">A5</text>
<text x="320.0" y="350.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">higher addresses at the top</text>
<text x="134" y="150" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="11" fill="#8fa9a5" text-anchor="end">positive</text>
<text x="134" y="164" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="11" fill="#8fa9a5" text-anchor="end">offsets</text>
<text x="134" y="260" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="11" fill="#8fa9a5" text-anchor="end">negative</text>
<text x="134" y="274" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="11" fill="#8fa9a5" text-anchor="end">offsets</text>
<rect x="560.0" y="96.0" width="95.0" height="44.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="607.5" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">CODE 1</text>
<rect x="665.0" y="96.0" width="95.0" height="44.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="712.5" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">CODE 2</text>
<rect x="770.0" y="96.0" width="95.0" height="44.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="817.5" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">CODE 3</text>
<path d="M444 130C 500 130 520 160 570 144" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="665" y="96" width="95" height="44" rx="6" fill="#4ade80" fill-opacity="0.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" calcMode="discrete" dur="4.0s" repeatCount="indefinite"/></rect>
<text x="560.0" y="170.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A call through the jump table loads</text>
<text x="560.0" y="188.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">the segment if it is not in memory</text>
<text x="560.0" y="206.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">(the Segment Loader).</text>
<rect x="560.0" y="244.0" width="300.0" height="50.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.2"/>
<text x="710.0" y="266.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">A-line trap: opcode $Axxx</text>
<text x="710.0" y="282.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">the trap dispatcher calls the Toolbox</text>
<text x="24.0" y="368.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Forks are lost on other file systems, so archives use MacBinary, BinHex, AppleSingle/AppleDouble or DiskCopy.</text>
</svg>
