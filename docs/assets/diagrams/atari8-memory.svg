<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="On the 130XE, PORTB at $D301 pages one of four extra 16 KB banks into $4000 to $7FFF for the CPU or for ANTIC. ANTIC also takes cycles from each line of 114.">
<title>On the 130XE, PORTB at $D301 pages one of four extra 16 KB banks into $4000 to $7FFF for the CPU or for ANTIC. ANTIC also takes cycles from each line of 114.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">130XE BANKING AND ANTIC DMA</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">PORTB at $D301 pages extra RAM into a 16 KB window at $4000. ANTIC takes CPU cycles on every line.</text>
<text x="24.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">PORTB ($D301) on the 130XE</text>
<rect x="24.0" y="106.0" width="56.0" height="32.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="52.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">self-test</text>
<rect x="82.0" y="106.0" width="56.0" height="32.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="110.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">-</text>
<rect x="140.0" y="106.0" width="56.0" height="32.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="168.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">ANTIC</text>
<rect x="198.0" y="106.0" width="56.0" height="32.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="226.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">CPU</text>
<rect x="256.0" y="106.0" width="114.0" height="32.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="313.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">bank</text>
<rect x="372.0" y="106.0" width="56.0" height="32.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="400.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">BASIC</text>
<rect x="430.0" y="106.0" width="56.0" height="32.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="458.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">OS ROM</text>
<text x="24.0" y="160.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">bits 2-3 pick one of four 16 KB banks.</text>
<text x="24.0" y="178.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">bit 4 = 0: the CPU sees the bank at $4000.</text>
<text x="24.0" y="196.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">bit 5 = 0: ANTIC sees the bank at $4000.</text>
<text x="24.0" y="214.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A game can show one bank while it draws in another.</text>
<rect x="620.0" y="92.0" width="180.0" height="32.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="630.0" y="112.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">RAM</text>
<text x="612.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$0000</text>
<rect x="620.0" y="126.0" width="180.0" height="32.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="630.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">window: bank 0-3</text>
<text x="612.0" y="136.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$4000</text>
<rect x="620.0" y="160.0" width="180.0" height="32.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="630.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">RAM</text>
<text x="612.0" y="170.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$8000</text>
<rect x="620.0" y="194.0" width="180.0" height="32.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="630.0" y="214.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">OS ROM, I/O</text>
<text x="612.0" y="204.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$C000</text>
<text x="24.0" y="262.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">one scan line: 114 machine cycles</text>
<rect x="24.0" y="272.0" width="20.2" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.45"/>
<rect x="46.2" y="272.0" width="64.6" height="30.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.45"/>
<text x="79.5" y="292.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">refresh: 9</text>
<rect x="112.8" y="272.0" width="294.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.45"/>
<text x="260.8" y="292.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">screen data: 40 bytes in a 40-column line</text>
<rect x="408.8" y="272.0" width="456.8" height="30.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.45"/>
<text x="638.2" y="292.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">left for the CPU</text>
<text x="24.0" y="326.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">An example line. ANTIC takes more cycles on some lines of a text mode. Model them if game logic depends on CPU time.</text>
</svg>
