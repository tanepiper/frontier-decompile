<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="NES bank switching, where a mapper puts one 16 KB bank at 8000 while the last bank stays fixed">
<title>NES bank switching, where a mapper puts one 16 KB bank at 8000 while the last bank stays fixed</title>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">NES BANK SWITCHING</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">A mapper chip such as MMC1 chooses which banks fill the 32 KB of cartridge ROM that the CPU sees.</text>
<text x="40.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">what the CPU sees</text>
<text x="40.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">$8000</text>
<text x="40.0" y="236.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">$C000</text>
<text x="40.0" y="342.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">$FFFF</text>
<rect x="92.0" y="104.0" width="170.0" height="116.0" rx="5" fill="#f59e0b" stroke="#f59e0b" fill-opacity="0.15" stroke-opacity="0.65"/>
<text x="177.0" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">switchable window</text>
<text x="177" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#f59e0b" text-anchor="middle" opacity="1">bank 2<animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.3333;0.6667" dur="6s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="177" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#f59e0b" text-anchor="middle" opacity="0">bank 5<animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3333;0.6667" dur="6s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="177" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#f59e0b" text-anchor="middle" opacity="0">bank 0<animate attributeName="opacity" values="0;0;1" keyTimes="0.0000;0.3333;0.6667" dur="6s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="177.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">16 KB</text>
<rect x="92.0" y="226.0" width="170.0" height="116.0" rx="5" fill="#2dd4bf" stroke="#2dd4bf" fill-opacity="0.15" stroke-opacity="0.65"/>
<text x="177.0" y="272.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">fixed: bank 7</text>
<text x="177.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">16 KB, the last bank:</text>
<text x="177.0" y="305.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">reset code and vectors</text>
<text x="520.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">the cartridge ROM: 8 banks of 16 KB (128 KB)</text>
<rect x="520.0" y="104.0" width="40.0" height="236.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="540.0" y="356.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">0</text>
<rect x="564.0" y="104.0" width="40.0" height="236.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="584.0" y="356.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">1</text>
<rect x="608.0" y="104.0" width="40.0" height="236.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="628.0" y="356.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">2</text>
<rect x="652.0" y="104.0" width="40.0" height="236.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="672.0" y="356.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">3</text>
<rect x="696.0" y="104.0" width="40.0" height="236.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="716.0" y="356.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">4</text>
<rect x="740.0" y="104.0" width="40.0" height="236.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="760.0" y="356.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">5</text>
<rect x="784.0" y="104.0" width="40.0" height="236.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="804.0" y="356.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">6</text>
<rect x="828.0" y="104.0" width="40.0" height="236.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.18"/>
<text x="848.0" y="356.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">7</text>
<g opacity="1"><rect x="608" y="104" width="40" height="236" rx="3" fill="#f59e0b" fill-opacity="0.75"/><path d="M264 162C 380 162 548 164 606 164" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.3333;0.6667" dur="6s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="740" y="104" width="40" height="236" rx="3" fill="#f59e0b" fill-opacity="0.75"/><path d="M264 162C 380 162 680 164 738 164" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.3333;0.6667" dur="6s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="520" y="104" width="40" height="236" rx="3" fill="#f59e0b" fill-opacity="0.75"/><path d="M264 162C 380 162 460 164 518 164" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><animate attributeName="opacity" values="0;0;1" keyTimes="0.0000;0.3333;0.6667" dur="6s" calcMode="discrete" repeatCount="indefinite"/></g>
<path d="M264 284C 400 284 788 304 826 304" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40.0" y="384.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Address $8123 runs different code in bank 2 and bank 5. Name functions 02:8123 and 05:8123.</text>
</svg>
