<text x="200.0" y="208.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Each box is one frame on the display. Both rows cover the same span of time.</text>
<text x="40.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Record the frame rate in each test. The Game-Key Card and the Joy-Con 2 mouse are outside inputs.</text>
