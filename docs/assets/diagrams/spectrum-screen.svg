<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each 8 x 8 cell has one attribute byte. It sets one ink and one paper colour for all 64 pixels.</text>
