<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The Spectrum screen is a 256 by 192 bitmap whose lines are stored out of order, with one attribute byte for each 8 by 8 cell. A sprite that crosses a cell changes the colour of the whole cell.">
<title>The Spectrum screen is a 256 by 192 bitmap whose lines are stored out of order, with one attribute byte for each 8 by 8 cell. A sprite that crosses a cell changes the colour of the whole cell.</title>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
