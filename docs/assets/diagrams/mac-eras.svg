<text x="458.0" y="147.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">SheepShaver, QEMU</text>
<rect x="450.0" y="168.0" width="260.9" height="32.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.35"/>
<text x="458.0" y="182.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Intel</text>
<text x="458.0" y="195.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#e2ece9" text-anchor="start">Mach-O, universal binaries</text>
