<text x="450.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="middle">Rosetta (to 2011)</text>
<path d="M710.9 80.0L710.9 262.0" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
