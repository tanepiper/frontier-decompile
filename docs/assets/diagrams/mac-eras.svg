<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="The Mac used 68k CODE resources from 1984, PowerPC PEF from 1994, Intel Mach-O from 2006 and Apple silicon Mach-O from 2020. An emulator or translator bridged each change.">
<title>The Mac used 68k CODE resources from 1984, PowerPC PEF from 1994, Intel Mach-O from 2006 and Apple silicon Mach-O from 2020. An emulator or translator bridged each change.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">MAC ERAS AND CODE FORMATS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The Mac has used four CPU families, each with its own code format. At each change, a translator ran the old code for some years.</text>
<rect x="40.0" y="84.0" width="260.9" height="32.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.35"/>
<text x="48.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">68k</text>
<text x="48.0" y="111.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#e2ece9" text-anchor="start">CODE resources, A5 world</text>
<text x="308.9" y="105.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Mini vMac, MAME, Basilisk II</text>
<rect x="226.4" y="126.0" width="223.6" height="32.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.35"/>
<text x="234.4" y="140.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">PowerPC</text>
