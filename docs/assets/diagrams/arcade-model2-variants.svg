<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Every Sega Model 2 variant uses an i960KB. The geometry is done by MB86234 TGPs on Model 2 and 2A-CRX, two ADSP-21062 SHARCs on 2B-CRX and an MB86235 on 2C-CRX.">
<title>Every Sega Model 2 variant uses an i960KB. The geometry is done by MB86234 TGPs on Model 2 and 2A-CRX, two ADSP-21062 SHARCs on 2B-CRX and an MB86235 on 2C-CRX.</title>
