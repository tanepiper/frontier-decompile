<rect x="330.0" y="136.0" width="250.0" height="40.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="455.0" y="161.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">MB86234</text>
