<text x="24.0" y="302.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Video timing in MAME: 16 MHz pixel clock, 656 x 496 totals, 424 x 384 visible. The driver notes it may not be accurate.</text>
