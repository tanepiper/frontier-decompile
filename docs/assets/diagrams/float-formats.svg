<text x="28.2" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">s</text>
<rect x="34.5" y="96.0" width="155.5" height="28.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="112.2" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">exponent 15</text>
<rect x="192.0" y="96.0" width="8.5" height="28.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="196.2" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">i</text>
<rect x="202.5" y="96.0" width="659.5" height="28.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="532.2" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">fraction 63</text>
<text x="24.0" y="156.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">64-bit double (memory)</text>
<rect x="24.0" y="162.0" width="8.5" height="28.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.3"/>
<text x="28.2" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">s</text>
<rect x="34.5" y="162.0" width="113.5" height="28.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="91.2" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">exponent 11</text>
<rect x="150.0" y="162.0" width="544.0" height="28.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="422.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">fraction 52</text>
<text x="24.0" y="222.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">32-bit float (memory)</text>
<rect x="24.0" y="228.0" width="8.5" height="28.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.3"/>
<text x="28.2" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">s</text>
<rect x="34.5" y="228.0" width="82.0" height="28.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="75.5" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">exponent 8</text>
<rect x="118.5" y="228.0" width="239.5" height="28.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="238.2" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">fraction 23</text>
<text x="24.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">i: the integer bit, explicit only in the 80-bit format. FST and FSTP round to the size of the memory operand. The precision</text>
<text x="24.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">control word can make every operation round to 24 or 53 bits. Direct3D sets 24 bits unless the game asks it not to.</text>
</svg>
