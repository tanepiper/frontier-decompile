<text x="40.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">When Ghidra shows a computed jump with no cases, read the table's size from the bounds check and its entries as addresses.</text>
