<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="A RenderWare file is made of chunks. Each chunk has a 12-byte header of type, size and library version, so a reader can skip a chunk or step into it">
<title>A RenderWare file is made of chunks. Each chunk has a 12-byte header of type, size and library version, so a reader can skip a chunk or step into it</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE CHUNKS OF A RENDERWARE FILE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Every chunk starts with its type, its size and the library version. A reader moves from one header to the next.</text>
<text x="24.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">chunk header, 12 bytes</text>
<rect x="24.0" y="102.0" width="88.0" height="30.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="68.0" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">type</text>
<text x="68.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">4 bytes</text>
<rect x="116.0" y="102.0" width="88.0" height="30.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="160.0" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">size</text>
<text x="160.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">4 bytes</text>
<rect x="208.0" y="102.0" width="88.0" height="30.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="252.0" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">version</text>
<text x="252.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">4 bytes</text>
<text x="310.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">then size bytes of content, which may be more chunks</text>
<rect x="40.0" y="158.0" width="330.0" height="19.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.12"/>
<text x="48.0" y="172.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Clump</text>
<text x="360.0" y="172.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#f59e0b" text-anchor="end">0x10</text>
<rect x="74.0" y="180.0" width="296.0" height="19.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="82.0" y="194.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Struct</text>
<text x="360.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#f59e0b" text-anchor="end">0x01</text>
<rect x="74.0" y="202.0" width="296.0" height="19.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="82.0" y="216.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Frame List</text>
<text x="360.0" y="216.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#f59e0b" text-anchor="end">0x0E</text>
<rect x="74.0" y="224.0" width="296.0" height="19.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="82.0" y="238.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Geometry List</text>
<text x="360.0" y="238.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#f59e0b" text-anchor="end">0x1A</text>
<rect x="108.0" y="246.0" width="262.0" height="19.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.28"/>
<text x="116.0" y="260.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Geometry</text>
<text x="360.0" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#f59e0b" text-anchor="end">0x0F</text>
<rect x="108.0" y="268.0" width="262.0" height="19.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.28"/>
<text x="116.0" y="282.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Geometry</text>
<text x="360.0" y="282.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#f59e0b" text-anchor="end">0x0F</text>
<rect x="74.0" y="290.0" width="296.0" height="19.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="82.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Atomic</text>
<text x="360.0" y="304.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#f59e0b" text-anchor="end">0x14</text>
<rect x="74.0" y="312.0" width="296.0" height="19.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.2"/>
<text x="82.0" y="326.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Extension</text>
<text x="360.0" y="326.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#f59e0b" text-anchor="end">0x03</text>
<text x="40.0" y="352.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">a model (.dff), chunk by chunk, with the code of each chunk type</text>
<rect x="34" width="340" height="21" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"><animate attributeName="y" values="157;179;201;223;245;267;289;311" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
<text x="440.0" y="170.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">A reader can skip a chunk that it does not know</text>
<text x="440.0" y="188.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">by jumping ahead by its size.</text>
<text x="440.0" y="206.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start"></text>
<text x="440.0" y="224.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">The same chunk format holds PC and PlayStation 2</text>
<text x="440.0" y="242.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">data, with platform data inside. A PC reader</text>
<text x="440.0" y="260.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">helps with the console version.</text>
<text x="440.0" y="278.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start"></text>
<text x="440.0" y="296.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Models are .dff, texture dictionaries .txd,</text>
<text x="440.0" y="314.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">streams .rws.</text>
</svg>
