<text x="320.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="start">touch: 12 x 10 cells (amber lines)</text>
<text x="320.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A touch reports a cell, about 17 x 16 pixels. Record the touched cell in the input</text>
<text x="320.0" y="179.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">record each frame. The modem cartridge is another outside input.</text>
