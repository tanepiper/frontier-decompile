<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="The game writes two bytes and a shift amount to the MB14241 shifter. It reads back 8 bits taken at that offset, so a sprite byte is shifted into place without CPU shifts.">
