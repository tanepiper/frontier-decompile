<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="On the Amstrad CPC, wait states stretch every instruction to a multiple of 4 T-states, so time is counted in NOPs of 1 microsecond. A Z80 cycle table from another machine gives the wrong times.">
<title>On the Amstrad CPC, wait states stretch every instruction to a multiple of 4 T-states, so time is counted in NOPs of 1 microsecond. A Z80 cycle table from another machine gives the wrong times.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">CPC TIME COUNTED IN NOPS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The gate array stretches every instruction to a multiple of 4 T-states. One NOP = 4 T-states = 1 microsecond.</text>
<text x="24.0" y="90.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8fa9a5" text-anchor="start">instruction</text>
