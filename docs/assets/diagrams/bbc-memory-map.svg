<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The BBC Micro memory map has RAM below &amp;8000 and one of up to sixteen sideways ROMs at &amp;8000 to &amp;BFFF, chosen by ROMSEL at &amp;FE30. The MOS and the FRED, JIM and SHEILA I/O pages sit above.">
<title>The BBC Micro memory map has RAM below &amp;8000 and one of up to sixteen sideways ROMs at &amp;8000 to &amp;BFFF, chosen by ROMSEL at &amp;FE30. The MOS and the FRED, JIM and SHEILA I/O pages sit above.</title>
