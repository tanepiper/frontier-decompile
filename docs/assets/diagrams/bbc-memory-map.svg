<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">ROMSEL at &amp;FE30 picks which 16 KB ROM appears at &amp;8000. The four sockets can be expanded to sixteen.</text>
