<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="The PCjr and Tandy 1000 add 16-colour modes at 160 by 200 and 320 by 200 to CGA, and an SN76496 sound chip at port C0h. DOSBox runs them with machine set to tandy or pcjr.">
