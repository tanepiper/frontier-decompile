<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="The NEC PC-8801 and the Sharp X1 are Z80 machines with their own video and sound chips. The PC-8801's disk unit has a second Z80 that runs its own program.">
<title>The NEC PC-8801 and the Sharp X1 are Z80 machines with their own video and sound chips. The PC-8801's disk unit has a second Z80 that runs its own program.</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">PC-8801 AND SHARP X1</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">These were two of Japan's four major home computers. The other two were the FM-7 and the MSX.</text>
<rect x="24.0" y="80.0" width="416.0" height="196.0" rx="8" fill="#60a5fa" stroke="none" fill-opacity="0.12"/>
<text x="40.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="start">NEC PC-8801 (November 1981)</text>
<rect x="40.0" y="122.0" width="150.0" height="54.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="115.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Z80</text>
<text x="115.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">main CPU, N88-BASIC</text>
<rect x="270.0" y="122.0" width="150.0" height="54.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="345.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">disk unit</text>
<text x="345.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">its own Z80</text>
<path d="M194.0 149.0L266.0 149.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="40.0" y="204.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Sound: YM2203 from the mkII SR, later YM2608.</text>
<text x="40.0" y="228.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">The second Z80 runs its own code (not confirmed).</text>
<text x="40.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Treat it as a separate program.</text>
<rect x="460.0" y="80.0" width="416.0" height="196.0" rx="8" fill="#f59e0b" stroke="none" fill-opacity="0.12"/>
<text x="476.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="start">Sharp X1 (1982; X1 turbo 1984)</text>
<rect x="476.0" y="122.0" width="120.0" height="54.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="536.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Z80A</text>
<text x="536.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">4 MHz</text>
<rect x="606.0" y="122.0" width="120.0" height="54.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="666.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">HD46505</text>
<text x="666.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">CRTC</text>
<rect x="736.0" y="122.0" width="120.0" height="54.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="796.0" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">PCG</text>
<text x="796.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">programmable chars</text>
<text x="476.0" y="204.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Sound: AY-3-8910.</text>
<text x="476.0" y="228.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">These X1 facts are not confirmed. Check a second</text>
<text x="476.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">source before you model the timing.</text>
</svg>
