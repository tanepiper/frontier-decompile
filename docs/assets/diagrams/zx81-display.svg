<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="On the ZX81 the CPU generates the display. In SLOW mode the picture shows and the game runs in the border time. In FAST mode the screen goes blank and the game gets all the CPU time.">
<title>On the ZX81 the CPU generates the display. In SLOW mode the picture shows and the game runs in the border time. In FAST mode the screen goes blank and the game gets all the CPU time.</title>
<rect x="0.5" y="0.5" width="899" height="319" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE ZX81 CPU DRAWS THE PICTURE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The ZX81 has a Z80A at 3.25 MHz. The Ferranti ULA needs the CPU to feed it every visible line.</text>
<text x="40.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2dd4bf" text-anchor="start">SLOW mode</text>
<rect x="40.0" y="108.0" width="200.0" height="150.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<rect x="64.0" y="130.0" width="152.0" height="106.0" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.35"/>
<text x="140.0" y="188.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="middle">picture</text>
<rect x="64" y="130" width="152" height="3" fill="#f59e0b"><animate attributeName="y" values="130;233" dur="1.5s" repeatCount="indefinite"/></rect>
<text x="254.0" y="132.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">The picture shows.</text>
<text x="254.0" y="150.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">The CPU spends the visible lines</text>
<text x="254.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">drawing it. The game runs in the</text>
<text x="254.0" y="186.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">border and blanking time.</text>
<text x="470.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f59e0b" text-anchor="start">FAST mode</text>
<rect x="470.0" y="108.0" width="200.0" height="150.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<rect x="494.0" y="130.0" width="152.0" height="106.0" rx="2" fill="#000000" stroke="none"/>
<text x="570.0" y="188.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="middle">blank</text>
<text x="684.0" y="132.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">The screen blanks while the</text>
<text x="684.0" y="150.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">program runs.</text>
<text x="684.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">The game gets all the CPU time.</text>
<text x="684.0" y="186.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start"></text>
<text x="40.0" y="292.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Record the mode the game runs in. The CPU time left for the game logic depends on it.</text>
</svg>
