<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Later arcade boards add three problems. From the 1980s custom CPUs decrypt the program. From 1988 3D boards split the game across a CPU and DSPs. From 2004 the boards are x86 PCs with a keychip.">
<title>Later arcade boards add three problems. From the 1980s custom CPUs decrypt the program. From 1988 3D boards split the game across a CPU and DSPs. From 2004 the boards are x86 PCs with a keychip.</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE PROBLEMS THAT LATER BOARDS ADD</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each era of boards adds one problem before you can read the game's code.</text>
<text x="40.0" y="280.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">1972</text>
<text x="166.2" y="280.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">1980</text>
<text x="292.3" y="280.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">1988</text>
<text x="418.5" y="280.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">1996</text>
<text x="544.6" y="280.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">2004</text>
<text x="670.8" y="280.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">2012</text>
<text x="796.9" y="280.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">2020</text>
<rect x="166.2" y="206.0" width="693.8" height="12.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.6"/>
<rect x="40.0" y="84.0" width="260.0" height="100.0" rx="8" fill="#f87171" stroke="none" fill-opacity="0.15"/>
<text x="54.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">encrypted CPUs, from the 1980s</text>
<text x="54.0" y="134.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Battery-backed custom CPUs decrypt</text>
<text x="54.0" y="152.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">the program. Decrypt it first.</text>
<path d="M80.0 184.0L170.2 206.0" stroke="#f87171" stroke-width="1.2" fill="none"/>
<rect x="292.3" y="224.0" width="567.7" height="12.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.6"/>
<rect x="320.0" y="84.0" width="260.0" height="100.0" rx="8" fill="#c084fc" stroke="none" fill-opacity="0.15"/>
<text x="334.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">CPU + DSPs, from 1988</text>
<text x="334.0" y="134.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Each DSP runs its own program.</text>
<text x="334.0" y="152.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Ghidra lacks most DSP modules.</text>
<path d="M360.0 184.0L296.3 224.0" stroke="#c084fc" stroke-width="1.2" fill="none"/>
<rect x="544.6" y="242.0" width="315.4" height="12.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.6"/>
<rect x="600.0" y="84.0" width="260.0" height="100.0" rx="8" fill="#60a5fa" stroke="none" fill-opacity="0.15"/>
<text x="614.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">x86 PCs, from 2004</text>
<text x="614.0" y="134.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">The code is decrypted only on a</text>
<text x="614.0" y="152.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">running machine with its keychip.</text>
<path d="M640.0 184.0L548.6 242.0" stroke="#60a5fa" stroke-width="1.2" fill="none"/>
<rect x="40.0" y="206.0" width="122.2" height="12.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.4"/>
<text x="40.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">plain ROMs</text>
<text x="40.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Arcade refresh rates also differ, from about 54.71 Hz (Midway TMS34010 boards) to about 61.5 Hz (Asteroids).</text>
</svg>
