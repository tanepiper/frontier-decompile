<svg xmlns="http://www.w3.org/2000/svg" width="900" height="264" viewBox="0 0 900 264" role="img" aria-label="Where a game can be lost. The studio's source code and data, the discs that decay and the rights that nobody can establish are shown beside the copies players bought, which are often all that is left">
<title>Where a game can be lost. The studio's source code and data, the discs that decay and the rights that nobody can establish are shown beside the copies players bought, which are often all that is left</title>
<rect x="0.5" y="0.5" width="899" height="263" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">LOST SOURCE CODE AND MEDIA</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">When a studio loses its source code, the copies that players bought are often all that is left.</text>
<rect x="24.0" y="90.0" width="200.0" height="110.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.16"/>
<text x="38.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">The studio's source</text>
<text x="38.0" y="144.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">The final code of Silent Hill 2</text>
<text x="38.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">and 3 is gone.</text>
<rect x="240.0" y="90.0" width="200.0" height="110.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.16"/>
<text x="254.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">The discs</text>
<text x="254.0" y="144.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Recordable discs last from a few</text>
<text x="254.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">years to a century.</text>
<rect x="456.0" y="90.0" width="200.0" height="110.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.16"/>
<text x="470.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">The rights</text>
<text x="470.0" y="144.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">No One Lives Forever has no clear</text>
<text x="470.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">owner and was not sold in 2025.</text>
<rect x="672.0" y="90.0" width="200.0" height="110.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.16"/>
<text x="686.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Players' copies</text>
<text x="686.0" y="144.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">They are often all that is left.</text>
<text x="686.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">GameFrame works from them.</text>
<text x="24.0" y="240.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Disc lifetimes depend on the dye and the metal layer (Canadian Conservation Institute, CCI Notes 19/1).</text>
</svg>
