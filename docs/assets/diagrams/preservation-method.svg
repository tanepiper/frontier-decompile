<rect x="40" y="96" width="240" height="56" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.1667" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
