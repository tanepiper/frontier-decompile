<text x="24.0" y="312.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">MAME calls its code documentation of the machines. GameFrame applies the idea to one game.</text>
