<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="The Sharp X68000 has 1056 KB of VRAM split into graphics, text and sprite areas, and 128 sprites with 32 per line that raster interrupts can raise. Its floppies hold 77 tracks of 8 sectors of 1024 bytes.">
<title>The Sharp X68000 has 1056 KB of VRAM split into graphics, text and sprite areas, and 128 sprites with 32 per line that raster interrupts can raise. Its floppies hold 77 tracks of 8 sectors of 1024 bytes.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">SHARP X68000</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The X68000 is a 68000 machine with large VRAM, many sprites and FM sound. It was sold in Japan from 1987 to 1993.</text>
<text x="24.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">VRAM: 1056 KB</text>
<rect x="24.0" y="106.0" width="405.3" height="34.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.35"/>
<text x="227.6" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">graphics 512 KB</text>
<rect x="431.3" y="106.0" width="405.3" height="34.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.35"/>
<text x="634.9" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">text 512 KB</text>
<rect x="838.5" y="106.0" width="23.5" height="34.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.35"/>
<text x="851.3" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#e2ece9" text-anchor="middle"></text>
<text x="24.0" y="160.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">The thin amber bar at the right is the 32 KB sprite area.</text>
<text x="24.0" y="196.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">sprites: 128, with 32 on one line</text>
