<text x="450.0" y="219.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">raster interrupts reuse sprites lower down, up to 512</text>
<text x="24.0" y="262.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">CPU: HD68HC000 at 10 MHz; 16 MHz on the XVI; 68EC030 at 25 MHz on the X68030.</text>
<text x="24.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Sound: YM2151 (eight FM channels) and an MSM6258 ADPCM channel at 15.6 kHz.</text>
<text x="24.0" y="298.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Floppy: 77 tracks x 8 sectors x 1024 bytes x 2 sides = 1232 KiB, at 360 rpm. The OS is Human68k.</text>
<text x="24.0" y="340.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Record whether the game uses raster interrupts to show more than 128 sprites.</text>
</svg>
