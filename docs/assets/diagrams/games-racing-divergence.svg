<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="In racing physics, a tiny difference at the first tick grows quickly. The distance between the original's car and the port's car rises steeply over the ticks">
<title>In racing physics, a tiny difference at the first tick grows quickly. The distance between the original's car and the port's car rises steeply over the ticks</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">WHY RACING GAMES NEED CHECKS FROM THE FIRST TICK</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">A difference in the last bit of a value grows every tick. Compare from the first tick and stop at the first difference.</text>
<path d="M80.0 290.0L600.0 290.0" stroke="#8fa9a5" stroke-width="1" fill="none"/>
<path d="M80.0 90.0L80.0 290.0" stroke="#8fa9a5" stroke-width="1" fill="none"/>
<text x="600.0" y="308.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="end">ticks</text>
<text x="88.0" y="98.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">distance between the two cars</text>
<path d="M80.0 290.0L85.2 290.0L90.4 289.9L95.6 289.9L100.8 289.9L106.0 289.8L111.2 289.8L116.4 289.7L121.6 289.7L126.8 289.6L132.0 289.6L137.2 289.5L142.4 289.5L147.6 289.4L152.8 289.3L158.0 289.3L163.2 289.2L168.4 289.1L173.6 289.0L178.8 288.9L184.0 288.8L189.2 288.7L194.4 288.6L199.6 288.5L204.8 288.4L210.0 288.3L215.2 288.1L220.4 288.0L225.6 287.8L230.8 287.7L236.0 287.5L241.2 287.3L246.4 287.1L251.6 286.9L256.8 286.7L262.0 286.4L267.2 286.2L272.4 285.9L277.6 285.6L282.8 285.3L288.0 285.0L293.2 284.7L298.4 284.3L303.6 283.9L308.8 283.5L314.0 283.1L319.2 282.6L324.4 282.2L329.6 281.6L334.8 281.1L340.0 280.5L345.2 279.9L350.4 279.2L355.6 278.5L360.8 277.8L366.0 277.0L371.2 276.2L376.4 275.3L381.6 274.4L386.8 273.4L392.0 272.3L397.2 271.2L402.4 270.0L407.6 268.7L412.8 267.4L418.0 265.9L423.2 264.4L428.4 262.8L433.6 261.1L438.8 259.3L444.0 257.4L449.2 255.3L454.4 253.1L459.6 250.8L464.8 248.4L470.0 245.8L475.2 243.0L480.4 240.1L485.6 236.9L490.8 233.6L496.0 230.1L501.2 226.4L506.4 222.4L511.6 218.2L516.8 213.7L522.0 209.0L527.2 203.9L532.4 198.6L537.6 192.9L542.8 186.9L548.0 180.5L553.2 173.7L558.4 166.4L563.6 158.8L568.8 150.6L574.0 142.0L579.2 132.8L584.4 123.0L589.6 112.7L594.8 101.7L600.0 90.0" fill="none" stroke="#f87171" stroke-width="2.5"/>
<circle cx="84" cy="289" r="5" fill="#f59e0b"/>
<text x="94.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#f59e0b" text-anchor="start">tick 1, a difference in the last bit of one float</text>
<text x="530.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#f87171" text-anchor="end">a different line</text>
<text x="530.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#f87171" text-anchor="end">through the corner</text>
<text x="80.0" y="324.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">The shape is illustrative.</text>
<text x="640.0" y="100.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Causes to check first:</text>
<text x="640.0" y="118.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">- x87 versus SSE rounding</text>
<text x="640.0" y="136.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">- the order of integration</text>
<text x="640.0" y="154.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">- grip curves that were not read</text>
<text x="640.0" y="172.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">  from the tables</text>
<text x="640.0" y="190.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">- collision against track</text>
<text x="640.0" y="208.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">  segments in a different order</text>
<text x="640.0" y="226.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start"></text>
<text x="640.0" y="244.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Replays are recorded inputs</text>
<text x="640.0" y="262.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">plus the seed, so the physics</text>
<text x="640.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">must repeat exactly.</text>
</svg>
