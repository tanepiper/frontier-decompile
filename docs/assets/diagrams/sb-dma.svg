<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Sound Blaster auto-initialised DMA: the card plays one half of a buffer while the game fills the other, with an interrupt at the end of each half">
<title>Sound Blaster auto-initialised DMA: the card plays one half of a buffer while the game fills the other, with an interrupt at the end of each half</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">SOUND BLASTER DOUBLE BUFFERING WITH DMA</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The card reads one half while the game fills the other. An interrupt marks each half's end.</text>
<rect x="60.0" y="110.0" width="378.0" height="60.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.18"/>
<rect x="442.0" y="110.0" width="378.0" height="60.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="250.0" y="100.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">half A</text>
<text x="630.0" y="100.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">half B</text>
<rect x="60" y="106" width="3" height="68" fill="#f59e0b"><animate attributeName="x" values="60;820" dur="4s" repeatCount="indefinite"/></rect>
<text x="60.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="start">amber: the DMA controller reading samples to the card, at the sample rate</text>
<g opacity="0"><circle cx="438.0" cy="140" r="12" fill="#f87171"/><text x="440.0" y="240" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f87171" text-anchor="middle">IRQ: half A played. The game refills A while B plays</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.3;0.31;1" dur="4s" begin="2.0s" repeatCount="indefinite"/></g>
<g opacity="0"><circle cx="818" cy="140" r="12" fill="#f87171"/><text x="440.0" y="240" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f87171" text-anchor="middle">IRQ: half B played. The game refills B while A plays</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.3;0.31;1" dur="4s" begin="0.0s" repeatCount="indefinite"/></g>
<text x="60.0" y="288.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">The block size set on the card is half the buffer. Its length, and the sample rate, set the delay between a sound</text>
<text x="60.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">starting in the game and reaching the speaker. Record both. The port may mix sound in its own way if each sound starts at the same time as in the original.</text>
</svg>
