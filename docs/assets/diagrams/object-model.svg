<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="An object model of the running game with entry points: tests and agents query it, press things by name and advance time">
<title>An object model of the running game with entry points: tests and agents query it, press things by name and advance time</title>
<rect x="0.5" y="0.5" width="899" height="319" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">A MODEL TO QUERY</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Tests and agents ask the running game what it shows, and act on it by name.</text>
<rect x="330.0" y="110.0" width="240.0" height="120.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="450.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">the running game</text>
<text x="450.0" y="185.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">world, interface, clock</text>
<rect x="60.0" y="110.0" width="180.0" height="50.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="150.0" y="140.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">tests</text>
<rect x="60.0" y="180.0" width="180.0" height="50.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="150.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">agents</text>
<rect x="660.0" y="110.0" width="180.0" height="50.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="750.0" y="140.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">the probe</text>
<rect x="660.0" y="180.0" width="180.0" height="50.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="750.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">replays</text>
<text x="450.0" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#f59e0b" text-anchor="middle">query: "how many houses?"</text>
<text x="450.0" y="278.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4ade80" text-anchor="middle">press: "Build &gt; House"</text>
<text x="450.0" y="296.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#c084fc" text-anchor="middle">advance: 10 seconds</text>
