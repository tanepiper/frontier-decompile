<svg xmlns="http://www.w3.org/2000/svg" width="900" height="412" viewBox="0 0 900 412" role="img" aria-label="Donkey Kong has a Z80 and an 8035 sound CPU. Sega System 1 has Z80s and two SN76489A. Nintendo's VS. System and PlayChoice-10 are built from NES chips.">
<title>Donkey Kong has a Z80 and an 8035 sound CPU. Sega System 1 has Z80s and two SN76489A. Nintendo's VS. System and PlayChoice-10 are built from NES chips.</title>
<rect x="0.5" y="0.5" width="899" height="411" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">DONKEY KONG, SEGA SYSTEM 1, VS. SYSTEM</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Several of these boards carry a second CPU for sound. Each CPU is a program to trace.</text>
<text x="24.0" y="110.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Donkey Kong (1981)</text>
<rect x="190.0" y="84.0" width="150.0" height="50.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="265.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Z80</text>
<text x="265.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">4 MHz, game</text>
<rect x="348.0" y="84.0" width="150.0" height="50.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="423.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Intel 8035</text>
<text x="423.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">6 MHz, sound</text>
<text x="190.0" y="150.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">61.44 MHz crystal, 6.144 MHz pixel clock, about 60.61 Hz</text>
<text x="24.0" y="190.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Sega System 1</text>
<rect x="190.0" y="164.0" width="150.0" height="50.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="265.0" y="186.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Z80</text>
<text x="265.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">4 MHz, from 20 MHz</text>
<rect x="348.0" y="164.0" width="150.0" height="50.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="423.0" y="186.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">sound CPU</text>
<text x="423.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">20/8 or 20/16 MHz</text>
<rect x="506.0" y="164.0" width="150.0" height="50.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="581.0" y="186.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">2 x SN76489A</text>
<text x="581.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">by board revision</text>
<text x="190.0" y="230.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">about 60.10 Hz; encrypted Z80 parts and the MC8123</text>
<text x="24.0" y="270.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">VS. System</text>
<rect x="190.0" y="244.0" width="150.0" height="50.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="265.0" y="266.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">RP2A03</text>
<text x="265.0" y="282.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">NES CPU + sound</text>
<rect x="348.0" y="244.0" width="150.0" height="50.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="423.0" y="266.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">2C0x PPU</text>
<text x="423.0" y="282.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">341 dots a line</text>
<text x="190.0" y="310.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">NTSC line count; dual-screen games have two CPUs</text>
<text x="24.0" y="350.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">PlayChoice-10</text>
<rect x="190.0" y="324.0" width="150.0" height="50.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="265.0" y="346.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Z80</text>
<text x="265.0" y="362.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">4 MHz, the menu</text>
<rect x="348.0" y="324.0" width="150.0" height="50.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="423.0" y="346.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">NES hardware</text>
<text x="423.0" y="362.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">the game</text>
<text x="190.0" y="390.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">nominal 60 Hz in MAME. Treat the rate as unknown.</text>
</svg>
