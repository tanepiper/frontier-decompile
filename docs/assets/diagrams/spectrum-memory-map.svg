<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="The ZX Spectrum memory map holds ROM, the screen bitmap and the attributes. On 128K models port 0x7FFD pages one of eight 16 KB RAM pages into 0xC000.">
<title>The ZX Spectrum memory map holds ROM, the screen bitmap and the attributes. On 128K models port 0x7FFD pages one of eight 16 KB RAM pages into 0xC000.</title>
<rect x="0.5" y="0.5" width="899" height="439" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">SPECTRUM MEMORY AND PAGING</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">This is the 48K memory map. On the 128K, any of eight 16 KB pages can appear in the top quarter.</text>
<rect x="110.0" y="84.0" width="230.0" height="62.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="120.0" y="119.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">ROM (16 KB)</text>
<text x="102.0" y="94.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">0x0000</text>
<rect x="110.0" y="148.0" width="230.0" height="42.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="120.0" y="173.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">screen bitmap, 6144 bytes</text>
<text x="102.0" y="158.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">0x4000</text>
<rect x="110.0" y="192.0" width="230.0" height="20.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="120.0" y="206.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">attributes, 768 bytes</text>
<text x="102.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">0x5800</text>
<rect x="110.0" y="214.0" width="230.0" height="26.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="120.0" y="231.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">RAM (contended to 0x7FFF)</text>
<text x="102.0" y="224.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">0x5B00</text>
<rect x="110.0" y="242.0" width="230.0" height="62.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="120.0" y="277.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">RAM</text>
<text x="102.0" y="252.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">0x8000</text>
<rect x="110.0" y="306.0" width="230.0" height="62.0" rx="3" fill="#4ade80" stroke="none" fill-opacity="0.25"/>
<text x="120.0" y="341.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">RAM, or a 128K page</text>
<text x="102.0" y="316.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">0xC000</text>
<text x="110.0" y="390.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#f87171" text-anchor="start">0x4000 to 0x7FFF is contended memory on the 48K.</text>
<text x="440.0" y="100.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">port 0x7FFD on the 128K, +2, +2A and +3</text>
<rect x="440.0" y="112.0" width="106.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="493.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">-</text>
<rect x="548.0" y="112.0" width="52.0" height="30.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.3"/>
<text x="574.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e2ece9" text-anchor="middle">lock</text>
<rect x="602.0" y="112.0" width="52.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="628.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e2ece9" text-anchor="middle">ROM</text>
<rect x="656.0" y="112.0" width="52.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="682.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e2ece9" text-anchor="middle">screen</text>
<rect x="710.0" y="112.0" width="160.0" height="30.0" rx="3" fill="#4ade80" stroke="none" fill-opacity="0.3"/>
<text x="790.0" y="131.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">RAM page at 0xC000</text>
<text x="440.0" y="158.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="start">bit 7</text>
<text x="872.0" y="158.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="end">bit 0</text>
<text x="656.0" y="158.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">screen: bit 3 picks page 5 or page 7 for display</text>
<text x="440.0" y="196.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">pages 0 to 7 (128K and +2 contention shown)</text>
<rect x="440.0" y="206.0" width="46.0" height="40.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="463.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">0</text>
<rect x="440" y="206" width="46" height="40" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.000;0.125;1" calcMode="discrete" dur="8.0s" repeatCount="indefinite"/></rect>
<rect x="494.0" y="206.0" width="46.0" height="40.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="517.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">1</text>
<rect x="494" y="206" width="46" height="40" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.125;0.250;1" calcMode="discrete" dur="8.0s" repeatCount="indefinite"/></rect>
<rect x="548.0" y="206.0" width="46.0" height="40.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="571.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">2</text>
<rect x="548" y="206" width="46" height="40" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.250;0.375;1" calcMode="discrete" dur="8.0s" repeatCount="indefinite"/></rect>
<rect x="602.0" y="206.0" width="46.0" height="40.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="625.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">3</text>
<rect x="602" y="206" width="46" height="40" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.375;0.500;1" calcMode="discrete" dur="8.0s" repeatCount="indefinite"/></rect>
<rect x="656.0" y="206.0" width="46.0" height="40.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="679.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">4</text>
<rect x="656" y="206" width="46" height="40" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.500;0.625;1" calcMode="discrete" dur="8.0s" repeatCount="indefinite"/></rect>
<rect x="710.0" y="206.0" width="46.0" height="40.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="733.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">5</text>
<rect x="710" y="206" width="46" height="40" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.625;0.750;1" calcMode="discrete" dur="8.0s" repeatCount="indefinite"/></rect>
<rect x="764.0" y="206.0" width="46.0" height="40.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="787.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">6</text>
<rect x="764" y="206" width="46" height="40" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.750;0.875;1" calcMode="discrete" dur="8.0s" repeatCount="indefinite"/></rect>
<rect x="818.0" y="206.0" width="46.0" height="40.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="841.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">7</text>
<rect x="818" y="206" width="46" height="40" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.875;1.000;1" calcMode="discrete" dur="8.0s" repeatCount="indefinite"/></rect>
<text x="440.0" y="270.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">page 5 is always at 0x4000 and page 2 at 0x8000</text>
<text x="440.0" y="288.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">page 7 holds the shadow screen</text>
<rect x="440.0" y="304.0" width="12.0" height="12.0" rx="2" fill="#f87171" stroke="none" fill-opacity="0.5"/>
<text x="458.0" y="314.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">contended: pages 1, 3, 5, 7 (128K, +2); 4 to 7 (+2A, +3)</text>
<text x="440.0" y="350.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">The +2A and +3 add port 0x1FFD for all-RAM modes.</text>
<text x="440.0" y="368.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Record both ports for every code region</text>
<text x="440.0" y="386.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">that runs from a paged bank.</text>
</svg>
