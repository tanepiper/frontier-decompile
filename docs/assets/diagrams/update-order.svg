<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="One pass of an update loop over five slots: an object added during the pass is updated or not, depending on where the loop reads the count">
<title>One pass of an update loop over five slots: an object added during the pass is updated or not, depending on where the loop reads the count</title>
