<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432" role="img" aria-label="The Apple II memory map holds zero page, the stack, the text and hi-res screen pages, the soft switches at $C000 to $C0FF and the language card RAM that can replace the ROM at $D000 to $FFFF.">
<title>The Apple II memory map holds zero page, the stack, the text and hi-res screen pages, the soft switches at $C000 to $C0FF and the language card RAM that can replace the ROM at $D000 to $FFFF.</title>
<rect x="0.5" y="0.5" width="899" height="431" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">APPLE II MEMORY AND SOFT SWITCHES</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Reading or writing an address in $C000-$C0FF flips a switch. The language card banks RAM over the ROM.</text>
<rect x="110.0" y="84.0" width="230.0" height="14.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="120.0" y="95.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#e2ece9" text-anchor="start">zero page</text>
<text x="102.0" y="94.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$0000</text>
<rect x="110.0" y="100.0" width="230.0" height="14.0" rx="3" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="120.0" y="111.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#e2ece9" text-anchor="start">stack</text>
<text x="102.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$0100</text>
<rect x="110.0" y="116.0" width="230.0" height="16.0" rx="3" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
