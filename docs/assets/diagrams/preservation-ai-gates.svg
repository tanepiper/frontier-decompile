<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="The checks GameFrame puts on an agent's work. The original is required, results are measured, the port must match, every claim is cited, a person reviews each commit, and nothing from the game is shared">
<title>The checks GameFrame puts on an agent's work. The original is required, results are measured, the port must match, every claim is cited, a person reviews each commit, and nothing from the game is shared</title>
<rect x="0.5" y="0.5" width="899" height="249" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">WHAT GAMEFRAME ASKS OF AN AGENT</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each piece of work must pass every check before it is committed.</text>
<rect x="24.0" y="100.0" width="132.0" height="56.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="24" y="100" width="132" height="56" rx="4" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0.35;0" keyTimes="0;0.0714;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="90.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">the original</text>
<text x="90.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">is required</text>
<rect x="169.0" y="100.0" width="132.0" height="56.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="169" y="100" width="132" height="56" rx="4" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0.35;0" keyTimes="0;0.2143;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="235.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">results</text>
<text x="235.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">are measured</text>
<rect x="314.0" y="100.0" width="132.0" height="56.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="314" y="100" width="132" height="56" rx="4" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0.35;0" keyTimes="0;0.3571;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="380.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">the port</text>
<text x="380.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">must match</text>
<rect x="459.0" y="100.0" width="132.0" height="56.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="459" y="100" width="132" height="56" rx="4" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0.35;0" keyTimes="0;0.5000;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="525.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">every claim</text>
<text x="525.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">is cited</text>
<rect x="604.0" y="100.0" width="132.0" height="56.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="604" y="100" width="132" height="56" rx="4" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0.35;0" keyTimes="0;0.6429;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="670.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">a person</text>
<text x="670.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">reviews it</text>
<rect x="749.0" y="100.0" width="132.0" height="56.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="749" y="100" width="132" height="56" rx="4" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0.35;0" keyTimes="0;0.7857;0.9700" dur="7.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="815.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">nothing</text>
<text x="815.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">is shared</text>
<circle cy="128" r="9" fill="#f59e0b"><animate attributeName="cx" values="10;894" dur="7.0s" repeatCount="indefinite"/></circle>
<text x="24.0" y="196.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">This takes longer than making an imitation. Anyone with the same copy of the game can run the</text>
<text x="24.0" y="216.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">same tests and get the same answers.</text>
</svg>
