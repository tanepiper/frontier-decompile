<text x="200.0" y="246.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">00d9...5b13</text>
<g opacity="0"><rect x="420" y="224" width="160" height="32" rx="4" fill="#4ade80" fill-opacity="0.3"/><text x="500" y="245" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">same</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.500;1" dur="5s" repeatCount="indefinite"/></g>
<text x="40.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">fixity.py writes a BagIt bag with a manifest of SHA-256 sums, and checks it again later.</text>
