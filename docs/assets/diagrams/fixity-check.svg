<text x="40.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#e2ece9" text-anchor="start">MUSIC.PAK</text>
<text x="200.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">19c4...ee70</text>
<g opacity="0"><rect x="420" y="180" width="160" height="32" rx="4" fill="#f87171" fill-opacity="0.3"/><text x="500" y="201" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">CHANGED</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.500;1" dur="5s" repeatCount="indefinite"/></g>
