<rect x="224.0" y="88.0" width="187.0" height="36.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="317.5" y="109.7" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#e2ece9" text-anchor="middle">16, primary volume descriptor</text>
<rect x="414.0" y="88.0" width="137.0" height="36.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="482.5" y="109.7" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#e2ece9" text-anchor="middle">17, Joliet and terminator</text>
<rect x="554.0" y="88.0" width="87.0" height="36.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
