<rect x="644.0" y="88.0" width="87.0" height="36.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="687.5" y="109.7" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#e2ece9" text-anchor="middle">directories</text>
<rect x="734.0" y="88.0" width="139.0" height="36.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
