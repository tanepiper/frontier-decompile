<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="ISO 9660 on a data track. Sectors 0 to 15 are the system area. Sector 16 holds the primary volume descriptor with names and four dates. The path tables, the directories and the files follow">
<title>ISO 9660 on a data track. Sectors 0 to 15 are the system area. Sector 16 holds the primary volume descriptor with names and four dates. The path tables, the directories and the files follow</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">WHERE ISO 9660 KEEPS ITS STRUCTURES</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Sector numbers count 2048-byte sectors from the start of the data track.</text>
