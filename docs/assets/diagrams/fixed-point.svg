<text x="40.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The value 0x00034000 is 3.25. Multiplying two of them needs 64 bits before the shift back (imul, then shrd 16).</text>
