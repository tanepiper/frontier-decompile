<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="In lockstep multiplayer, each command is tagged with the tick at which it takes effect and is sent to every player. Every machine runs the same commands at the same tick">
