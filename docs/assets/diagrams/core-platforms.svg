<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="The exact core in the middle, with no drawing, sound or windows, wrapped by replaceable platform layers: desktop, browser, headless tests and a server">
<title>The exact core in the middle, with no drawing, sound or windows, wrapped by replaceable platform layers: desktop, browser, headless tests and a server</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE CORE AND ITS PLATFORMS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The core decides what happens. Each platform gives it time, input and files.</text>
<rect x="330.0" y="130.0" width="240.0" height="90.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.32"/>
<text x="450.0" y="173.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">the core</text>
<text x="450.0" y="190.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">rules, data, clock, random</text>
<rect x="40.0" y="90.0" width="200.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="140.0" y="118.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">desktop</text>
<text x="140.0" y="135.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">window, GPU, sound</text>
<path d="M242.0 120.0L326.0 175.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="40.0" y="200.0" width="200.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="140.0" y="228.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">browser</text>
<text x="140.0" y="245.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">WebAssembly, canvas</text>
<path d="M242.0 230.0L326.0 175.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="660.0" y="90.0" width="200.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="760.0" y="118.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">headless tests</text>
<text x="760.0" y="135.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">scripted, no window</text>
<path d="M658.0 120.0L574.0 175.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="660.0" y="200.0" width="200.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="760.0" y="228.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">server</text>
<text x="760.0" y="245.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">rooms, replays</text>
<path d="M658.0 230.0L574.0 175.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="450.0" y="250.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="middle">in: inputs, time, file bytes</text>
<text x="450.0" y="268.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#f59e0b" text-anchor="middle">out: state, draw lists, sound events</text>
<text x="40.0" y="310.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A test fails if the core starts to depend on a drawing, window, sound or network library.</text>
</svg>
