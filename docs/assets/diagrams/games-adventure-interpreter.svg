<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="An adventure game interpreter reads the next opcode from a script, looks it up in a dispatch table and runs one handler that changes variables, flags and objects">
<title>An adventure game interpreter reads the next opcode from a script, looks it up in a dispatch table and runs one handler that changes variables, flags and objects</title>
<rect x="0.5" y="0.5" width="899" height="339" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE OPCODE LOOP OF AN ADVENTURE GAME</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The executable reads the scripts one opcode at a time and runs a handler for each opcode.</text>
<text x="40.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">a script, as bytes (illustrative)</text>
<rect x="40.0" y="102.0" width="32.0" height="28.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.4"/>
<rect x="74.0" y="102.0" width="32.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<rect x="108.0" y="102.0" width="32.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<text x="56.0" y="121.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">A</text>
<rect x="150.0" y="102.0" width="32.0" height="28.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.4"/>
<rect x="184.0" y="102.0" width="32.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<text x="166.0" y="121.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">B</text>
<rect x="226.0" y="102.0" width="32.0" height="28.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.4"/>
<rect x="260.0" y="102.0" width="32.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<rect x="294.0" y="102.0" width="32.0" height="28.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.2"/>
<text x="242.0" y="121.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">C</text>
<rect x="336.0" y="102.0" width="32.0" height="28.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.4"/>
<text x="352.0" y="121.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">D</text>
<rect y="98" width="36" height="36" rx="4" fill="none" stroke="#2dd4bf" stroke-width="2.5"><animate attributeName="x" values="38;148;224;334" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="6.0s" repeatCount="indefinite"/></rect>
<rect x="40.0" y="170.0" width="180.0" height="60.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.22"/>
<text x="130.0" y="197.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">fetch the opcode</text>
<text x="130.0" y="213.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">and its operands</text>
<path d="M222.0 200.0L262.0 200.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="266.0" y="160.0" width="220.0" height="120.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.15"/>
<text x="278.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">dispatch table</text>
<text x="278.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">A  -&gt;  handler_a</text>
<rect x="272" y="189" width="208" height="18" rx="3" fill="#f59e0b" opacity="1" fill-opacity="0.25"><animate attributeName="opacity" values="1;0" keyTimes="0;0.2500" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="278.0" y="222.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">B  -&gt;  handler_b</text>
<rect x="272" y="209" width="208" height="18" rx="3" fill="#f59e0b" opacity="0" fill-opacity="0.25"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2500;0.5000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="278.0" y="242.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">C  -&gt;  handler_c</text>
<rect x="272" y="229" width="208" height="18" rx="3" fill="#f59e0b" opacity="0" fill-opacity="0.25"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5000;0.7500" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="278.0" y="262.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#e2ece9" text-anchor="start">D  -&gt;  handler_d</text>
<rect x="272" y="249" width="208" height="18" rx="3" fill="#f59e0b" opacity="0" fill-opacity="0.25"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7500;1.0000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<path d="M488.0 220.0L528.0 220.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="532.0" y="170.0" width="344.0" height="100.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.15"/>
<text x="546.0" y="192.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">state the handlers change</text>
<text x="546.0" y="214.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">variables and flags</text>
<text x="546.0" y="232.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">objects, where they are and who holds them</text>
<text x="546.0" y="250.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">rooms, actors, the cursor</text>
<text x="40.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Find the dispatch table first. Check that your decoder consumes every byte of every script file.</text>
</svg>
