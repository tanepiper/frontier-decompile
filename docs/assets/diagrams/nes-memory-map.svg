<text x="108.0" y="232.6" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">cartridge RAM (battery saves)</text>
<rect x="98.0" y="250.6" width="320.0" height="108.5" rx="3" fill="#60a5fa" stroke="#60a5fa" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="262.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$8000</text>
<text x="108.0" y="266.6" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">cartridge ROM (banked by the mapper)</text>
<text x="92.0" y="371.1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$FFFF</text>
<text x="460.0" y="100.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Named registers</text>
