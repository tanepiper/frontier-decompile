<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="The NES CPU memory map with its named registers and vectors">
<title>The NES CPU memory map with its named registers and vectors</title>
<rect x="0.5" y="0.5" width="899" height="419" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE NES MEMORY MAP</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Give Ghidra each region and name the registers. The code then shows PPUCTRL in place of 0x2000.</text>
<rect x="98.0" y="84.0" width="320.0" height="38.8" rx="3" fill="#4ade80" stroke="#4ade80" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="96.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$0000</text>
<text x="108.0" y="100.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">RAM, 2 KB (mirrored to $1FFF)</text>
<rect x="98.0" y="124.8" width="320.0" height="38.8" rx="3" fill="#c084fc" stroke="#c084fc" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="136.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$2000</text>
<text x="108.0" y="140.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">PPU registers (mirrored to $3FFF)</text>
<rect x="98.0" y="165.6" width="320.0" height="23.5" rx="3" fill="#f59e0b" stroke="#f59e0b" fill-opacity="0.2" stroke-opacity="0.5"/>
<text x="92.0" y="177.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">$4000</text>
<text x="108.0" y="181.6" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">APU and I/O registers</text>
<rect x="98.0" y="191.1" width="320.0" height="23.5" rx="3" fill="#64748b" stroke="#64748b" fill-opacity="0.2" stroke-opacity="0.5"/>
