<text x="40.0" y="404.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Most console communities publish register lists. Load them as labels before analysis.</text>
