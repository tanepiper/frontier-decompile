<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Which part of a game each group keeps. Museums and archives keep hardware, media and papers. Emulators keep the machine. Matching decompilations keep source code. Reimplementations keep the game running from its data">
<title>Which part of a game each group keeps. Museums and archives keep hardware, media and papers. Emulators keep the machine. Matching decompilations keep source code. Reimplementations keep the game running from its data</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">OTHER PRESERVATION WORK</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Different groups keep different parts of a game. GameFrame works in the same way as the reimplementations in the last row.</text>
<text x="325.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">hardware, boxes, papers</text>
<text x="447.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">the machine</text>
<text x="569.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">the original program runs</text>
<text x="691.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">source code</text>
<text x="813.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">runs on current systems</text>
<rect x="24.0" y="108.0" width="852.0" height="34.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.08"/>
<text x="40.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Museums and archives</text>
<circle cx="325" cy="125" r="7" fill="#2dd4bf"/>
<circle cx="691" cy="125" r="6" fill="none" stroke="#2dd4bf" stroke-width="2"/>
<rect x="24.0" y="148.0" width="852.0" height="34.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.08"/>
<text x="40.0" y="170.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Emulators</text>
<circle cx="447" cy="165" r="7" fill="#2dd4bf"/>
<circle cx="569" cy="165" r="7" fill="#2dd4bf"/>
<circle cx="813" cy="165" r="7" fill="#2dd4bf"/>
<rect x="24.0" y="188.0" width="852.0" height="34.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.08"/>
<text x="40.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Matching decompilations</text>
<circle cx="691" cy="205" r="7" fill="#2dd4bf"/>
<rect x="24.0" y="228.0" width="852.0" height="34.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.14"/>
<text x="40.0" y="250.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">Reimplementations</text>
<circle cx="813" cy="245" r="7" fill="#2dd4bf"/>
<circle cx="30" cy="284" r="6" fill="none" stroke="#2dd4bf" stroke-width="2"/>
<text x="42.0" y="288.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">sometimes</text>
<text x="140.0" y="288.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Examples are The Strong and the VGHF, MAME, DOSBox and Dolphin, Super Mario 64, and ScummVM, OpenRCT2 and DevilutionX.</text>
</svg>
