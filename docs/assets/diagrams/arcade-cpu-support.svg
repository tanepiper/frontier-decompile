<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="Ghidra has most of the classic arcade CPUs built in and the TMS34010, SHARC and i960 by extension. It has nothing for the V60 or the DSPs. Unicorn has no 8-bit CPUs, no SH-2 and no TMS34010.">
<title>Ghidra has most of the classic arcade CPUs built in and the TMS34010, SHARC and i960 by extension. It has nothing for the V60 or the DSPs. Unicorn has no 8-bit CPUs, no SH-2 and no TMS34010.</title>
