<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Each PC compiler leaves fingerprints, such as Turbo Pascal's runtime error 200 and 6-byte Real, Borland C++'s c0 startup and TDInfo, Watcom's DOS/4GW banner, DJGPP's go32 stub, MSVC's Rich header and Delphi's VCL names.">
<title>Each PC compiler leaves fingerprints, such as Turbo Pascal's runtime error 200 and 6-byte Real, Borland C++'s c0 startup and TDInfo, Watcom's DOS/4GW banner, DJGPP's go32 stub, MSVC's Rich header and Delphi's VCL names.</title>
<rect x="0.5" y="0.5" width="899" height="379" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">COMPILER FINGERPRINTS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Once you know the compiler, you know which library code to skip and which arithmetic to copy.</text>
<rect x="24.0" y="84.0" width="160.0" height="34.0" rx="4" fill="#f87171" stroke="none" fill-opacity="0.3"/>
<text x="104.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Turbo Pascal</text>
<text x="200.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Runtime error 200 on fast CPUs; 6-byte Real numbers</text>
<rect x="24.0" y="126.0" width="160.0" height="34.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="104.0" y="148.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Borland C++</text>
<text x="200.0" y="148.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">copyright string, c0.asm startup code, sometimes TDInfo debug data</text>
<rect x="24.0" y="168.0" width="160.0" height="34.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="104.0" y="190.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Watcom</text>
<text x="200.0" y="190.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">DOS/4GW start-up banner; arguments in EAX, EDX, EBX, ECX</text>
<rect x="24.0" y="210.0" width="160.0" height="34.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="104.0" y="232.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">DJGPP</text>
<text x="200.0" y="232.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">COFF behind a go32 stub</text>
<rect x="24.0" y="252.0" width="160.0" height="34.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="104.0" y="274.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">MSVC</text>
<text x="200.0" y="274.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">the undocumented "Rich" header; MSVCRT.DLL or VCRUNTIME140.DLL</text>
<rect x="24.0" y="294.0" width="160.0" height="34.0" rx="4" fill="#4ade80" stroke="none" fill-opacity="0.3"/>
<text x="104.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Delphi</text>
<text x="200.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">VCL class names, RTTI and DFM form resources</text>
<text x="24.0" y="352.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Doom was built with Watcom. Quake was built with DJGPP. These fingerprints are marked not confirmed on the page.</text>
</svg>
