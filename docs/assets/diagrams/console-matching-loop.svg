<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The matching loop of writing C, compiling, comparing and editing until one function matches">
<title>The matching loop of writing C, compiling, comparing and editing until one function matches</title>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE MATCHING DECOMPILATION LOOP</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">After every change, the build must give the identical program.</text>
<rect x="30.0" y="90.0" width="170.0" height="60.0" rx="5" fill="#64748b" stroke="#64748b" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="115.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">1. Compiler</text>
<text x="115.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">exact version</text>
<text x="115.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">and settings</text>
<path d="M202.0 120.0L240.0 120.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="244.0" y="90.0" width="170.0" height="60.0" rx="5" fill="#60a5fa" stroke="#60a5fa" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="329.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">2. Split</text>
<text x="329.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">splat, decomp-toolkit:</text>
<text x="329.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">code, data, assets</text>
<path d="M416.0 120.0L454.0 120.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<ellipse cx="630" cy="190" rx="160" ry="92" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle r="5" fill="#f59e0b"><animateMotion path="M630 98A160 92 0 1 1 629.9 98" dur="4s" begin="-0.0s" repeatCount="indefinite"/></circle>
<rect x="555.0" y="74.0" width="150.0" height="48.0" rx="5" fill="#0d1b1e" stroke="none"/>
<rect x="555.0" y="74.0" width="150.0" height="48.0" rx="5" fill="#c084fc" stroke="#c084fc" fill-opacity="0.35" stroke-opacity="0.65"/>
<text x="630.0" y="93.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">Write C</text>
<text x="630.0" y="110.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">m2c draft, decomp.me</text>
<rect x="715.0" y="166.0" width="150.0" height="48.0" rx="5" fill="#0d1b1e" stroke="none"/>
<rect x="715.0" y="166.0" width="150.0" height="48.0" rx="5" fill="#f59e0b" stroke="#f59e0b" fill-opacity="0.35" stroke-opacity="0.65"/>
<text x="790.0" y="185.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">Compile</text>
<text x="790.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">original compiler</text>
<rect x="555.0" y="258.0" width="150.0" height="48.0" rx="5" fill="#0d1b1e" stroke="none"/>
<rect x="555.0" y="258.0" width="150.0" height="48.0" rx="5" fill="#2dd4bf" stroke="#2dd4bf" fill-opacity="0.35" stroke-opacity="0.65"/>
<text x="630.0" y="277.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">Compare</text>
<text x="630.0" y="294.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">asm-differ, objdiff</text>
<rect x="395.0" y="166.0" width="150.0" height="48.0" rx="5" fill="#0d1b1e" stroke="none"/>
<rect x="395.0" y="166.0" width="150.0" height="48.0" rx="5" fill="#c084fc" stroke="#c084fc" fill-opacity="0.35" stroke-opacity="0.65"/>
<text x="470.0" y="185.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">Edit</text>
<text x="470.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">order, types, temps</text>
<text x="630.0" y="194.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="middle">3. one function</text>
<path d="M670.0 308.0L670.0 330.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="570.0" y="332.0" width="260.0" height="34.0" rx="5" fill="#4ade80" stroke="#4ade80" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="700.0" y="353.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">4. On a match, C replaces the assembly</text>
<text x="30.0" y="190.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The build still gives the identical program, which</text>
<text x="30.0" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">proves the match. Step 5 names the variables,</text>
<text x="30.0" y="224.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">structures and functions.</text>
<text x="30.0" y="270.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Old compilers are sensitive to statement order,</text>
<text x="30.0" y="287.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">temporary types and register use. Some functions take</text>
<text x="30.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">days.</text>
</svg>
