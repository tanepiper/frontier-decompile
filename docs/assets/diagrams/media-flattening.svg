<text x="430.0" y="228.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">state = 4</text>
<path d="M316.0 261.0L328.0 261.0" stroke="#8fa9a5" stroke-width="1.2" fill="none"/>
