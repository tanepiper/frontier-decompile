<rect x="30.0" y="176.0" width="60.0" height="28.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="60.0" y="194.2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">B</text>
