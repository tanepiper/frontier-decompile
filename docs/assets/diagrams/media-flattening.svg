<text x="375.0" y="188.7" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#e2ece9" text-anchor="middle">case 1: A</text>
<text x="430.0" y="190.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="start">state = x ? 2 : 3</text>
<rect x="327" y="167" width="96" height="36" rx="5" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<path d="M316.0 223.0L328.0 223.0" stroke="#8fa9a5" stroke-width="1.2" fill="none"/>
