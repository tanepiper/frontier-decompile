<text x="160.0" y="194.2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">C</text>
<rect x="80.0" y="246.0" width="60.0" height="28.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="110.0" y="264.2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">D</text>
<text x="320.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2ece9" text-anchor="start">flattened</text>
<rect x="320.0" y="104.0" width="220.0" height="40.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
<text x="430.0" y="128.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#e2ece9" text-anchor="middle">loop: switch (state)</text>
<path d="M316.0 144.0L316.0 299.0" stroke="#8fa9a5" stroke-width="1.2" fill="none"/>
<path d="M330.0 124.0L316.0 124.0" stroke="#8fa9a5" stroke-width="1.2" fill="none"/>
