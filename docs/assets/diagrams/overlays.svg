<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Overlays: code segments that share one area of memory; the overlay manager loads each from the file when it is called">
<title>Overlays: code segments that share one area of memory; the overlay manager loads each from the file when it is called</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">OVERLAYS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Parts of the program take turns in one area of memory. The overlay manager loads each when called.</text>
<rect x="40.0" y="100.0" width="180.0" height="120.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="130.0" y="158.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">resident code</text>
<text x="130.0" y="175.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">always in memory</text>
<rect x="260.0" y="100.0" width="220.0" height="120.0" rx="6" fill="#60a5fa" stroke="#60a5fa" fill-opacity="0.12" stroke-dasharray="4 4"/>
<text x="370.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">overlay area</text>
<rect x="560.0" y="92.0" width="300.0" height="38.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="570.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">overlay 1: menus  (in the .EXE or .OVL file)</text>
<g opacity="1"><rect x="266" y="106" width="208" height="108" rx="5" fill="#2dd4bf" fill-opacity="0.45"/><text x="370" y="165" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">overlay 1: menus</text><path d="M558 111C 520 111 520 160 478 160" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.333;0.333;1" dur="6s" repeatCount="indefinite"/></g>
<rect x="560.0" y="138.0" width="300.0" height="38.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="570.0" y="162.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">overlay 2: battle  (in the .EXE or .OVL file)</text>
<g opacity="0"><rect x="266" y="106" width="208" height="108" rx="5" fill="#f59e0b" fill-opacity="0.45"/><text x="370" y="165" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">overlay 2: battle</text><path d="M558 157C 520 157 520 160 478 160" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.333;0.667;0.667;1" dur="6s" repeatCount="indefinite"/></g>
<rect x="560.0" y="184.0" width="300.0" height="38.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="570.0" y="208.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">overlay 3: map editor  (in the .EXE or .OVL file)</text>
<g opacity="0"><rect x="266" y="106" width="208" height="108" rx="5" fill="#c084fc" fill-opacity="0.45"/><text x="370" y="165" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">overlay 3: map editor</text><path d="M558 203C 520 203 520 160 478 160" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.667;0.667;1" dur="6s" repeatCount="indefinite"/></g>
<text x="40.0" y="266.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Ghidra needs each overlay loaded at the address it runs from. DOS.md shows how.</text>
</svg>
