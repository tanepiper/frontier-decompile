<text x="550.0" y="123.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">target/, derived/, saves</text>
<path d="M392.0 150.0L446.0 108.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="450.0" y="150.0" width="200.0" height="56.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
