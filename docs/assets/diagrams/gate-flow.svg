<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="How an agent's command is checked: permissions allow, ask or deny it; then gates stop game material, decompiled code and commits of other agents' files">
<title>How an agent's command is checked: permissions allow, ask or deny it; then gates stop game material, decompiled code and commits of other agents' files</title>
