<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="On the Midway 8080 board a 19.968 MHz master clock gives the 8080 at 1.9968 MHz and a 4.992 MHz pixel clock. With totals of 320 by 262 the screen runs at about 59.54 Hz. The MB14241 shifter and analog sound sit beside it.">
<title>On the Midway 8080 board a 19.968 MHz master clock gives the 8080 at 1.9968 MHz and a 4.992 MHz pixel clock. With totals of 320 by 262 the screen runs at about 59.54 Hz. The MB14241 shifter and analog sound sit beside it.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE MIDWAY 8080 BOARD OF SPACE INVADERS</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">One crystal sets the CPU, the pixel clock and the refresh rate.</text>
<rect x="24.0" y="125.0" width="160.0" height="46.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="104.0" y="145.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">19.968 MHz</text>
<text x="104.0" y="161.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">master crystal</text>
<path d="M188 148.0C 244 148.0 244 113 300 113" fill="none" stroke="#8fa9a5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="304.0" y="90.0" width="210.0" height="46.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="409.0" y="110.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Intel 8080</text>
<text x="409.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">master / 10 = 1.9968 MHz</text>
<path d="M188 148.0C 244 148.0 244 183 300 183" fill="none" stroke="#8fa9a5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="304.0" y="160.0" width="210.0" height="46.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="409.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">pixel clock</text>
<text x="409.0" y="196.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">master / 4 = 4.992 MHz</text>
<path d="M520.0 183.0L560.0 183.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="564.0" y="156.0" width="300.0" height="54.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.25"/>
<text x="714.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">4.992 MHz / (320 x 262)</text>
<text x="714.0" y="196.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">about 59.54 Hz (computed)</text>
<rect x="24.0" y="250.0" width="260.0" height="54.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.22"/>
<text x="154.0" y="274.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Fujitsu MB14241</text>
<text x="154.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">shifter that helps draw sprites</text>
<rect x="300.0" y="250.0" width="260.0" height="54.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.22"/>
<text x="430.0" y="274.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">analog sound + SN76477</text>
<text x="430.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">part circuit, part chip</text>
<text x="24.0" y="336.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">An exact port needs the 8080 code, the shifter as the game uses it and a model of the analog sound.</text>
</svg>
