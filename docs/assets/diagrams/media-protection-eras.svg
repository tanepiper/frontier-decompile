<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Copy protection by era. Floppies used manual lookups, code wheels and key disks. CDs used disc checks, SafeDisc, SecuROM and StarForce. Online games use activation and Denuvo. The port needs none of it">
<title>Copy protection by era. Floppies used manual lookups, code wheels and key disks. CDs used disc checks, SafeDisc, SecuROM and StarForce. Online games use activation and Denuvo. The port needs none of it</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">COPY PROTECTION IN EACH ERA</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The port leaves out every protection check. Mark each check that it leaves out as not ported.</text>
<rect x="24.0" y="88.0" width="276.0" height="92.0" rx="5" fill="#f59e0b" stroke="none" fill-opacity="0.18"/>
<text x="38.0" y="112.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Floppy era</text>
<text x="38.0" y="136.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">manual lookups, code wheels,</text>
<text x="38.0" y="154.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">key disks with odd sectors</text>
<path d="M302.0 134.0L310.0 134.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="312.0" y="88.0" width="276.0" height="92.0" rx="5" fill="#60a5fa" stroke="none" fill-opacity="0.18"/>
<text x="326.0" y="112.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">CD era</text>
<text x="326.0" y="136.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">disc label, file or TOC checks,</text>
<text x="326.0" y="154.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">SafeDisc, SecuROM, StarForce</text>
<path d="M590.0 134.0L598.0 134.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="600.0" y="88.0" width="276.0" height="92.0" rx="5" fill="#c084fc" stroke="none" fill-opacity="0.18"/>
<text x="614.0" y="112.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Online era</text>
<text x="614.0" y="136.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">activation, account checks,</text>
<text x="614.0" y="154.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Denuvo, store wrappers</text>
<rect x="24.0" y="200.0" width="852.0" height="44.0" rx="5" fill="#2dd4bf" stroke="none" fill-opacity="0.12"/>
<text x="40.0" y="227.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">The port needs nothing from any of them. A manual lookup is part of the game's text. The project owner decides whether to keep it.</text>
<text x="24.0" y="278.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Prefer a release without protection. Many digital re-releases ship without the disc checks.</text>
</svg>
