<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="On Midway Zeus a TI TMS32C032 DSP at 60 MHz runs the game and drives the Zeus custom 3D controller. The Zeus chip has 512 registers in the CPU's address space and 16 MB of Wave RAM in two banks.">
<title>On Midway Zeus a TI TMS32C032 DSP at 60 MHz runs the game and drives the Zeus custom 3D controller. The Zeus chip has 512 registers in the CPU's address space and 16 MB of Wave RAM in two banks.</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">MIDWAY ZEUS (1997)</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The game logic runs on a DSP. Plan for a TMS320 disassembler or a small core.</text>
<rect x="40.0" y="100.0" width="220.0" height="70.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="150.0" y="132.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">TMS32C032 DSP</text>
<text x="150.0" y="148.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">60 MHz, runs the game</text>
<rect x="340.0" y="100.0" width="220.0" height="70.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="450.0" y="132.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Zeus</text>
<text x="450.0" y="148.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">Midway custom 3D controller</text>
<path d="M264.0 135.0L336.0 135.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="300.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">512 registers</text>
<rect x="640.0" y="84.0" width="220.0" height="46.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.25"/>
<text x="750.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Wave RAM bank 0</text>
<text x="750.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">8 MB</text>
<rect x="640.0" y="140.0" width="220.0" height="46.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.25"/>
<text x="750.0" y="160.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">Wave RAM bank 1</text>
<text x="750.0" y="176.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">8 MB</text>
<path d="M564.0 125.0L636.0 107.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M564.0 145.0L636.0 163.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="40.0" y="226.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Games: Mortal Kombat 4, Invasion. MAME's emulation is imperfect.</text>
<text x="40.0" y="244.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Check MAME's Zeus output against another record before trusting it as ground truth.</text>
</svg>
