<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="A Spectrum 48K frame is 312 lines of 224 T-states. On the 192 screen lines the ULA reads the screen for 128 T-states and delays the CPU by 6, 5, 4, 3, 2, 1, 0 and 0 T-states.">
