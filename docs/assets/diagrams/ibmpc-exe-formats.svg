<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="A PC file with no MZ magic is a COM file. In an MZ file, the offset at e_lfanew (0x3C) leads to an NE, LE, LX or PE header. The PE optional header magic tells PE32 from PE32+.">
<title>A PC file with no MZ magic is a COM file. In an MZ file, the offset at e_lfanew (0x3C) leads to an NE, LE, LX or PE header. The PE optional header magic tells PE32 from PE32+.</title>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">HOW TO IDENTIFY A PC EXECUTABLE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Check the magic first. The tools you need depend on the format more than on the CPU.</text>
<rect x="24.0" y="90.0" width="170.0" height="54.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="109.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">first two bytes</text>
<path d="M198.0 117.0L240.0 117.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="244.0" y="90.0" width="120.0" height="54.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="304.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">"MZ"?</text>
<path d="M304.0 148.0L304.0 196.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="312.0" y="178.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">no</text>
<rect x="244.0" y="200.0" width="120.0" height="54.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="304.0" y="224.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">COM</text>
<text x="304.0" y="240.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">raw, loaded at 100h</text>
<path d="M368.0 117.0L410.0 117.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="378.0" y="108.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">yes</text>
<rect x="414.0" y="90.0" width="180.0" height="54.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="504.0" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">read e_lfanew</text>
<text x="504.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">the dword at 0x3C</text>
<path d="M598.0 117.0L640.0 117.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="644.0" y="74.0" width="220.0" height="52.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="754.0" y="97.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">"NE"</text>
<text x="754.0" y="113.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">Win16, Windows 3.x</text>
<rect x="644.0" y="136.0" width="220.0" height="52.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="754.0" y="159.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">"LE" / "LX"</text>
<text x="754.0" y="175.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">DOS/4GW, OS/2 style</text>
<rect x="644.0" y="198.0" width="220.0" height="52.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.25"/>
<text x="754.0" y="221.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">"PE\0\0"</text>
<text x="754.0" y="237.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">Win32 and x64</text>
<rect x="644.0" y="260.0" width="220.0" height="52.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="754.0" y="283.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">nothing valid</text>
<text x="754.0" y="299.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">plain DOS MZ</text>
<text x="24.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">PE optional header magic</text>
<rect x="24.0" y="312.0" width="200.0" height="48.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.22"/>
<text x="124.0" y="333.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">0x10B: PE32</text>
<text x="124.0" y="349.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">32-bit</text>
<rect x="240.0" y="312.0" width="200.0" height="48.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.22"/>
<text x="340.0" y="333.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">0x20B: PE32+</text>
<text x="340.0" y="349.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">x64</text>
<text x="470.0" y="326.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">DJGPP: COFF behind a go32 stub.</text>
<text x="470.0" y="344.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Ghidra loads MZ, NE and PE. LE and LX need</text>
<text x="470.0" y="362.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">a community extension (not confirmed).</text>
</svg>
