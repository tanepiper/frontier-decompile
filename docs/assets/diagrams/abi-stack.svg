<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="The stack at a function's start: Windows x86 cdecl with three arguments, and Windows x64 with five">
<title>The stack at a function's start: Windows x86 cdecl with three arguments, and Windows x64 with five</title>
<rect x="0.5" y="0.5" width="899" height="379" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">ARGUMENTS AT A FUNCTION'S FIRST INSTRUCTION</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Higher addresses at the top. The stack grows down.</text>
<text x="40.0" y="86.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="start">x86 cdecl: f(a, b, c)</text>
<rect x="40.0" y="100.0" width="230.0" height="30.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
<rect x="40.0" y="100.0" width="4.0" height="30.0" rx="1" fill="#f59e0b" stroke="none"/>
<text x="54.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">c (pushed first)</text>
<text x="266.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="end">[esp+12]</text>
<rect x="40.0" y="134.0" width="230.0" height="30.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
<rect x="40.0" y="134.0" width="4.0" height="30.0" rx="1" fill="#f59e0b" stroke="none"/>
<text x="54.0" y="154.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">b</text>
<text x="266.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="end">[esp+8]</text>
<rect x="40.0" y="168.0" width="230.0" height="30.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
<rect x="40.0" y="168.0" width="4.0" height="30.0" rx="1" fill="#f59e0b" stroke="none"/>
<text x="54.0" y="188.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">a (pushed last)</text>
<text x="266.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="end">[esp+4]</text>
<rect x="40.0" y="202.0" width="230.0" height="30.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.22"/>
<rect x="40.0" y="202.0" width="4.0" height="30.0" rx="1" fill="#f87171" stroke="none"/>
<text x="54.0" y="222.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">return address</text>
<text x="266.0" y="222.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="end">[esp]</text>
<text x="40.0" y="260.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">After push ebp; mov ebp, esp the arguments are at</text>
<text x="40.0" y="276.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">[ebp+8], [ebp+12], [ebp+16]. The caller removes them.</text>
<text x="330.0" y="86.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="start">Windows x64: f(a, b, c, d, e)</text>
<rect x="330.0" y="100.0" width="230.0" height="30.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.22"/>
<rect x="330.0" y="100.0" width="4.0" height="30.0" rx="1" fill="#f59e0b" stroke="none"/>
<text x="344.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">e (fifth argument)</text>
<text x="556.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="end">[rsp+0x28]</text>
<rect x="330.0" y="134.0" width="230.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.22"/>
<rect x="330.0" y="134.0" width="4.0" height="30.0" rx="1" fill="#64748b" stroke="none"/>
<text x="344.0" y="154.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">shadow space for d</text>
<text x="556.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="end">[rsp+0x20]</text>
<rect x="330.0" y="168.0" width="230.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.22"/>
<rect x="330.0" y="168.0" width="4.0" height="30.0" rx="1" fill="#64748b" stroke="none"/>
<text x="344.0" y="188.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">shadow space for c</text>
<text x="556.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="end">[rsp+0x18]</text>
<rect x="330.0" y="202.0" width="230.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.22"/>
<rect x="330.0" y="202.0" width="4.0" height="30.0" rx="1" fill="#64748b" stroke="none"/>
<text x="344.0" y="222.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">shadow space for b</text>
<text x="556.0" y="222.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="end">[rsp+0x10]</text>
<rect x="330.0" y="236.0" width="230.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.22"/>
<rect x="330.0" y="236.0" width="4.0" height="30.0" rx="1" fill="#64748b" stroke="none"/>
<text x="344.0" y="256.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">shadow space for a</text>
<text x="556.0" y="256.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="end">[rsp+0x08]</text>
<rect x="330.0" y="270.0" width="230.0" height="30.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.22"/>
<rect x="330.0" y="270.0" width="4.0" height="30.0" rx="1" fill="#f87171" stroke="none"/>
<text x="344.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">return address</text>
<text x="556.0" y="290.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="end">[rsp]</text>
<text x="620.0" y="86.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="start">x64 passes the first four in registers</text>
<rect x="620.0" y="100.0" width="230.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="620.0" y="100.0" width="4.0" height="30.0" rx="1" fill="#60a5fa" stroke="none"/>
<text x="634.0" y="120.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">a</text>
<text x="846.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#60a5fa" text-anchor="end">rcx</text>
<rect x="620.0" y="134.0" width="230.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="620.0" y="134.0" width="4.0" height="30.0" rx="1" fill="#60a5fa" stroke="none"/>
<text x="634.0" y="154.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">b</text>
<text x="846.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#60a5fa" text-anchor="end">rdx</text>
<rect x="620.0" y="168.0" width="230.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="620.0" y="168.0" width="4.0" height="30.0" rx="1" fill="#60a5fa" stroke="none"/>
<text x="634.0" y="188.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">c</text>
<text x="846.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#60a5fa" text-anchor="end">r8</text>
<rect x="620.0" y="202.0" width="230.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="620.0" y="202.0" width="4.0" height="30.0" rx="1" fill="#60a5fa" stroke="none"/>
<text x="634.0" y="222.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">d</text>
<text x="846.0" y="222.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#60a5fa" text-anchor="end">r9</text>
<text x="620.0" y="268.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Floats go in xmm0 to xmm3 instead,</text>
<text x="620.0" y="286.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">by position: a float second argument</text>
<text x="620.0" y="304.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">is in xmm1, and rdx is unused.</text>
<text x="620.0" y="334.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">The caller reserves the 32 bytes of</text>
<text x="620.0" y="352.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">shadow space even for fewer arguments.</text>
<text x="40.0" y="352.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">docs/ABI.md lists every convention.</text>
</svg>
