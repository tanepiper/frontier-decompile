<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Each NAOMI cart has a 315-5881 with a key, an X76F100 secure flash and a CPLD. M4 carts decrypt with an FPGA and a PIC that holds a 32-bit key. GD-ROM games load through the DES of the DIMM board. Atomiswave uses an 8-bit key from the cart CPLD.">
<title>Each NAOMI cart has a 315-5881 with a key, an X76F100 secure flash and a CPLD. M4 carts decrypt with an FPGA and a PIC that holds a 32-bit key. GD-ROM games load through the DES of the DIMM board. Atomiswave uses an 8-bit key from the cart CPLD.</title>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">NAOMI, TRIFORCE AND CHIHIRO SECURITY</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each kind of media has its own decryption. Record the key with the dump.</text>
<rect x="24.0" y="80.0" width="204.0" height="160.0" rx="8" fill="#60a5fa" stroke="none" fill-opacity="0.15"/>
<text x="36.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="start">ROM cart</text>
<text x="36.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">315-5881, usually a key per game</text>
<text x="36.0" y="149.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">(e.g. Crazy Taxi 317-0248-COM)</text>
<text x="36.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">X76F100 secure flash</text>
<text x="36.0" y="187.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">315-6213 XC9536 CPLD</text>
<rect x="240.0" y="80.0" width="204.0" height="160.0" rx="8" fill="#c084fc" stroke="none" fill-opacity="0.15"/>
<text x="252.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="start">M4 cart</text>
<text x="252.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">Spartan XC3S50 FPGA</text>
<text x="252.0" y="149.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">PIC16C621A: 32-bit key</text>
<text x="252.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">stream cipher: 16-bit,</text>
<text x="252.0" y="187.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">2-round SP-network</text>
<rect x="456.0" y="80.0" width="204.0" height="160.0" rx="8" fill="#2dd4bf" stroke="none" fill-opacity="0.15"/>
<text x="468.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="start">M1 cart</text>
<text x="468.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">identified by an Actel ID</text>
<text x="468.0" y="149.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">takes a key as a parameter</text>
<rect x="672.0" y="80.0" width="204.0" height="160.0" rx="8" fill="#f59e0b" stroke="none" fill-opacity="0.15"/>
<text x="684.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="start">GD-ROM</text>
<text x="684.0" y="130.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">DIMM board 315-6322:</text>
<text x="684.0" y="149.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">SDRAM, DES decryption,</text>
<text x="684.0" y="168.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">host communication</text>
<text x="684.0" y="187.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">NAOMI, Triforce, Chihiro</text>
<text x="24.0" y="272.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">the key suffix</text>
<rect x="24.0" y="282.0" width="200.0" height="44.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.22"/>
<text x="124.0" y="301.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">-JPN</text>
<text x="124.0" y="317.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">needs the Japanese BIOS</text>
<rect x="240.0" y="282.0" width="200.0" height="44.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.22"/>
<text x="340.0" y="301.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">-COM</text>
<text x="340.0" y="317.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">runs with any BIOS</text>
<text x="470.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">M4 feed value resets every 16 blocks of 32 bytes.</text>
<text x="470.0" y="308.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Atomiswave: 8-bit key from the cart CPLD.</text>
<text x="470.0" y="326.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">MAME computes it from the decrypted code.</text>
<text x="24.0" y="382.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Six known NAOMI cart PCB types, 171-7885A to 171-8346C. Each cart has the three security parts in the first column.</text>
</svg>
