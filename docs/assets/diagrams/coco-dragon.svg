<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="The Dragon and the TRS-80 Color Computer use a 6809E with the MC6883 SAM for memory and timing and the MC6847 VDG for video. The CoCo 3 replaces them with the GIME. A speed-up poke doubles the clock.">
<title>The Dragon and the TRS-80 Color Computer use a 6809E with the MC6883 SAM for memory and timing and the MC6847 VDG for video. The CoCo 3 replaces them with the GIME. A speed-up poke doubles the clock.</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">DRAGON 32/64 AND COCO</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The SAM shares the RAM between the CPU and the video chip and sets the clock.</text>
<rect x="40.0" y="100.0" width="150.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="115.0" y="127.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">6809E</text>
<text x="115.0" y="143.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">0.89 MHz (Dragon 32)</text>
<rect x="300.0" y="100.0" width="170.0" height="60.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="385.0" y="127.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">MC6883 SAM</text>
<text x="385.0" y="143.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">memory and timing</text>
<rect x="580.0" y="100.0" width="150.0" height="60.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="655.0" y="127.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">MC6847 VDG</text>
<text x="655.0" y="143.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">video</text>
<rect x="300.0" y="210.0" width="170.0" height="50.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="385.0" y="232.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">RAM</text>
<text x="385.0" y="248.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">4 KB to 512 KB across the range</text>
<path d="M194.0 130.0L296.0 130.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M474.0 130.0L576.0 130.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M385.0 164.0L385.0 206.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="40.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">sound: a 6-bit DAC</text>
<text x="590.0" y="200.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">CoCo 3 (1986-1991):</text>
<text x="590.0" y="218.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">the GIME chip replaces</text>
<text x="590.0" y="236.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">SAM and VDG, with a</text>
<text x="590.0" y="254.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">64-colour palette.</text>
<text x="40.0" y="294.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A "speed-up poke" doubles the clock on some machines. Record whether the game sets it, and the model.</text>
</svg>
