<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Atari System 1 is a BIOS board with game cartridges. A 68010 runs the game and a 6502 runs the sound with a YM2151, a POKEY and a TMS5220C. System 2 uses a DEC T-11. The GT board uses a 68EC020 with the CAGE sound board.">
<title>Atari System 1 is a BIOS board with game cartridges. A 68010 runs the game and a 6502 runs the sound with a YM2151, a POKEY and a TMS5220C. System 2 uses a DEC T-11. The GT board uses a 68EC020 with the CAGE sound board.</title>
<rect x="0.5" y="0.5" width="899" height="379" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">ATARI SYSTEM 1, SYSTEM 2 AND GT</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Every board has a separate sound CPU. Each CPU is a separate program to trace.</text>
<text x="24.0" y="116.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">System 1 (1984)</text>
<rect x="170.0" y="86.0" width="160.0" height="52.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="250.0" y="109.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">MC68010</text>
<text x="250.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">7.16 MHz, game</text>
<rect x="338.0" y="86.0" width="150.0" height="52.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="413.0" y="109.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">6502</text>
<text x="413.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">1.79 MHz, sound</text>
<rect x="496.0" y="86.0" width="170.0" height="52.0" rx="6" fill="#f87171" stroke="none" fill-opacity="0.25"/>
<text x="581.0" y="109.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">YM2151, POKEY</text>
<text x="581.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">TMS5220C speech</text>
<text x="170.0" y="158.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">BIOS board + game cartridges. 336 x 240, about 59.92 Hz.</text>
<text x="24.0" y="208.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">System 2 (1984)</text>
<rect x="170.0" y="178.0" width="160.0" height="52.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="250.0" y="201.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">DEC T-11</text>
<text x="250.0" y="217.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">10 MHz, game</text>
<rect x="338.0" y="178.0" width="150.0" height="52.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="413.0" y="201.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">6502</text>
<text x="413.0" y="217.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">as System 1</text>
<text x="170.0" y="250.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Paperboy. 512 x 384, about 60.10 Hz. No tool here supports the T-11.</text>
<text x="24.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">GT (1994)</text>
<rect x="170.0" y="270.0" width="160.0" height="52.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="250.0" y="293.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">MC68EC020</text>
<text x="250.0" y="309.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">25 MHz, game</text>
<rect x="338.0" y="270.0" width="150.0" height="52.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="413.0" y="293.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">CAGE</text>
<text x="413.0" y="309.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">sound board</text>
<text x="170.0" y="342.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">T-MEK, Primal Rage. About 59.92 Hz.</text>
</svg>
