<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Saving and loading objects that point at each other: pointers are written as ids, loading creates every object, then a second pass turns ids back into pointers">
<title>Saving and loading objects that point at each other: pointers are written as ids, loading creates every object, then a second pass turns ids back into pointers</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">POINTERS IN A SAVE</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Writing turns each pointer into the target's id. Loading reads all objects, then fixes the ids.</text>
<rect x="60.0" y="110.0" width="200.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="160.0" y="134.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">#1 farmer</text>
<text x="160.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#f59e0b" text-anchor="middle">home: #2</text>
<rect x="330.0" y="110.0" width="200.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="430.0" y="134.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">#2 house</text>
<text x="430.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#f59e0b" text-anchor="middle">owner: #1</text>
<rect x="600.0" y="110.0" width="200.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="700.0" y="134.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">#3 field</text>
<text x="700.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#f59e0b" text-anchor="middle">worker: #1</text>
<text x="60.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">pass 1: create every object, with the ids as read</text>
<g opacity="0"><path d="M160 172C 160 230 430 230 430 174" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/><path d="M430 172C 430 260 160 260 160 174" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 172C 700 290 160 290 160 174" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="310" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4ade80">pass 2: each id replaced by a pointer to that object</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.5;1" dur="5s" repeatCount="indefinite"/></g>
</svg>
