<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Drawing on the Atari 2600, with one scanline of 76 CPU cycles and one NTSC frame of 262 lines">
<title>Drawing on the Atari 2600, with one scanline of 76 CPU cycles and one NTSC frame of 262 lines</title>
<rect x="0.5" y="0.5" width="899" height="379" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">DRAWING ON THE ATARI 2600</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The Atari 2600 has no frame buffer, so the program writes the TIA as the beam moves along each line.</text>
<text x="40.0" y="94.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">one scanline: 228 colour clocks = 76 CPU cycles</text>
<rect x="40.0" y="104.0" width="165.0" height="34.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.35"/>
<text x="123.5" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">blank: 68</text>
<rect x="207.0" y="104.0" width="393.0" height="34.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="403.5" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">visible: 160 pixels</text>
<rect x="40" y="100" width="3" height="42" fill="#f59e0b"><animate attributeName="x" values="40;597" dur="1.2s" repeatCount="indefinite"/></rect>
<text x="44.0" y="178.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">STA WSYNC waits for the next line.</text>
<text x="44.0" y="194.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Writes to GRP0 must land before the beam reaches the sprite.</text>
<text x="44.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">A write in the middle of the line changes the rest of that line.</text>
<text x="660.0" y="92.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">one NTSC frame: 262 lines</text>
<rect x="660.0" y="104.0" width="110.0" height="10.0" rx="2" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="778.0" y="114.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">VSYNC 3</text>
<rect x="660.0" y="116.0" width="110.0" height="31.3" rx="2" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="778.0" y="127.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">VBLANK 37</text>
<rect x="660.0" y="149.3" width="110.0" height="170.8" rx="2" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="778.0" y="160.3" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">visible 192</text>
<rect x="660.0" y="322.1" width="110.0" height="25.0" rx="2" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="778.0" y="333.1" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">overscan 30</text>
<rect x="660" y="104" width="110" height="2" fill="#f59e0b"><animate attributeName="y" values="104;347.1" dur="4s" repeatCount="indefinite"/></rect>
<text x="40.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Game logic runs in the VBLANK and overscan lines. During the visible lines, the code</text>
<text x="40.0" y="317.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">writes the TIA to draw the drawing. A port must model the CPU cycles in each line, so</text>
<text x="40.0" y="334.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">take ground truth from cycle-exact emulator traces.</text>
</svg>
