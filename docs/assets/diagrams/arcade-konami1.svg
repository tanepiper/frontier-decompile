<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Konami-1 is a 6809 that XORs each opcode byte with 0x22, 0x82, 0x28 or 0x88, chosen by address bits 1 and 3. Data bytes are left alone.">
