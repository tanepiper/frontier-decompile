<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="A Westwood MIX archive names its entries by a hash of the file name. The index holds the hash, the offset and the size of each entry. The names themselves are not stored">
<title>A Westwood MIX archive names its entries by a hash of the file name. The index holds the hash, the offset and the size of each entry. The names themselves are not stored</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">FILE NAMES STORED AS HASHES IN WESTWOOD MIX ARCHIVES</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">From Command &amp; Conquer on, the index stores a hash of each file name. The name itself is not stored.</text>
<rect x="24.0" y="92.0" width="150.0" height="40.0" rx="4" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="99.0" y="116.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">"RULES.INI"</text>
<path d="M176.0 112.0L216.0 112.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="220.0" y="92.0" width="140.0" height="40.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.25"/>
<text x="290.0" y="116.2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">hash function</text>
<path d="M362.0 112.0L402.0 112.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="406.0" y="92.0" width="120.0" height="40.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="466.0" y="109.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">an id</text>
<text x="466.0" y="125.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8fa9a5" text-anchor="middle">32 bits</text>
<text x="560.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">The game hashes the name it wants,</text>
<text x="560.0" y="122.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">then finds that id in the index.</text>
<rect x="24.0" y="160.0" width="852.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.15"/>
<rect x="24.0" y="160.0" width="146.0" height="30.0" rx="4" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="97.0" y="178.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">count, body size</text>
<rect x="178.0" y="160.0" width="296.0" height="30.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.25"/>
<text x="326.0" y="178.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">index of id, offset and size per entry</text>
<rect x="482.0" y="160.0" width="390.0" height="30.0" rx="4" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="677.0" y="178.8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">the files' data</text>
<text x="24.0" y="222.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">A listing of a MIX shows only ids. Names come from the game's strings, from other tools'</text>
<text x="24.0" y="240.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">name lists, or from guessing and hashing. Dune II and Lands of Lore used .PAK archives with names.</text>
<text x="24.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">Rules for units and buildings are in INI files, so read them before the code.</text>
</svg>
