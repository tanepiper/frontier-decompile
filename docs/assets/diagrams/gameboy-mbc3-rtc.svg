<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="The MBC3 clock registers, the latch and the bits of the DH register">
<title>The MBC3 clock registers, the latch and the bits of the DH register</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE MBC3 REAL-TIME CLOCK</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">A 32.768 kHz crystal and a battery keep the clock running when the power is off.</text>
<text x="40.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">write to $4000-$5FFF to select</text>
<rect x="40.0" y="108.0" width="230.0" height="26.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="50.0" y="126.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">$08</text>
<text x="96.0" y="126.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">seconds</text>
<rect x="40.0" y="138.0" width="230.0" height="26.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="50.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">$09</text>
<text x="96.0" y="156.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">minutes</text>
<rect x="40.0" y="168.0" width="230.0" height="26.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="50.0" y="186.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">$0A</text>
<text x="96.0" y="186.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">hours</text>
<rect x="40.0" y="198.0" width="230.0" height="26.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.25"/>
<text x="50.0" y="216.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">$0B</text>
<text x="96.0" y="216.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">day, low 8 bits</text>
<rect x="40.0" y="228.0" width="230.0" height="26.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.25"/>
<text x="50.0" y="246.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">$0C</text>
<text x="96.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">DH</text>
<text x="330.0" y="96.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">DH, the clock's top register</text>
<rect x="330.0" y="108.0" width="64.0" height="30.0" rx="3" fill="#f87171" stroke="none" fill-opacity="0.3"/>
<text x="362.0" y="127.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">carry</text>
<rect x="396.0" y="108.0" width="64.0" height="30.0" rx="3" fill="#f59e0b" stroke="none" fill-opacity="0.3"/>
<text x="428.0" y="127.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">halt</text>
<rect x="462.0" y="108.0" width="328.0" height="30.0" rx="3" fill="#64748b" stroke="none" fill-opacity="0.3"/>
<text x="626.0" y="127.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">unused</text>
<rect x="792.0" y="108.0" width="64.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.3"/>
<text x="824.0" y="127.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e2ece9" text-anchor="middle">day 8</text>
<text x="362.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">7</text>
<text x="428.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">6</text>
<text x="494.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">5</text>
<text x="560.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">4</text>
<text x="626.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">3</text>
<text x="692.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">2</text>
<text x="758.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">1</text>
<text x="824.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#8fa9a5" text-anchor="middle">0</text>
<text x="330.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">The day counter is 9 bits, 0 to 511. Carry stays set until software clears it.</text>
<text x="330.0" y="230.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="start">To latch the time, write $00, then $01, to $6000-$7FFF</text>
<rect x="330.0" y="242.0" width="110.0" height="34.0" rx="5" fill="#64748b" stroke="#64748b" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="385.0" y="263.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">$00</text>
<path d="M442.0 259.0L470.0 259.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="474.0" y="242.0" width="110.0" height="34.0" rx="5" fill="#64748b" stroke="#64748b" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="529.0" y="263.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">$01</text>
<path d="M586.0 259.0L614.0 259.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="618.0" y="242.0" width="240.0" height="34.0" rx="5" fill="#2dd4bf" stroke="#2dd4bf" fill-opacity="0.2" stroke-opacity="0.65"/>
<text x="738.0" y="263.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">the time is frozen for reading</text>
<text x="40.0" y="330.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">A save file needs the clock state beside the RAM. That is the latched values, the halt flag and the carry flag.</text>
</svg>
