<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Taito JC has a 68040 and a TMS320C51 DSP. Konami GTI Club and Hornet have a PowerPC 403GA and up to two SHARCs. Gaelco 3D has a 68000 and an ADSP-2115 sound DSP.">
<title>Taito JC has a 68040 and a TMS320C51 DSP. Konami GTI Club and Hornet have a PowerPC 403GA and up to two SHARCs. Gaelco 3D has a 68000 and an ADSP-2115 sound DSP.</title>
<rect x="0.5" y="0.5" width="899" height="319" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">TAITO JC, KONAMI HORNET, GAELCO 3D</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">A general CPU and a DSP on every board. Expect two or more instruction sets.</text>
<text x="24.0" y="112.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">Taito JC (1995)</text>
