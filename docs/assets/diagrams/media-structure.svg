<text x="600.0" y="240.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">three records of 24 bytes.</text>
<text x="24.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Also look for byte order (00 00 01 2C is 300 big-endian), floats (00 00 80 3F is 1.0) and UTF-16 text.</text>
