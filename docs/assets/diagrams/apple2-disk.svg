<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="On the Disk II, software controls the GCR encoding, so publishers wrote their own formats. A DSK image keeps only 35 tracks of 16 sectors. A WOZ image keeps the bits and timing of each track.">
<title>On the Disk II, software controls the GCR encoding, so publishers wrote their own formats. A DSK image keeps only 35 tracks of 16 sectors. A WOZ image keeps the bits and timing of each track.</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">DISK II AND ITS IMAGES</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Software writes the bits on a Disk II, so a publisher could change the format as protection.</text>
<circle cx="150" cy="210" r="120" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="117" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
