<circle cx="150" cy="210" r="108" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="105" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="102" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="99" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="96" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="93" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="90" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="87" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="84" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="81" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="78" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="75" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="72" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="69" fill="none" stroke="#f87171" stroke-opacity="0.7" stroke-width="2"/>
<circle cx="150" cy="210" r="66" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="63" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="60" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="57" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="54" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="51" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="48" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="45" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="42" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="39" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="36" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="33" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="30" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="27" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="24" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="21" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="18" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>
<circle cx="150" cy="210" r="14" fill="#0d1b1e" stroke="#8fa9a5"/>
<g><path d="M150 90L150 192" stroke="#f59e0b" stroke-width="2"/><animateTransform attributeName="transform" type="rotate" values="0 150 210;360 150 210" dur="3s" repeatCount="indefinite"/></g>
<text x="150.0" y="350.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">35 tracks; track 17 (red) holds the catalog</text>
<text x="330.0" y="100.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">what each image keeps</text>
<rect x="330.0" y="112.0" width="250.0" height="64.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.25"/>
<text x="455.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">DSK, DO, PO</text>
<text x="455.0" y="157.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">35 x 16 sectors x 256 = 140 KB</text>
<rect x="600.0" y="112.0" width="250.0" height="64.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.25"/>
<text x="725.0" y="141.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="middle">WOZ</text>
<text x="725.0" y="157.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">the bits of each track and their timing</text>
<text x="330.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Protections a DSK image loses:</text>
<text x="330.0" y="228.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">- custom sector formats</text>
<text x="330.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">- nibble counts</text>
<text x="330.0" y="264.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">- spiral tracks</text>
<text x="330.0" y="282.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">- changed address and data marks</text>
<text x="600.0" y="210.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">GCR: each byte on disk has its</text>
<text x="600.0" y="228.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">high bit set. DOS 3.3 packs 6 bits</text>
<text x="600.0" y="246.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">into each disk byte (6-and-2).</text>
<text x="600.0" y="264.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start"></text>
<text x="600.0" y="282.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">Keep the WOZ image as the record</text>
<text x="600.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa9a5" text-anchor="start">of a protected disk.</text>
</svg>
