<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="The STE from 1989 adds a Blitter, fine scrolling, DMA sound and 4096 colours. The Mega STE runs at 16 MHz. The TT030 and Falcon030 use a 68030, and the Falcon adds a 56001 DSP.">
<title>The STE from 1989 adds a Blitter, fine scrolling, DMA sound and 4096 colours. The Mega STE runs at 16 MHz. The TT030 and Falcon030 use a 68030, and the Falcon adds a 56001 DSP.</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">STE, MEGA STE, TT030 AND FALCON030</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Each model adds hardware the ST lacks. Record the model with each capture.</text>
<rect x="24.0" y="80.0" width="202.0" height="190.0" rx="8" fill="#2dd4bf" stroke="none" fill-opacity="0.15"/>
<text x="38.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2ece9" text-anchor="start">STE</text>
<text x="212.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">late 1989</text>
<text x="38.0" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start">68000 at 8 MHz</text>
<text x="38.0" y="156.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Blitter, fine scrolling</text>
<text x="38.0" y="176.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">split screen</text>
<text x="38.0" y="196.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">8-bit stereo DMA sound</text>
<text x="38.0" y="216.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">4096 colours</text>
<rect x="240.0" y="80.0" width="202.0" height="190.0" rx="8" fill="#60a5fa" stroke="none" fill-opacity="0.15"/>
<text x="254.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2ece9" text-anchor="start">Mega STE</text>
<text x="254.0" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="start">68000 at 16 MHz</text>
<text x="254.0" y="156.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">as the STE</text>
<rect x="456.0" y="80.0" width="202.0" height="190.0" rx="8" fill="#c084fc" stroke="none" fill-opacity="0.15"/>
<text x="470.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2ece9" text-anchor="start">TT030</text>
<text x="470.0" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="start">68030</text>
<text x="470.0" y="156.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">32-bit CPU</text>
<rect x="672.0" y="80.0" width="202.0" height="190.0" rx="8" fill="#f59e0b" stroke="none" fill-opacity="0.15"/>
<text x="686.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2ece9" text-anchor="start">Falcon030</text>
<text x="860.0" y="106.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="end">1992</text>
<text x="686.0" y="128.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="start">68030</text>
<text x="686.0" y="156.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">Motorola 56001 DSP</text>
<text x="686.0" y="176.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">export the DSP code apart</text>
<text x="686.0" y="196.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="start">from the 68030 code</text>
<text x="24.0" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">RAM to 4 MB on the STE. TOS 1.06 to 2.00.</text>
</svg>
