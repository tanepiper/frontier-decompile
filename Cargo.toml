[workspace]
resolver = "2"
members = ["crates/formats", "crates/opl", "crates/dos", "crates/game", "crates/hooks", "crates/platform", "apps/game", "apps/viewer"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tanepiper/frontier-decompile"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
