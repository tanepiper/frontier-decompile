# DOSBox Staging config for running the original Frontier: Elite II as a reference.
# tools/dosbox/run.sh mounts game-data/run (a writable copy of game-data/original) as C:.

[sdl]
fullscreen = false
window_size = 1280x960

[dosbox]
machine = svga_s3
memsize = 16

[cpu]
core = auto
cputype = auto
cpu_cycles = 25000

[render]
aspect = auto
integer_scaling = auto

[mixer]
rate = 48000

[sblaster]
sbtype = sb16

[speaker]
pcspeaker = impulse

[dos]
xms = true
ems = true
umb = true

# No [autoexec]: run.sh mounts C: and starts the game with -c, in order.
